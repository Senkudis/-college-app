name: Build iOS App

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر
    inputs:
      upload:
        description: 'رفع النسخة الموقّعة إلى TestFlight'
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

# التوقيع يتم عبر مفتاح App Store Connect API: ينشئ شهادة وملف provisioning مؤقتين
# لكل تشغيل (scripts/ios-ci-signing.cjs) ثم يحذفهما. بدون الأسرار الثلاثة يبني نسخة غير موقّعة فقط
# للتأكد أن المشروع يُترجم. معرّف الفريق ليس سراً: مثبّت في project.pbxproj
# (DEVELOPMENT_TEAM) ويمكن تجاوزه بسر APPLE_TEAM_ID.
#   ASC_KEY_ID      — Key ID لمفتاح App Store Connect API (صلاحية Admin)
#   ASC_ISSUER_ID   — Issuer ID الظاهر أعلى صفحة المفاتيح
#   ASC_KEY_P8      — محتوى ملف AuthKey_XXXX.p8 كما هو
jobs:
  build:
    name: Build iOS (Xcode & Capacitor)
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'T2QRZLMA3C' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      # يعيد توليد CapApp-SPM/Package.swift بمسارات ماك (المولَّد على ويندوز فيه \)
      - name: 🔄 Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 🛠️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🔍 Check signing secrets
        id: signing
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::أسرار التوقيع غير مكتملة — سيُبنى التطبيق بدون توقيع (لا يُثبَّت ولا يُرفع)."
          fi

      # ---------- نسخة غير موقّعة (عند غياب الأسرار) ----------
      - name: 📱 Build iOS Archive (Unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 📦 Package App into Payload / IPA
        if: steps.signing.outputs.enabled != 'true'
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App-unsigned.ipa Payload
          cd ..

      - name: 📤 Upload iOS App Artifact
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Build
          path: |
            build/App-unsigned.ipa
            build/App.xcarchive/Products/Applications/App.app
          retention-days: 14

      # ---------- نسخة موقّعة + رفع إلى TestFlight ----------
      # التوقيع التلقائي يحتاج Development profile وجهازاً مسجَّلاً؛ الحساب بلا أجهزة،
      # لذلك: شهادة Distribution + App Store profile مؤقتان عبر API، ويُحذفان في النهاية.
      - name: 🔑 Create temporary signing certificate & profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          PROFILE_NAME: CBS CI ${{ github.run_id }}
        run: |
          set -e
          SIGN="$RUNNER_TEMP/signing"; mkdir -p "$RUNNER_TEMP/keys" "$SIGN"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          echo "SIGN_DIR=$SIGN" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          /usr/bin/openssl genrsa -out "$SIGN/key.pem" 2048
          /usr/bin/openssl req -new -key "$SIGN/key.pem" -out "$SIGN/csr.pem" -subj "/CN=CBS CI/O=$APPLE_TEAM_ID"
          node scripts/ios-ci-signing.cjs setup "$SIGN/csr.pem" "$SIGN"

          KC="$RUNNER_TEMP/ci.keychain-db"; KC_PW="$(uuidgen)"
          /usr/bin/openssl x509 -inform DER -in "$SIGN/cert.cer" -out "$SIGN/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/cert.p12" -passout pass:"$KC_PW"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$SIGN/cert.p12" -k "$KC" -P "$KC_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"

          UUID=$(node -p "require('$SIGN/state.json').profileUuid")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done

      # توقيع يدوي لهدف App وحده في Release (تمرير PROVISIONING_PROFILE_SPECIFIER من سطر
      # الأوامر يطبّقه على حزم SPM أيضاً فيفشل)، و aps-environment=production لنسخ App Store
      - name: ✍️ Switch App target to manual distribution signing
        if: steps.signing.outputs.enabled == 'true'
        run: |
          node -e '
            const fs = require("fs"); const f = "ios/App/App.xcodeproj/project.pbxproj";
            let s = fs.readFileSync(f, "utf8"); let hits = 0;
            s = s.replace(/\/\* Release \*\/ = \{\n\t\t\tisa = XCBuildConfiguration;[\s\S]*?\n\t\t\};/g, (blk) => {
              if (!blk.includes("CODE_SIGN_ENTITLEMENTS")) return blk;
              hits++;
              return blk.replace("CODE_SIGN_STYLE = Automatic;",
                `CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "${process.env.PROFILE_NAME}";`);
            });
            if (hits !== 1) { console.error("App Release config not found"); process.exit(1); }
            fs.writeFileSync(f, s);
          '
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/App/App/App.entitlements

      - name: 📱 Build iOS Archive (Signed)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      # destination=upload يرفع مباشرة إلى App Store Connect؛ export يكتفي بملف IPA
      - name: 🚀 Export IPA / Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then
            DEST=export
          elif [ "${{ github.event_name }}" = "push" ]; then
            DEST=export
          else
            DEST=upload
          fi
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.elnasrcsit.cbs</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### iOS: $DEST" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEST" = "upload" ]; then
            echo "تم الرفع إلى App Store Connect — تظهر النسخة في TestFlight بعد المعالجة (15-30 دقيقة)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload signed IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Signed
          path: build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      # حذف الشهادة والـ profile المؤقتين لا يؤثر على النسخ المرفوعة، ويمنع امتلاء حد الشهادات
      - name: 🧹 Revoke temporary certificate & remove keys
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          [ -n "$SIGN_DIR" ] && node scripts/ios-ci-signing.cjs cleanup "$SIGN_DIR" || true
          [ -n "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
