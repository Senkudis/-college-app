<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
  if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الإشعارات | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <style>
    /* صندوق وارد: مجموعات حسب اليوم، غير المقروء بنقطة وعنوان أثقل، والنص يتسع عند الضغط */
    .nt-day { margin: 18px 2px 8px; font-size: 0.8rem; font-weight: 800; color: var(--text-muted); }
    .nt-day:first-child { margin-top: 0; }
    .nt-row { align-items: flex-start; padding-block: 12px; cursor: pointer; }
    .nt-row .hm-row-title { white-space: normal; font-weight: 600; color: var(--text-muted); }
    .nt-row.unread .hm-row-title { font-weight: 800; color: var(--text-main); }
    .nt-row .nt-msg { margin-top: 3px; font-size: 0.82rem; line-height: 1.6; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nt-row.open .nt-msg { display: block; -webkit-line-clamp: unset; }
    .nt-end { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .nt-time { font-size: 0.72rem; color: var(--text-light); white-space: nowrap; }
    .nt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
    .nt-row.emergency .nt-dot { background: var(--danger-solid); }
    .nt-x { margin-inline-start: 6px; font-size: 0.72rem; font-weight: 800; color: var(--text-muted); }
    .nt-row .ui-icon-btn { width: 32px !important; height: 32px !important; min-width: 32px !important; min-height: 32px !important; font-size: 1rem; }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>النظام الجامعي المتكامل</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.goHome()" title="الرئيسية"><i class="ri-home-4-line"></i></button>
  </div>
</header>

<div class="page-content">

  <!-- العنوان في الترويسة؛ هنا الأدوات والقائمة فقط -->
  <div class="welcome-banner"><div class="welcome-banner-body"><h2>الإشعارات</h2></div></div>

  <div class="ui-toolbar" role="search">
    <div class="ui-search"><i class="ri-search-line"></i><input type="search" id="notifSearch" placeholder="ابحث في الإشعارات" aria-label="ابحث في الإشعارات"></div>
    <button type="button" class="ui-act primary" id="readAllBtn" onclick="markAllRead()" style="display:none;min-height:44px" title="تعيين الكل كمقروء"><i class="ri-check-double-line"></i> قراءة الكل</button>
  </div>

  <!-- تبويبات + قائمة تصنيف منسدلة صارت صف شرائح واحد -->
  <div class="ui-chips" id="notifTabs" aria-label="تصفية الإشعارات">
    <button type="button" class="ui-chip" data-tab="all" onclick="setTab('all')">الكل <span class="n" id="tabCountAll"></span></button>
    <button type="button" class="ui-chip" data-tab="unread" onclick="setTab('unread')">غير مقروء <span class="n" id="tabCountUnread"></span></button>
    <button type="button" class="ui-chip" data-tab="emergency" onclick="setTab('emergency')">عاجل <span class="n" id="tabCountEmergency"></span></button>
    <button type="button" class="ui-chip" data-tab="assignment" onclick="setTab('assignment')">الواجبات</button>
    <button type="button" class="ui-chip" data-tab="quiz" onclick="setTab('quiz')">الاختبارات</button>
    <button type="button" class="ui-chip" data-tab="attendance" onclick="setTab('attendance')">الحضور</button>
    <button type="button" class="ui-chip" data-tab="announcement" onclick="setTab('announcement')">الإعلانات</button>
  </div>

  <div id="notifList" role="log" aria-live="polite" aria-busy="false"></div>

</div>

<div id="toast-container"></div>

<footer class="main-footer">
  جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل
</footer>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init({ polling: false });
  const user = CBS.getUser();
  let _allNotifs = [];
  let _activeTab = 'all';
  let _notificationGroups = {};
  let _snoozedNotifs = {};
  try { _snoozedNotifs = JSON.parse(localStorage.getItem('snoozedNotifications') || '{}') || {}; } catch { _snoozedNotifs = {}; }

  function notifCategory(n) {
    const text = `${n.type || ''} ${n.title || ''} ${n.message || ''}`.toLowerCase();
    if (n.type === 'emergency' || text.includes('عاجل') || text.includes('emergency')) return 'emergency';
    if (/واجب|تسليم|assignment|submission/.test(text)) return 'assignment';
    if (/اختبار|امتحان|quiz|exam/.test(text)) return 'quiz';
    if (/حضور|غياب|attendance/.test(text)) return 'attendance';
    return 'announcement';
  }
  function isSnoozed(n) {
    const until = Number(_snoozedNotifs[n._id] || 0);
    if (!until) return false;
    if (until <= Date.now()) { delete _snoozedNotifs[n._id]; return false; }
    return true;
  }
  function saveSnoozed() { localStorage.setItem('snoozedNotifications', JSON.stringify(_snoozedNotifs)); }
  function setTab(tab) {
    _activeTab = tab;
    document.querySelectorAll('#notifTabs .ui-chip').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.tab === tab)));
    renderNotifs();
  }

  const CAT_ICON = { emergency: 'ri-alarm-warning-line', assignment: 'ri-task-line', quiz: 'ri-question-answer-line', attendance: 'ri-calendar-check-line', announcement: 'ri-megaphone-line' };
  function dayLabel(d) {
    const day = x => { const y = new Date(x); y.setHours(0, 0, 0, 0); return y.getTime(); };
    const diff = Math.round((day(Date.now()) - day(d)) / 864e5);
    if (diff <= 0) return 'اليوم';
    if (diff === 1) return 'أمس';
    if (diff < 7) return 'هذا الأسبوع';
    return 'أقدم';
  }
  function timeLabel(d) {
    const dt = new Date(d), mins = Math.round((Date.now() - dt) / 60000);
    if (mins < 1) return 'الآن';
    if (mins < 60) return `منذ ${mins} د`;
    if (mins < 24 * 60) return dt.toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit' });
    return dt.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' });
  }

  function renderNotifs() {
    const list = document.getElementById('notifList');
    const term = (document.getElementById('notifSearch')?.value || '').trim().toLowerCase();
    const cats = ['assignment', 'quiz', 'attendance', 'announcement'];
    let data = _allNotifs.filter(n => {
      const unread = !n.readBy?.includes(user.id);
      const text = `${n.title || ''} ${n.message || ''}`.toLowerCase();
      const tabOk = _activeTab === 'all' || (_activeTab === 'unread' && unread)
        || (_activeTab === 'emergency' && notifCategory(n) === 'emergency')
        || (cats.includes(_activeTab) && notifCategory(n) === _activeTab);
      return tabOk && (!term || text.includes(term)) && !isSnoozed(n);
    });

    if (!data.length) {
      list.innerHTML = `<div class="hm-list"><div class="hm-row hm-empty"><span class="hm-ic" data-tone="info"><i class="ri-notification-off-line"></i></span><div class="hm-row-body"><div class="hm-row-title">لا إشعارات هنا</div><div class="hm-row-meta">${term ? 'جرّب كلمة بحث أخرى' : 'ستظهر هنا إعلانات الكلية والدكاترة'}</div></div></div></div>`;
      return;
    }

    // نفس الإشعار المكرر خلال يوم يُعرض مرة واحدة بعدّاد
    const grouped = new Map();
    data.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)).forEach(n => {
      const key = `${notifCategory(n)}:${String(n.title || n.message || '').trim().toLowerCase()}`;
      if (!grouped.has(key)) grouped.set(key, []);
      const items = grouped.get(key);
      const firstTime = items[0] ? new Date(items[0].createdAt || 0).getTime() : Date.now();
      if (items.length && Math.abs(firstTime - new Date(n.createdAt || 0).getTime()) > 864e5) grouped.set(`${key}:${n._id}`, [n]);
      else items.push(n);
    });

    _notificationGroups = {};
    const byDay = new Map();
    [...grouped.values()].forEach(items => {
      const label = dayLabel(items[0].createdAt);
      if (!byDay.has(label)) byDay.set(label, []);
      byDay.get(label).push(items);
    });

    list.innerHTML = [...byDay.entries()].map(([label, groups]) => `<h2 class="nt-day">${label}</h2><div class="hm-list">` + groups.map(items => {
      const first = items[0];
      const groupId = `g-${first._id}`;
      _notificationGroups[groupId] = items.map(item => item._id);
      const unread = items.some(n => !n.readBy?.includes(user.id));
      const cat = notifCategory(first);
      const emergency = cat === 'emergency';
      return `<div class="hm-row nt-row${unread ? ' unread' : ''}${emergency ? ' emergency' : ''}" id="${groupId}" role="button" tabindex="0"
          onclick="openNotif('${groupId}')" onkeydown="if(event.key==='Enter'){openNotif('${groupId}')}">
        <span class="hm-ic"${emergency ? ' data-tone="danger"' : ''}><i class="${CAT_ICON[cat]}"></i></span>
        <div class="hm-row-body">
          <div class="hm-row-title">${CBS.escapeHTML(first.title)}${items.length > 1 ? `<span class="nt-x">×${items.length}</span>` : ''}</div>
          <div class="nt-msg">${CBS.escapeHTML(first.message)}</div>
        </div>
        <div class="nt-end">
          <span class="nt-time">${timeLabel(first.createdAt)}</span>
          ${unread ? '<span class="nt-dot" aria-label="غير مقروء"></span>' : ''}
          <button type="button" class="ui-icon-btn" onclick="event.stopPropagation();snoozeGroup('${groupId}', 60)" title="تأجيل ساعة" aria-label="تأجيل ساعة"><i class="ri-time-line"></i></button>
        </div>
      </div>`;
    }).join('') + '</div>').join('');
  }

  // الضغط يفتح النص كاملاً ويعلّمه مقروءاً
  function openNotif(groupId) {
    const row = document.getElementById(groupId);
    row?.classList.toggle('open');
    if (row?.classList.contains('unread')) markGroupRead(groupId);
  }

  async function loadNotifications() {
    const list = document.getElementById('notifList');
    list?.setAttribute('aria-busy', 'true');
    CBS.showLoading('notifList', 'جاري التحميل...', 'skeleton-list');
    try {
      const res = await CBS.apiGet('/api/notifications');
      const _resData = await CBS.readJson(res);
      _allNotifs = _resData.data?.notifications || _resData.notifications || _resData.data || _resData;
      if (!Array.isArray(_allNotifs)) _allNotifs = [];

            // Update tab counts
      updateNotifCounts();

      renderNotifs();
    } catch {
      CBS.showEmpty('notifList', 'حدث خطأ في تحميل الإشعارات', 'ri-error-warning-line');
    } finally {
      list?.setAttribute('aria-busy', 'false');
    }
  }

  function updateNotifCounts() {
    const unreadCount = _allNotifs.filter(n => !n.readBy?.includes(user.id)).length;
    const emergencyCount = _allNotifs.filter(n => notifCategory(n) === 'emergency').length;
    const allEl = document.getElementById('tabCountAll');
    const unEl = document.getElementById('tabCountUnread');
    const emEl = document.getElementById('tabCountEmergency');
    if (allEl) allEl.textContent = _allNotifs.length || '';
    if (unEl) unEl.textContent = unreadCount || '';
    if (emEl) emEl.textContent = emergencyCount || '';
    const readAll = document.getElementById('readAllBtn');
    if (readAll) readAll.style.display = unreadCount > 0 ? 'inline-flex' : 'none';
  }

  async function markRead(id) {
    try {
      await CBS.apiPost(`/api/notifications/read/${id}`, {});
      const n = _allNotifs.find(x => x._id === id);
      if (n) { n.readBy = Array.isArray(n.readBy) ? n.readBy : []; if (!n.readBy.includes(user.id)) n.readBy.push(user.id); }
      updateNotifCounts();
      renderNotifs();
    } catch { /* silent */ }
  }

  async function markGroupRead(groupId) {
    const ids = _notificationGroups[groupId] || [];
    const wasOpen = document.getElementById(groupId)?.classList.contains('open');
    await Promise.all(ids.map(id => markRead(id)));
    renderNotifs();
    if (wasOpen) document.getElementById(groupId)?.classList.add('open');
  }

  function snoozeGroup(groupId, minutes = 60) {
    const until = Date.now() + minutes * 60 * 1000;
    (_notificationGroups[groupId] || []).forEach(id => { _snoozedNotifs[id] = until; });
    saveSnoozed();
    renderNotifs();
    if (CBS.toast) CBS.toast('تم تأجيل الإشعار', `سيظهر مجدداً بعد ${minutes} دقيقة`, 'success');
  }

  async function markAllRead() {
    try {
      await CBS.apiPost('/api/notifications/read-all', {});
      loadNotifications();
    } catch { /* silent */ }
  }

    document.getElementById('notifSearch')?.addEventListener('input', renderNotifs);
  document.getElementById('year').textContent = new Date().getFullYear();
  window.refreshNotifications = loadNotifications;
  setTab('all');
  loadNotifications();

</script>
<script>document.addEventListener('cbs:refresh',e=>{e.preventDefault();loadNotifications().finally(()=>e.detail.done());});</script>
</body>
</html>
