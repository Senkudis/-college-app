<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>حسابات الاختبار | كلية تقنية المعلومات</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Al-Nasr CBS">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="/vendor/fonts/cairo.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0f1a;
      --surface:   #131726;
      --surface2:  #1a1f32;
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.14);
      --text:      #e8edf5;
      --muted:     #6b7a99;
      --blue:      #3b82f6;
      --indigo:    #6366f1;
      --green:     #10b981;
      --amber:     #f59e0b;
      --red:       #ef4444;
      --purple:    #8b5cf6;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── LOGIN ─────────────────────────────────── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse 800px 600px at 0% 100%, rgba(99,102,241,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 600px 500px at 100% 0%, rgba(59,130,246,0.06) 0%, transparent 70%),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 36px;
      animation: fadeUp .45s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px) scale(.98); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .login-icon-ring {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
    }

    .login-heading {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    .login-sub {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .pill-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      color: #fca5a5;
      margin-bottom: 24px;
    }

    .field {
      position: relative;
      margin-bottom: 12px;
    }
    .field i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: 13px 42px 13px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--blue); }
    .field input::placeholder { color: var(--muted); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover  { opacity: .92; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .login-error {
      margin-top: 12px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #fca5a5;
      display: none;
      text-align: center;
    }

    /* ─── APP SHELL ──────────────────────────────── */
    #app { display: none; }

    .navbar {
      height: 58px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky; top: 0; z-index: 50;
    }

    .navbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: .95rem;
    }
    .navbar-brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--blue), var(--indigo));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .85rem;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 9px;
      padding: 7px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-logout:hover {
      background: rgba(239,68,68,0.08);
      border-color: rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    /* ─── CONTENT ────────────────────────────────── */
    .content {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    /* BANNER */
    .banner {
      background: linear-gradient(135deg, #0d2d5e 0%, #1a1f6e 50%, #2d1b69 100%);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .banner::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle 200px at 90% 50%, rgba(99,102,241,0.15) 0%, transparent 70%),
        radial-gradient(circle 150px at 10% 80%, rgba(59,130,246,0.1) 0%, transparent 70%);
    }
    .banner-content { position: relative; }
    .banner h1 {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -.4px;
    }
    .banner p { font-size: .85rem; color: rgba(255,255,255,.65); }

    /* ALERT */
    .alert-strip {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 32px;
      font-size: .82rem;
      color: #fcd34d;
      line-height: 1.6;
    }
    .alert-strip i { font-size: 1rem; margin-top: 2px; flex-shrink: 0; }

    /* SECTION HEADER */
    .section-hd {
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-hd::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* USER CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
      gap: 14px;
    }

    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .user-card:hover {
      border-color: var(--border-hi);
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }

    .user-card-head {
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    .user-meta { flex: 1; min-width: 0; }
    .user-name {
      font-weight: 700;
      font-size: .95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 700;
    }

    .user-card-body { padding: 18px 20px; }

    .cred-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      gap: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .cred-row:last-child { margin-bottom: 0; }
    .cred-row:hover {
      border-color: var(--border-hi);
      background: rgba(255,255,255,0.04);
    }
    .cred-row:active { background: rgba(255,255,255,0.07); }

    .cred-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .76rem;
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
      min-width: 90px;
    }
    .cred-label i { font-size: .9rem; }

    .cred-value {
      font-family: 'Courier New', 'Menlo', monospace;
      font-size: .82rem;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      direction: ltr;
    }

    .copy-icon {
      color: var(--muted);
      font-size: .9rem;
      flex-shrink: 0;
      transition: color .15s;
    }
    .cred-row:hover .copy-icon { color: var(--blue); }

    .copy-hint {
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--surface);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--blue);
      padding: 11px 24px;
      border-radius: 12px;
      font-size: .85rem;
      font-weight: 600;
      z-index: 9999;
      pointer-events: none;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .cards-grid { grid-template-columns: 1fr; }
      .login-card { padding: 28px 20px; max-width: 100%; }
      .content { padding: 16px 12px 60px; }
      .navbar { padding: 0 14px; }
      .banner { padding: 22px 18px; border-radius: 14px; }
      .banner h1 { font-size: 1.1rem; }
      .user-card-head { padding: 16px 14px 14px; }
      .user-card-body { padding: 14px; }
      .cred-row { padding: 11px 12px; }
      .cred-label { min-width: 80px; font-size: .73rem; }
      .cred-value { font-size: .79rem; }
      .section-hd { margin-bottom: 12px; }
    }
    @media (max-width: 380px) {
      .cred-label { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon-ring">
      <i class="ri-shield-keyhole-line"></i>
    </div>
    <div class="login-heading">لوحة الحسابات التجريبية</div>
    <div class="login-sub">
      كلية تقنية المعلومات<br>الوصول مقيد بالإدارة
    </div>

    <div style="text-align:center;margin-bottom:24px">
      <span class="pill-label">
        <i class="ri-test-tube-line"></i>
        بيئة اختبار فقط
      </span>
    </div>

    <div class="field">
      <i class="ri-lock-2-line"></i>
      <input type="password" id="passInput" placeholder="كلمة المرور"
             onkeyup="if(event.key==='Enter') login()">
    </div>

    <button class="btn-primary" onclick="login()">
      <i class="ri-arrow-right-line"></i>
      دخول
    </button>

    <div class="login-error" id="loginErr">
      <i class="ri-close-circle-line"></i> كلمة المرور غير صحيحة
    </div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">

  <nav class="navbar">
    <div class="navbar-brand">
      <div class="navbar-brand-icon">
        <i class="ri-government-line"></i>
      </div>
      حسابات اختبار التطبيق
    </div>
    <button class="btn-logout" onclick="logout()">
      <i class="ri-logout-box-r-line"></i>
      خروج
    </button>
  </nav>

  <div class="content">

    <div class="banner">
      <div class="banner-content">
        <h1>بيانات المستخدمين التجريبيين</h1>
        <p>أربعة حسابات جاهزة لاختبار التطبيق — واحد لكل دور. اضغط على أي حقل لنسخه مباشرة.</p>
      </div>
    </div>



    <div class="section-hd">
      <i class="ri-team-line"></i>
      الحسابات الأربعة
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="ri-clipboard-line"></i>
  <span id="toastMsg">تم النسخ</span>
</div>

<script>
  /* ─── AUTH ───────────────────────── */
  const PASS = '11223344';

  function login() {
    if (document.getElementById('passInput').value === PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      render();
    } else {
      const el = document.getElementById('loginErr');
      el.style.display = 'block';
      document.getElementById('passInput').value = '';
      setTimeout(() => el.style.display = 'none', 3000);
    }
  }

  function logout() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('passInput').value = '';
  }

  /* ─── DATA ───────────────────────── */
  /*
    =====================================================
    ** يرجى تحديث بيانات الحسابات الأربعة هنا مباشرة **
    =====================================================
  */
  const ACCOUNTS = [
    {
      role:     'dean',
      label:    'العميد',
      icon:     'ri-government-line',
      color:    '#ef4444',
      gradient: 'linear-gradient(135deg,#7f1d1d,#991b1b)',
      name:     'حساب العميد',
      email:    'dean@gmail.co',
      password: '123456',
    },
    {
      role:     'doctor',
      label:    'الأستاذ',
      icon:     'ri-user-star-line',
      color:    '#f59e0b',
      gradient: 'linear-gradient(135deg,#78350f,#92400e)',
      name:     'حساب الدكتور',
      email:    'doc@gmail.com',
      password: '123456',
    },
    {
      role:     'leader',
      label:    'قائد الدفعة',
      icon:     'ri-shield-star-line',
      color:    '#6366f1',
      gradient: 'linear-gradient(135deg,#312e81,#3730a3)',
      name:     'حساب القائد',
      email:    'fah@gmail.com',
      password: '123456',
    },
    {
      role:     'student',
      label:    'الطالب',
      icon:     'ri-graduation-cap-line',
      color:    '#10b981',
      gradient: 'linear-gradient(135deg,#064e3b,#065f46)',
      name:     'حساب الطالب',
      email:    'testing@gmail.com',
      password: '123456',
    },
  ];

  /* ─── RENDER ─────────────────────── */
  function render() {
    document.getElementById('cardsGrid').innerHTML = ACCOUNTS.map(a => {
      const initials = a.name.split(' ').slice(0,2).map(w=>w[0]||'').join('');
      return `
        <div class="user-card">
          <div class="user-card-head">
            <div class="avatar" style="background:${a.gradient}">
              <i class="${a.icon}" style="font-size:1.3rem"></i>
            </div>
            <div class="user-meta">
              <div class="user-name">${esc(a.name)}</div>
              <span class="role-chip" style="background:${hexAlpha(a.color,.12)};color:${a.color};border:1px solid ${hexAlpha(a.color,.25)}">
                <i class="${a.icon}"></i>
                ${esc(a.label)}
              </span>
            </div>
          </div>
          <div class="user-card-body">
            ${credRow('ri-mail-send-line', 'البريد', a.email)}
            ${credRow('ri-lock-password-line', 'كلمة المرور', a.password)}
            <div class="copy-hint">
              <i class="ri-cursor-line"></i>
              اضغط على الحقل لنسخه
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function credRow(icon, label, value) {
    const safe = esc(value);
    return `
      <div class="cred-row" onclick="copyVal('${safe}','${esc(label)}')">
        <div class="cred-label">
          <i class="${icon}"></i>
          ${label}
        </div>
        <div class="cred-value">${safe}</div>
        <i class="ri-file-copy-line copy-icon"></i>
      </div>
    `;
  }

  /* ─── HELPERS ────────────────────── */
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function hexAlpha(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  let toastTimer = null;
  function copyVal(value, label) {
    const raw = value.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#039;/g,"'");
    navigator.clipboard.writeText(raw).catch(() => {
      const t = document.createElement('textarea');
      t.value = raw; document.body.appendChild(t);
      t.select(); document.execCommand('copy');
      document.body.removeChild(t);
    });
    document.getElementById('toastMsg').textContent = `تم نسخ ${label}`;
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
