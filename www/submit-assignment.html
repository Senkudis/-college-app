<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسليم التكليفات | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <style>
    .tabs-bar {
      display: flex; gap: 6px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 6px;
      margin-bottom: 24px; box-shadow: var(--shadow-sm);
    }
    .tab-item {
      flex: 1; padding: 10px; border-radius: var(--radius-md);
      text-align: center; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; color: var(--text-muted); transition: var(--transition);
      border: none; background: transparent; font-family: 'Cairo', sans-serif;
    }
    .tab-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .tab-item:not(.active):hover { background: var(--bg-hover); color: var(--text-main); }

    .assign-list { display: flex; flex-direction: column; gap: 14px; }
    .assign-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-sm); transition: var(--transition);
      border-right: 4px solid var(--primary);
    }
    .assign-card:hover { box-shadow: var(--shadow-md); }
    .assign-card.submitted { border-right-color: var(--success); }
    .assign-card.focused { box-shadow: 0 0 0 2px var(--primary), var(--shadow-md); }
    .assign-card.late      { border-right-color: var(--danger); }

    .assign-head  { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .assign-title { font-weight: 700; font-size: 1.05rem; color: var(--text-main); }
    .assign-meta  { font-size: 0.83rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .assign-meta span { display: flex; align-items: center; gap: 4px; }

    .time-box {
      padding: 10px 14px; border-radius: var(--radius-md);
      font-size: 0.83rem; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .time-box.ok   { background: var(--success-bg); color: var(--success); }
    .time-box.warn { background: var(--warning-bg); color: var(--warning); }
    .time-box.late { background: var(--danger-bg);  color: var(--danger);  }

    .assign-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Submitted list */
    .sub-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-sm); margin-bottom: 14px;
      border-right: 4px solid var(--accent);
    }
    .sub-card.graded   { border-right-color: var(--success); }
    .sub-card.reviewed { border-right-color: var(--primary); }
    .grade-big { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 8px 0; }
    .feedback-box { background: var(--bg-hover); border-radius: var(--radius-md); padding: 12px; font-size: 0.88rem; margin-top: 10px; }
      .sa-card.focused { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15); }
    .sa-desc { margin: 8px 0 0; font-size: 0.84rem; line-height: 1.6; color: var(--text-muted); }
    .sa-left { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .sa-left[data-tone="danger"] { color: var(--danger-text); } .sa-left[data-tone="warning"] { color: var(--warning-text); }
    .sa-grade { flex-shrink: 0; font-size: 1.6rem; font-weight: 800; line-height: 1; color: var(--success-text); font-variant-numeric: tabular-nums; }
    .sa-grade small { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
    .sa-feedback { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg-hover); font-size: 0.84rem; line-height: 1.6; }
    .sa-feedback span { white-space: pre-wrap; color: var(--text-main); }
    .sa-submit { min-height: 40px; }
    #mainList .ui-card + .ui-card { margin-top: 10px; }
</style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>تسليم التكليفات</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.goHome()" title="الرئيسية"><i class="ri-home-4-line"></i></button>
  </div>
</header>

<div class="page-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner" style="--page-accent:#b45309">
      <div class="welcome-banner-icon-wrap">
        <i class="ri-upload-2-line welcome-banner-icon"></i>
      </div>
      <div class="welcome-banner-body">
        <h2>تسليم التكليفات</h2>
        <p>رفع الأبحاث والمشاريع الدراسية</p>
      </div>
    </div>
  <div class="ui-seg" role="tablist" aria-label="حالة التكليفات">
    <button type="button" class="tab-item active" onclick="switchTab('pending', this)"><i class="ri-time-line"></i> مطلوب التسليم</button>
    <button type="button" class="tab-item" onclick="switchTab('submitted', this)"><i class="ri-checkbox-circle-line"></i> تم التسليم</button>
  </div>

  <div id="alertMsg" class="alert"></div>
  <div id="mainList"></div>
</div>

<!-- Submit Modal -->
<div class="modal-overlay" id="submitModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">تسليم التكليف</span>
      <button class="modal-close" onclick="CBS.closeModal('submitModal')" aria-label="إغلاق"><i class="ri-close-line"></i></button>
    </div>
    <div class="modal-body">
      <div id="modalDetails" style="background:var(--bg-hover);padding:14px;border-radius:var(--radius-md);margin-bottom:16px;font-size:0.88rem;"></div>
      <div id="modalAlert" class="alert"></div>
      <div id="submitForm">
        <div class="form-group">
          <label class="form-label" for="subType">نوع التسليم</label>
          <div class="input-wrapper"><i class="input-icon ri-bookmark-line"></i>
            <select class="form-control" id="subType">
              <option value="exercise">تمرين</option>
              <option value="research">بحث</option>
              <option value="project">مشروع</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="subFile">ملف الحل (PDF أو صورة) *</label>
          <input class="form-control" type="file" id="subFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.rar,image/*">
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">أنواع الملفات المدعومة: PDF أو صور</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="subNotes">ملاحظات (اختياري)</label>
          <textarea class="form-control" id="subNotes" rows="2" placeholder="اكتب ملاحظات للمشرف..."></textarea>
        </div>
      </div>
      <div id="alreadyMsg" style="display:none;text-align:center;padding:20px;">
        <i class="ri-checkbox-circle-fill" style="font-size:2.5rem;color:var(--success);"></i>
        <p style="font-weight:700;color:var(--success);margin-top:8px;">تم تسليم هذا التكليف مسبقاً</p>
      </div>
      <div id="lateMsg" style="display:none;text-align:center;padding:20px;">
        <i class="ri-error-warning-fill" style="font-size:2.5rem;color:var(--danger);"></i>
        <p style="font-weight:700;color:var(--danger);margin-top:8px;">انتهى وقت التسليم</p>
      </div>
    </div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-ghost" onclick="CBS.closeModal('submitModal')">إلغاء</button>
      <button class="btn btn-primary" id="submitBtn" onclick="doSubmit()">
        <i class="ri-send-plane-line"></i> إرسال التسليم
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<footer class="main-footer">
  جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل
</footer>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init();
  const user = CBS.getUser();
  let currentTab = 'pending', currentAssignId = null, submittedSet = new Set();
  const typeLabel = { exercise:'تمرين', research:'بحث', project:'مشروع' };
  /* الردود بصيغة { data: { assignments|submissions: [...] } }: كانت تُفرد كمصفوفات
     فيرمي التحميل خطأً دائماً — أي أن صفحة التسليم لم تعرض أي تكليف قط */
  const listFrom = (json, key) => Array.isArray(json) ? json : (json?.data?.[key] || json?.[key] || []);
  const focusId = new URLSearchParams(location.search).get('id');

  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    tab === 'pending' ? loadPending() : loadSubmitted();
  }

  async function loadPending() {
    CBS.showLoading('mainList', 'جاري التحميل...', 'skeleton-list');
    try {
      const [ex, re, pr, myRes] = await Promise.all([
        CBS.apiGet('/api/assignments/type/exercise'),
        CBS.apiGet('/api/assignments/type/research'),
        CBS.apiGet('/api/assignments/type/project'),
        CBS.apiGet('/api/submissions/my-submissions')
      ]);
      const all  = [
        ...listFrom(await ex.json(), 'assignments'),
        ...listFrom(await re.json(), 'assignments'),
        ...listFrom(await pr.json(), 'assignments')
      ];
      const mine = listFrom(await myRes.json(), 'submissions');
      submittedSet = new Set(mine.filter(s => s.assignment).map(s => s.assignment._id || s.assignment));

      if (!all.length) { CBS.showEmpty('mainList','لا توجد تكليفات مطلوبة حالياً','ri-inbox-line'); return; }

      // المطلوب أولاً بالأقرب موعداً، ثم الفائت، ثم المسلَّم
      const dueOf = a => { const d = a.dueDate ? new Date(a.dueDate) : null; const tm = /^(\d{1,2}):(\d{2})$/.exec(a.dueTime || ''); if (d && tm) d.setHours(+tm[1], +tm[2], 0, 0); return d; };
      const rank = a => submittedSet.has(a._id) ? 2 : (dueOf(a) && new Date() > dueOf(a) ? 1 : 0);
      all.sort((a, b) => rank(a) - rank(b) || ((dueOf(a) || 0) - (dueOf(b) || 0)));
      document.getElementById('mainList').innerHTML = all.map(a => {
        const isSubmitted = submittedSet.has(a._id);
        const due = dueOf(a);
        const isLate = due && new Date() > due;
        const chip = isSubmitted ? { text: 'تم التسليم', tone: 'success' } : (isLate ? { text: 'فات الموعد', tone: 'danger' } : (due ? CBS.dueLabel(due) : { text: '', tone: '' }));
        const left = due && !isSubmitted && !isLate ? (() => { const ms = due - new Date(), d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5); const H = n => CBS.arCount(n, ['ساعة واحدة', 'ساعتان', 'ساعات', 'ساعة']); return d ? `متبقٍّ ${CBS.arCount(d, ['يوم واحد', 'يومان', 'أيام', 'يوماً'])}${h ? ' و' + H(h) : ''}` : `متبقٍّ ${h ? H(h) + ' و' : ''}${CBS.arCount(Math.floor(ms % 36e5 / 6e4), ['دقيقة واحدة', 'دقيقتان', 'دقائق', 'دقيقة'])}`; })() : '';
        return `<article class="ui-card sa-card" data-id="${a._id}">
          <div class="ui-card-head"><div style="flex:1;min-width:0"><div class="ui-card-title">${CBS.escapeHTML(a.title)}</div></div>
            ${chip.text ? `<span class="hm-chip"${chip.tone ? ` data-tone="${chip.tone}"` : ''}>${chip.text}</span>` : ''}</div>
          <div class="ui-card-meta">
            <span><i class="ri-bookmark-line"></i> ${typeLabel[a.type] || a.type}</span>
            <span><i class="ri-book-open-line"></i> ${CBS.escapeHTML(a.subject?.name || 'مقرر غير محدد')}</span>
            <span><i class="ri-user-line"></i> ${CBS.escapeHTML(CBS.doctorName(a.addedBy?.name) || '')}</span>
            ${due ? `<span><i class="ri-calendar-line"></i> ${CBS.formatDateTime(due)}</span>` : ''}
          </div>
          ${a.description ? `<p class="sa-desc">${CBS.escapeHTML(a.description)}</p>` : ''}
          ${left ? `<div class="sa-left"${chip.tone ? ` data-tone="${chip.tone}"` : ''}><i class="ri-time-line"></i> ${left}</div>` : ''}
          <div class="ui-card-foot">
            <a href="${API_BASE}/uploads/assignments/${encodeURIComponent(a.file)}" data-title="${CBS.escapeHTML(a.title)}" target="_blank" rel="noopener noreferrer" class="ui-act"><i class="ri-file-download-line"></i> ملف التكليف</a>
            ${!isSubmitted && !isLate ? `<button type="button" class="ui-primary sa-submit" data-id="${a._id}" data-title="${CBS.escapeHTML(a.title)}" data-type="${a.type}" onclick="openSubmit(this.dataset.id, this.dataset.title, this.dataset.type)"><i class="ri-upload-cloud-line"></i> تسليم الحل</button>` : ''}
          </div>
        </article>`;
      }).join('');
      // جئنا من صفحة الواجبات بمعرّف محدد: نُبرز التكليف ونفتح التسليم مباشرة إن أمكن
      if (focusId) {
        const card = document.querySelector(`.sa-card[data-id="${CSS.escape(focusId)}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('focused');
          card.querySelector('.sa-submit')?.click();
        } else if (mine.some(s => String(s.assignment?._id || s.assignment) === focusId)) {
          switchTab('submitted', document.querySelector('.tab-item:nth-child(2)'));
        }
      }
    } catch(e) { CBS.showAlert('alertMsg', 'خطأ في التحميل', 'danger'); }
  }

  async function loadSubmitted() {
    CBS.showLoading('mainList', 'جاري التحميل...', 'skeleton-list');
    try {
      const res  = await CBS.apiGet('/api/submissions/my-submissions');
      const _resData = await CBS.readJson(res);
      const list = listFrom(_resData, 'submissions');
      if (!list.length) { CBS.showEmpty('mainList','لم تقم بتسليم أي تكليفات بعد','ri-inbox-line'); return; }
      const statusTone = { pending: 'warning', reviewed: 'primary', graded: 'success' };
      const statusTxt = { pending: 'قيد المراجعة', reviewed: 'تمت المراجعة', graded: 'مقيّم' };
      document.getElementById('mainList').innerHTML = list.map(s => `
          <article class="ui-card">
            <div class="ui-card-head">
              <div style="flex:1;min-width:0"><div class="ui-card-title">${CBS.escapeHTML(s.assignment?.title || '')}</div>
                <div class="ui-card-meta"><span>${typeLabel[s.submissionType] || ''}</span><span>${CBS.formatDateTime(s.submissionDate)}</span>
                  <span style="color:${s.isLate ? 'var(--danger-text)' : 'inherit'}">${s.isLate ? 'تسليم متأخر' : 'في الموعد'}</span></div></div>
              ${s.grade != null ? `<div class="sa-grade">${s.grade}<small>/100</small></div>` : `<span class="hm-chip" data-tone="${statusTone[s.status]}">${statusTxt[s.status]}</span>`}
            </div>
            ${s.feedback ? `<div class="sa-feedback"><strong>ملاحظات المشرف</strong><span>${CBS.escapeHTML(s.feedback)}</span></div>` : ''}
            <div class="ui-card-foot">
              <a href="${API_BASE}${CBS.privateFileUrl('submissions', s.file)}" target="_blank" rel="noopener noreferrer" class="ui-act"><i class="ri-file-line"></i> ملفي</a>
              ${s.status === 'pending' ? `<button type="button" class="ui-act danger" onclick="undoSubmission('${s._id}')"><i class="ri-arrow-go-back-line"></i> تراجع عن التسليم</button>` : ''}
            </div>
          </article>`).join('');
    } catch(e) { CBS.showAlert('alertMsg', 'خطأ في التحميل', 'danger'); }
  }

  window.undoSubmission = async function(id) {
    if (!confirm('هل أنت متأكد من إلغاء هذا التسليم؟ ستحتاج لرفعه مجدداً.')) return;
    try {
      const res = await CBS.apiDelete(`/api/submissions/${id}/undo`);
      if (res.ok) {
        CBS.toast('نجاح', 'تم التراجع عن التسليم بنجاح', 'success');
        switchTab('pending', document.querySelector('.tab-item:nth-child(1)'));
      } else {
        const err = await res.json();
        CBS.showAlert('alertMsg', err.message || 'فشل إلغاء التسليم', 'danger');
      }
    } catch(e) {
      CBS.showAlert('alertMsg', 'حدث خطأ في الاتصال', 'danger');
    }
  }

  function openSubmit(id, title, type) {
    currentAssignId = id;
    document.getElementById('modalTitle').textContent = `تسليم: ${title}`;
    // title يصل من سمة onclick بعد فكّ ترميزها — يجب تهريبه قبل innerHTML
    document.getElementById('modalDetails').innerHTML = `<strong>التكليف:</strong> ${CBS.escapeHTML(title)}<br><strong>النوع:</strong> ${CBS.escapeHTML(typeLabel[type] || type)}`;
    document.getElementById('subType').value = type;
    document.getElementById('subFile').value = '';
    document.getElementById('subNotes').value = '';

    if (submittedSet.has(id)) {
      document.getElementById('submitForm').style.display = 'none';
      document.getElementById('alreadyMsg').style.display = 'block';
      document.getElementById('lateMsg').style.display = 'none';
      document.getElementById('modalFooter').style.display = 'none';
    } else {
      document.getElementById('submitForm').style.display = 'block';
      document.getElementById('alreadyMsg').style.display = 'none';
      document.getElementById('lateMsg').style.display = 'none';
      document.getElementById('modalFooter').style.display = 'flex';
    }
    CBS.hideAlert('modalAlert');
    CBS.openModal('submitModal');
  }

  async function doSubmit() {
    const file = document.getElementById('subFile').files[0];
    if (!file) { CBS.showAlert('modalAlert', 'الرجاء اختيار ملف للرفع', 'danger'); return; }

    document.getElementById('submitBtn').disabled = true;

    if (!navigator.onLine) {
      try {
        const dbReq = indexedDB.open('CBS_Sync', 1);
        dbReq.onupgradeneeded = e => e.target.result.createObjectStore('submissions', { keyPath: 'id', autoIncrement: true });
        dbReq.onsuccess = e => {
          const db = e.target.result;
          const tx = db.transaction('submissions', 'readwrite');
          tx.objectStore('submissions').add({
            assignmentId: currentAssignId,
            submissionType: document.getElementById('subType').value,
            notes: document.getElementById('subNotes').value,
            file: file,
            fileName: file.name,
            token: CBS.getToken()
          });
          tx.oncomplete = () => {
            if ('serviceWorker' in navigator && 'SyncManager' in window) {
              navigator.serviceWorker.ready.then(sw => sw.sync.register('sync-submissions').catch(console.warn));
            }
            CBS.toast('تم الحفظ', 'تم الحفظ محلياً وسيتم الرفع فور عودة الإنترنت', 'success');
            CBS.closeModal('submitModal');
            document.getElementById('submitBtn').disabled = false;
          };
          tx.onerror = (e) => {
            CBS.toast('فشل الحفظ', 'متصفحك لا يدعم حفظ الملفات محلياً بدون إنترنت', 'error');
            document.getElementById('submitBtn').disabled = false;
          };
        };
        dbReq.onerror = e => {
          CBS.toast('خطأ محلي', 'حدث خطأ أثناء فتح قاعدة البيانات المحلية', 'error');
          document.getElementById('submitBtn').disabled = false;
        };
      } catch (err) {
        CBS.toast('خطأ', 'الرجاء الاتصال بالإنترنت لرفع هذا الملف', 'warning');
        document.getElementById('submitBtn').disabled = false;
      }
      return;
    }

    const form = new FormData();
    form.append('assignmentId',    currentAssignId);
    form.append('submissionType',  document.getElementById('subType').value);
    form.append('notes',           document.getElementById('subNotes').value);
    form.append('file',            await CBS.compressImage(file));

    const batchId = CBS.getBatchId();
    const headers = { Authorization: 'Bearer ' + CBS.getToken() };
    if (batchId) headers['x-batch-id'] = batchId;

    try {
      const res  = await fetch(API_BASE + '/api/submissions/submit', { method:'POST', headers, body: form });
      const data = await res.json();
      if (res.ok) {
        _hasUnsavedNote = false; // تنظيف حالة الحماية
        CBS.toast('تم تسليم الحل بنجاح', '', 'success');
        CBS.closeModal('submitModal');
        loadPending();
      } else {
        CBS.showAlert('modalAlert', data.message || 'فشل في تسليم الحل', 'danger');
      }
    } catch(e) { CBS.showAlert('modalAlert', 'خطأ في الاتصال', 'danger'); }
    document.getElementById('submitBtn').disabled = false;
  }

  // تحذير عند مغادرة الصفحة أثناء الكتابة
  let _hasUnsavedNote = false;
  document.getElementById('subNotes')?.addEventListener('input', () => {
    _hasUnsavedNote = document.getElementById('subNotes').value.trim().length > 0;
  });
  window.addEventListener('beforeunload', (e) => {
    if (_hasUnsavedNote) {
      e.preventDefault();
      e.returnValue = 'لديك نص لم يتم حفظه، هل تريد المغادرة؟';
    }
  });

  loadPending();
</script>
