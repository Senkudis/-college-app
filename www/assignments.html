<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d3b66">
  <link rel="manifest" href="/manifest.json">
  <title>الواجبات | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2026102722">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102722">
  <link rel="stylesheet" href="/css/ui.css?v=2026102722">

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>الواجبات والتكاليف</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.logout()" title="خروج" aria-label="تسجيل الخروج"><i class="ri-logout-box-r-line"></i></button>
  </div>
</header>

<div class="page-content">

  <!-- Welcome Banner -->
  <div class="welcome-banner" style="--page-accent:#b45309">
    <div class="welcome-banner-icon-wrap">
      <i class="ri-task-line welcome-banner-icon"></i>
    </div>
    <div class="welcome-banner-body">
      <h2>الواجبات والتكاليف</h2>
      <p>تصفح ومتابعة حالة جميع الواجبات المطلوبة</p>
    </div>
  </div>

  <!-- إضافة واجب للكادر فقط -->
  <div id="addAssignmentWrap" class="ui-toolbar" style="display:none">
    <button type="button" class="ui-primary" onclick="CBS.openModal('assignmentModal')"><i class="ri-add-line"></i> واجب جديد</button>
  </div>

  <div class="ui-chips" role="tablist" aria-label="تصفية الواجبات">
    <button type="button" class="ui-chip" data-f="active" onclick="filterAssignments('active')">مطلوبة <span class="n" id="cActive"></span></button>
    <button type="button" class="ui-chip" data-f="completed" onclick="filterAssignments('completed')">مسلّمة <span class="n" id="cDone"></span></button>
    <button type="button" class="ui-chip" data-f="expired" onclick="filterAssignments('expired')">فائتة <span class="n" id="cExpired"></span></button>
    <button type="button" class="ui-chip" data-f="all" onclick="filterAssignments('all')">الكل <span class="n" id="cAll"></span></button>
  </div>

  <div class="hm-list" id="assignmentsList">
    <div class="hm-skel" style="height:192px;border-radius:0"></div>
  </div>

</div>

<div id="toast-container"></div>

<!-- Add/Edit Assignment Modal -->
<div class="modal-overlay" id="assignmentModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">إضافة واجب جديد</h3>
      <button class="modal-close" onclick="CBS.closeModal('assignmentModal')" aria-label="إغلاق"><i class="ri-close-line"></i></button>
    </div>
    <div class="modal-body">
      <form id="assignmentForm">
        <div class="form-group">
          <label for="assignName">اسم الواجب</label>
          <input type="text" id="assignName" required placeholder="أدخل اسم الواجب">
        </div>
        <div class="form-group">
          <label for="assignSubject">المقرر</label>
          <select id="assignSubject" required>
            <option value="">اختر المقرر</option>
          </select>
        </div>
        <div class="form-group">
          <label for="assignType">نوع التكليف</label>
          <select id="assignType" required>
            <option value="exercise">تمرين</option>
            <option value="research">بحث</option>
            <option value="project">مشروع</option>
          </select>
        </div>
        <div class="form-group">
          <label for="assignDeadline">تاريخ الانتهاء</label>
          <input type="date" id="assignDeadline" required>
        </div>
        <div class="form-group">
          <label for="assignDueTime">وقت التسليم</label>
          <input type="time" id="assignDueTime" value="23:59">
        </div>
        <div class="form-group">
          <label for="assignFile">ملف التكليف</label>
          <input type="file" id="assignFile" required>
        </div>
        <div class="form-group">
          <label for="assignDesc">الوصف</label>
          <textarea id="assignDesc" placeholder="أدخل وصف الواجب"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="CBS.closeModal('assignmentModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveAssignment()">حفظ</button>
    </div>
  </div>
</div>

<footer class="main-footer">
  حقوق النشر &copy; <span id="year"></span> جامعة النصر التقنية &nbsp;|&nbsp; تطوير: ضياء الدين إبراهيم
</footer>

<script src="/js/shared.js?v=2026102722"></script>
<script src="/js/app.js?v=2026102722"></script>
<script src="/js/socket-client.js?v=2026102722" defer></script>
<script>
  CBS.init();

  const user = CBS.getUser();
  const isAdmin = CBS.hasRole(['dean', 'doctor', 'leader', 'admin'], user);
  if (isAdmin) {
    const wrap = document.getElementById('addAssignmentWrap');
    if (wrap) wrap.style.display = 'block';
  }

  // Load assignments
  let allAssignments = [];

  const statusMap = {
    active:    { label: 'نشط',        cls: 'active',    icon: 'ri-time-line' },
    completed: { label: 'تم التسليم', cls: 'completed', icon: 'ri-checkbox-circle-line' },
    graded:    { label: 'تم التقييم', cls: 'graded',    icon: 'ri-medal-line' },
    expired:   { label: 'منتهي',      cls: 'expired',   icon: 'ri-close-circle-line' }
  };

  /* نموذج Assignment لا يحتوي حقل status ولا deadline؛ الحالة تُشتق من dueDate + تسليم الطالب */
  let mySubmissions = {};   // assignmentId -> submission

  function dueMoment(a) {
    if (!a.dueDate) return null;
    const d = new Date(a.dueDate);
    if (isNaN(d)) return null;
    const [h, m] = String(a.dueTime || '23:59').split(':');
    d.setHours(parseInt(h, 10) || 23, parseInt(m, 10) || 59, 59, 999);
    return d;
  }

  function assignmentStatus(a) {
    const sub = mySubmissions[a._id];
    if (sub) return sub.status === 'graded' ? 'graded' : 'completed';
    const due = dueMoment(a);
    if (due && due.getTime() < Date.now()) return 'expired';
    return 'active';
  }

  /* صف لكل واجب: الحالة باللون في الشريحة فقط، والمطلوب أولاً بالأقرب موعداً */
  const rank = { active: 0, expired: 1, completed: 2, graded: 2 };
  function renderAssignments(list) {
    const container = document.getElementById('assignmentsList');
    if (!list.length) {
      container.innerHTML = `<div class="hm-row hm-empty"><span class="hm-ic" data-tone="success"><i class="ri-checkbox-circle-line"></i></span><div class="hm-row-body"><div class="hm-row-title">لا واجبات هنا</div><div class="hm-row-meta">جرّب تصفية أخرى من الأعلى</div></div></div>`;
      return;
    }
    const sorted = list.slice().sort((a, b) => {
      const ra = rank[assignmentStatus(a)], rb = rank[assignmentStatus(b)];
      if (ra !== rb) return ra - rb;
      const da = dueMoment(a) || 0, db = dueMoment(b) || 0;
      return ra === 0 ? da - db : db - da;
    });
    container.innerHTML = sorted.map(function(a) {
      const s = assignmentStatus(a);
      const due = dueMoment(a);
      const chip = s === 'active' ? CBS.dueLabel(due) : { text: statusMap[s].label, tone: s === 'expired' ? 'danger' : 'success' };
      const date = due ? due.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }) : '';
      const meta = [(a.subject && a.subject.name) || a.subjectName || '', date ? 'التسليم ' + date : ''].filter(Boolean).join(' · ');
      return `<a class="hm-row" href="/submit-assignment.html?id=${encodeURIComponent(a._id)}">
        <span class="hm-ic"${s === 'expired' ? ' data-tone="danger"' : (s === 'active' ? '' : ' data-tone="success"')}><i class="${statusMap[s].icon}"></i></span>
        <div class="hm-row-body"><div class="hm-row-title">${CBS.escapeHTML(a.title || a.name || 'واجب')}</div><div class="hm-row-meta">${CBS.escapeHTML(meta)}</div></div>
        <span class="hm-row-end">${chip.text ? `<span class="hm-chip"${chip.tone ? ` data-tone="${chip.tone}"` : ''}>${chip.text}</span>` : ''}<i class="ri-arrow-left-s-line" aria-hidden="true"></i></span>
      </a>`;
    }).join('');
  }

  function filterAssignments(type) {
    document.querySelectorAll('.ui-chip[data-f]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === type)));
    const safeList = Array.isArray(allAssignments) ? allAssignments : [];
    if (type === 'all') renderAssignments(safeList);
    else if (type === 'completed') renderAssignments(safeList.filter(a => ['completed', 'graded'].includes(assignmentStatus(a))));
    else renderAssignments(safeList.filter(a => assignmentStatus(a) === type));
  }

  (async () => {
    const container = document.getElementById('assignmentsList');
    
    try {
      const res = await CBS.apiGet('/api/assignments');
      if (!res.ok) throw new Error();
      const data = await res.json();
      const list = data.data?.assignments || data.assignments || (Array.isArray(data.data) ? data.data : (Array.isArray(data) ? data : []));
      allAssignments = Array.isArray(list) ? list : [];

      // تسليمات الطالب الحالي لاشتقاق حالة كل واجب (الكادر لا يملك تسليمات فتبقى فارغة)
      try {
        const subRes = await CBS.apiGet('/api/submissions/my-submissions');
        if (subRes && subRes.ok) {
          const subData = await subRes.json();
          const subs = subData.data?.submissions || subData.submissions || [];
          subs.forEach(function(s) {
            const aid = s.assignment && (s.assignment._id || s.assignment);
            if (aid) mySubmissions[aid] = s;
          });
        }
      } catch {}

      const count = st => allAssignments.filter(a => st.includes(assignmentStatus(a))).length;
      const nActive = count(['active']), nDone = count(['completed', 'graded']), nExpired = count(['expired']);
      [['cActive', nActive], ['cDone', nDone], ['cExpired', nExpired], ['cAll', allAssignments.length]].forEach(([id, n]) => { document.getElementById(id).textContent = n; });

      if (!allAssignments.length) {
        container.innerHTML = `<div class="hm-row hm-empty"><span class="hm-ic" data-tone="info"><i class="ri-task-line"></i></span><div class="hm-row-body"><div class="hm-row-title">لا واجبات بعد</div><div class="hm-row-meta">ستظهر هنا الواجبات التي يضيفها أساتذتك</div></div></div>`;
        return;
      }
      // نبدأ بما يحتاج فعلاً منه؛ إن لم يكن شيء مطلوب نعرض الكل
      filterAssignments(nActive ? 'active' : 'all');
    } catch(err) {
      console.warn('Assignments load error:', err);
      container.innerHTML = `<div class="hm-row hm-empty"><span class="hm-ic" data-tone="warning"><i class="ri-wifi-off-line"></i></span><div class="hm-row-body"><div class="hm-row-title">تعذّر تحميل الواجبات</div><div class="hm-row-meta">تحقّق من الاتصال ثم اسحب الصفحة للأسفل للتحديث</div></div></div>`;
    }
  })();

  // Load subjects for modal
  (async () => {
    try {
      const res = await CBS.apiGet('/api/subjects');
      if (res && res.ok) {
        const _data = await res.json();
        const subjects = _data.data?.subjects || _data.subjects || _data.data || (Array.isArray(_data) ? _data : []);
        const sel = document.getElementById('assignSubject');
        if (sel) {
          subjects.forEach(s => {
            const o = document.createElement('option');
            o.value = s._id;
            o.textContent = s.name;
            sel.appendChild(o);
          });
        }
      }
    } catch {}
  })();

  async function saveAssignment() {
    const title   = document.getElementById('assignName').value.trim();
    const subject = document.getElementById('assignSubject').value;
    const dueDate = document.getElementById('assignDeadline').value;
    const file    = document.getElementById('assignFile').files[0];

    if (!title || !subject || !dueDate) {
      CBS.toast('العنوان والمقرر وتاريخ الانتهاء مطلوبة', '', 'error');
      return;
    }
    if (!file) {
      CBS.toast('يجب رفع ملف التكليف', '', 'error');
      return;
    }

    // المسار يستخدم multer، لذلك لا يمكن استعمال CBS.apiPost (يرسل JSON دائماً)
    const form = new FormData();
    form.append('title', title);
    form.append('subject', subject);
    form.append('type', document.getElementById('assignType').value);
    form.append('dueDate', dueDate);
    form.append('dueTime', document.getElementById('assignDueTime').value || '23:59');
    form.append('description', document.getElementById('assignDesc').value);
    form.append('file', file);

    const headers = { Authorization: 'Bearer ' + CBS.getToken() };
    const batchId = CBS.getBatchId();
    if (batchId) headers['x-batch-id'] = batchId;

    try {
      const res = await fetch(API_BASE + '/api/assignments', { method: 'POST', headers, body: form });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        CBS.toast('تم حفظ الواجب بنجاح', '', 'success');
        CBS.closeModal('assignmentModal');
        location.reload();
      } else {
        CBS.toast(data.message || 'حدث خطأ', '', 'error');
      }
    } catch {
      CBS.toast('خطأ في الاتصال', '', 'error');
    }
  }
</script>
</body>
</html>
