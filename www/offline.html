<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لا يوجد اتصال | كلية النصر التقنية</title>
  <meta name="theme-color" content="#0d3b66">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css?v=2026083019">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main, 'Cairo', system-ui, -apple-system, sans-serif);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 20px;
      padding: 2rem; text-align: center;
      background: linear-gradient(160deg, var(--primary, #0d3b66) 0%, var(--accent, #1a5276) 50%, var(--primary, #0d3b66) 100%);
      color: #fff;
      overflow: hidden;
    }

    .offline-icon {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      border: 2px solid rgba(255,255,255,0.15);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px 10px rgba(255,255,255,0.1); }
    }

    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    p { font-size: 0.95rem; color: rgba(255,255,255,0.7); max-width: 340px; line-height: 1.7; }

    .retry-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary, #2563eb), var(--primary-light, #3b82f6));
      color: #fff; font: inherit; font-weight: 700; font-size: 1rem;
      border: none; cursor: pointer;
      box-shadow: 0 8px 30px rgba(13, 59, 102, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(13, 59, 102, 0.5); }
    .retry-btn:active { transform: translateY(0); }

    .retry-btn svg { width: 20px; height: 20px; fill: #fff; }

    .tip-text {
      font-size: 0.78rem; color: rgba(255,255,255,0.4);
      margin-top: 12px; max-width: 300px;
    }

    .bg-circles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: -1;
    }
    .bg-circles div {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.03);
    }
    .bg-circles div:nth-child(1) { width: 300px; height: 300px; top: -80px; right: -60px; }
    .bg-circles div:nth-child(2) { width: 200px; height: 200px; bottom: -40px; left: -40px; }
    .bg-circles div:nth-child(3) { width: 150px; height: 150px; top: 40%; left: 60%; }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

  <div class="bg-circles"><div></div><div></div><div></div></div>

  <div class="offline-icon">
    <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقق من شبكة Wi-Fi أو بيانات الهاتف وأعد المحاولة. سيعود التطبيق للعمل فوراً عند استعادة الاتصال.</p>

  <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px;">
    <button class="retry-btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L14 10h7V3l-3.35 3.35z"/></svg>
      إعادة المحاولة
    </button>
    <a href="/welcome.html" class="retry-btn" style="background: rgba(255,255,255,0.15);">
      الرئيسية
    </a>
  </div>

  <p class="tip-text">يمكنك تصفح الصفحات التي سبق لك زيارتها بدون اتصال</p>

  <script>
    // Auto-retry when connection comes back
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
