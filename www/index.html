<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>النظام الجامعي المتكامل</title>
  <link href="/vendor/fonts/cairo.css" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #051527;
      font-family: 'Cairo', sans-serif;
    }

    /* ===== ???? ??????? ===== */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #051527;
    }

    /* ===== ????? ???????? (Canvas) ===== */
    #particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ===== ????? ?????? ===== */
    .glow-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,0.18) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
      z-index: 1;
    }
    .glow-ring:nth-child(2) {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out 0.5s infinite;
    }
    .glow-ring:nth-child(3) {
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, rgba(37,99,235,0.04) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out 1s infinite;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.08); opacity: 1; }
    }

    /* ===== ??????? ??????? ===== */
    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ===== ????? ?????? ?? ??????? ===== */
    .logo-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.3);
      animation: logoReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
    }

    @keyframes logoReveal {
      to { opacity: 1; transform: scale(1); }
    }

    /* ????? ??????? */
    .orbit-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(37, 99, 235, 0.8);
      border-right-color: rgba(6, 182, 212, 0.5);
      animation: orbit 2.5s linear infinite;
    }
    .orbit-ring-2 {
      inset: -24px;
      border-width: 1px;
      border-top-color: rgba(6, 182, 212, 0.6);
      border-left-color: rgba(37, 99, 235, 0.3);
      animation: orbit 4s linear infinite reverse;
    }
    .orbit-ring-3 {
      inset: -38px;
      border-width: 1px;
      border-top-color: rgba(255,255,255,0.15);
      border-bottom-color: rgba(37,99,235,0.2);
      animation: orbit 6s linear infinite;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }

    /* ???? ??? ??????? */
    .orbit-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2563eb;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px #2563eb, 0 0 20px rgba(37,99,235,0.5);
    }

    /* ??????? ???????? ?????? */
    .logo-inner {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(37,99,235,0.3),
        0 0 30px rgba(37,99,235,0.2),
        0 0 60px rgba(37,99,235,0.1),
        inset 0 0 30px rgba(255,255,255,0.03);
      animation: logoPulseGlow 3s ease-in-out 1.2s infinite;
    }

    @keyframes logoPulseGlow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(37,99,235,0.3), 0 0 30px rgba(37,99,235,0.2), inset 0 0 30px rgba(255,255,255,0.03); }
      50%       { box-shadow: 0 0 0 2px rgba(37,99,235,0.6), 0 0 50px rgba(37,99,235,0.4), inset 0 0 40px rgba(255,255,255,0.05); }
    }

    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(37,99,235,0.6));
    }

    /* ===== ?????? ===== */
    .splash-title {
      margin-top: 36px;
      color: white;
      font-size: 1.55rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(20px);
      animation: textReveal 0.7s ease 1.1s forwards;
      letter-spacing: 0.02em;
    }

    .splash-subtitle {
      margin-top: 8px;
      color: rgba(148, 196, 255, 0.75);
      font-size: 0.9rem;
      font-weight: 400;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: textReveal 0.7s ease 1.35s forwards;
    }

    @keyframes textReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ???? ?????? ===== */
    .divider-line {
      margin-top: 28px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #2563eb, #06b6d4, transparent);
      border-radius: 1px;
      animation: expandLine 0.8s ease 1.6s forwards;
    }

    @keyframes expandLine {
      to { width: 160px; }
    }

    /* ===== ???? ??????? ===== */
    .loader-wrap {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeInUp 0.6s ease 1.9s forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; }
    }

    .uib-loader {
      --uib-size: 40px;
      --uib-color: rgba(148, 196, 255, 0.9);
      --uib-speed: 1.75s;
      --uib-bg-opacity: .15;
      position: relative;
      display: flex;
      flex-direction: column;
      height: var(--uib-size);
      width: var(--uib-size);
      transform: rotate(45deg);
      animation: uib-rotate calc(var(--uib-speed) * 2) ease-in-out infinite;
    }

    .uib-loader .half {
      --uib-half-size: calc(var(--uib-size) * 0.435);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--uib-half-size);
      height: var(--uib-half-size);
      overflow: hidden;
      isolation: isolate;
    }
    .uib-loader .half:first-child {
      top: 8.25%; left: 8.25%;
      border-radius: 50% 50% calc(var(--uib-size) / 15);
    }
    .uib-loader .half:last-child {
      bottom: 8.25%; right: 8.25%;
      transform: rotate(180deg);
      align-self: flex-end;
      border-radius: 50% 50% calc(var(--uib-size) / 15);
    }
    .uib-loader .half:last-child::after { animation-delay: calc(var(--uib-speed) * -1); }
    .uib-loader .half::before {
      content: '';
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: var(--uib-color);
      opacity: var(--uib-bg-opacity);
      transition: background-color 0.3s ease;
      border-radius: inherit;
    }
    .uib-loader .half::after {
      content: '';
      position: relative; z-index: 1;
      display: block;
      background-color: var(--uib-color);
      height: 100%;
      transform: rotate(45deg) translate(-3%, 50%) scaleX(1.2);
      width: 100%;
      transform-origin: bottom right;
      border-radius: 0 0 calc(var(--uib-size) / 20) 0;
      animation: uib-flow calc(var(--uib-speed) * 2) linear infinite both;
    }
    @keyframes uib-flow {
      0%             { transform: rotate(45deg) translate(-3%, 50%) scaleX(1.2); }
      30%            { transform: rotate(45deg) translate(115%, 50%) scaleX(1.2); }
      30.001%, 50%   { transform: rotate(0deg) translate(-85%, -85%) scaleX(1); }
      80%, 100%      { transform: rotate(0deg) translate(0%, 0%) scaleX(1); }
    }
    @keyframes uib-rotate {
      0%, 30%  { transform: rotate(45deg); }
      50%, 80% { transform: rotate(225deg); }
      100%     { transform: rotate(405deg); }
    }

    .loader-text {
      color: rgba(148, 196, 255, 0.6);
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      animation: blink 1.5s ease-in-out 2.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    /* ===== ???? ?????? ===== */
    .progress-bar-wrap {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.05);
      z-index: 20;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(37,99,235,0.8);
      animation: progressFill 3s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }

    @keyframes progressFill {
      0%   { width: 0%; }
      60%  { width: 85%; }
      100% { width: 100%; }
    }

    /* ===== ?????? ===== */
    #splash.exit {
      animation: splashExit 0.7s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes splashExit {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    /* ===== ????? ??????? ===== */
    .corner {
      position: absolute;
      width: 60px; height: 60px;
      z-index: 2;
      opacity: 0.4;
    }
    .corner-tl { top: 20px; right: 20px; border-top: 2px solid #2563eb; border-right: 2px solid #2563eb; border-radius: 0 8px 0 0; animation: cornerFade 1s ease 0.3s forwards; opacity: 0; }
    .corner-tr { top: 20px; left: 20px;  border-top: 2px solid #06b6d4; border-left: 2px solid #06b6d4;  border-radius: 8px 0 0 0; animation: cornerFade 1s ease 0.5s forwards; opacity: 0; }
    .corner-bl { bottom: 20px; right: 20px; border-bottom: 2px solid #06b6d4; border-right: 2px solid #06b6d4; border-radius: 0 0 8px 0; animation: cornerFade 1s ease 0.7s forwards; opacity: 0; }
    .corner-br { bottom: 20px; left: 20px;  border-bottom: 2px solid #2563eb; border-left: 2px solid #2563eb;  border-radius: 0 0 0 8px; animation: cornerFade 1s ease 0.9s forwards; opacity: 0; }

    @keyframes cornerFade { to { opacity: 0.4; } }

    /* ???? ??? ??????? */
    .version-badge {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.2);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      z-index: 20;
      opacity: 0;
      animation: fadeInUp 0.5s ease 2.2s forwards;
    }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<div id="splash">
  <canvas id="particles-canvas"></canvas>

  <!-- التأثيرات المضيئة -->
  <div class="glow-ring"></div>
  <div class="glow-ring"></div>
  <div class="glow-ring"></div>

  <!-- زوايا الشاشة -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- المحتوى -->
  <div class="splash-content">

    <!-- اللوجو مع المدارات -->
    <div class="logo-container">
      <div class="orbit-ring orbit-ring-3"></div>
      <div class="orbit-ring orbit-ring-2"></div>
      <div class="orbit-ring">
        <div class="orbit-dot"></div>
      </div>
      <div class="logo-inner">
        <img src="/assets/logo.png" class="logo-img" alt="شعار كلية النصر التقنية - جامعة النصر التقنية"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3EðŸŽ“%3C/text%3E%3C/svg%3E'">
      </div>
    </div>

    <!-- العناوين -->
    <div class="splash-title">كلية النصر التقنية</div>
    <div class="splash-subtitle">النظام الجامعي المتكامل</div>
    <div class="divider-line"></div>

    <!-- Loader -->
    <div class="loader-wrap">
      <div class="uib-loader">
        <div class="half"></div>
        <div class="half"></div>
      </div>
      <div class="loader-text">جاري التحميل...</div>
    </div>
  </div>

  <!-- شريط التقدم -->
  <div class="progress-bar-wrap">
    <div class="progress-bar"></div>
  </div>

  <div class="version-badge">v2.7.0 - كلية النصر التقنية</div>
</div>

<script>
// ===== إعدادات الجزيئات =====
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    const count = Math.floor((W * H) / 14000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x:     Math.random() * W,
        y:     Math.random() * H,
        r:     Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.5 + 0.1,
        speed: Math.random() * 0.3 + 0.05,
        dx:    (Math.random() - 0.5) * 0.4,
        color: Math.random() > 0.5 ? '37,99,235' : '6,182,212'
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      // ??? ??????
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.fill();

      // ???????
      p.y -= p.speed;
      p.x += p.dx;

      // ????? ??????? ??? ??????
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
    });

    // ??? ???? ????? ??? ???????? ???????
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx   = particles[i].x - particles[j].x;
        const dy   = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 80) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(37,99,235,${0.08 * (1 - dist / 80)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }


  resize();
  createParticles();
  draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
})();

// ===== الانتقال بعد الاسبلاش =====
const SPLASH_DURATION = 1200; // ثانية وشوية تكفي — الانتظار الطويل يجعل التطبيق يبدو بطيئاً

setTimeout(() => {
  // جلب بيانات الجلسة
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || '{}');

  // تحريك خروج الشاشة
  const splash = document.getElementById('splash');
  if (splash) splash.classList.add('exit');

  setTimeout(() => {
    if (!token) {
      window.location.replace('welcome.html');
      return;
    }

    // من لم يغيّر كلمة المرور الإجبارية لا يدخل النظام أبداً
    if (user.firstLogin) {
      window.location.replace('force-change-password.html');
      return;
    }

    // التوجيه حسب الصلاحية
    const roles = user.roles || [];
    const batchId = localStorage.getItem('cbs_active_batch_id');
    const bp = batchId ? `?batch=${batchId}` : '';

    if (roles.some(r => ['admin', 'dean'].includes(r)) && !batchId) {
      window.location.replace('admin_dashboard.html');
    } else {
      window.location.replace('dashboard.html' + bp);
    }
  }, 350);

}, SPLASH_DURATION);
</script>
</body>
</html>
