<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>المقررات الدراسية | كلية النصر التقنية</title>
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group"><strong>كلية النصر التقنية</strong><small>النظام الجامعي المتكامل</small></div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.goHome()" title="الرئيسية" aria-label="الرئيسية"><i class="ri-home-4-line"></i></button>
  </div>
</header>
<div class="page-content">
  <div class="welcome-banner" style="--page-accent:#7c3aed">
    <div class="welcome-banner-icon-wrap"><i class="ri-book-2-line welcome-banner-icon"></i></div>
    <div class="welcome-banner-body"><h2>المقررات الدراسية</h2><p>عرض جميع مقرراتك الدراسية المتاحة</p></div>
  </div>
  <div id="alertError" class="alert alert-danger" role="alert"></div>
  <!-- البحث يظهر حين تكثر المقررات فقط -->
  <div class="ui-search" id="subjectSearchWrap" hidden style="margin-bottom:12px">
    <i class="ri-search-line"></i>
    <input type="search" id="subjectSearch" placeholder="ابحث باسم المقرر أو الأستاذ" aria-label="بحث في المقررات">
  </div>
  <p class="ui-count" id="subjectCount" hidden></p>
  <div class="hm-list" id="subjectsGrid"></div>
</div>
<div id="toast-container"></div>
<footer class="main-footer">جميع الحقوق محفوظة &copy; <span id="year"></span> النظام الجامعي المتكامل</footer>
<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init();
  /* قائمة مجمّعة بدل شبكة بطاقات ملوّنة: ستة ألوان دوّارة بلا معنى كانت تُوحي
     بفروق غير موجودة بين المقررات. الأيقونة تحفظ التمييز البصري. */
  const subjectIcons=['ri-code-s-slash-line','ri-database-2-line','ri-cpu-line','ri-bar-chart-box-line','ri-shield-keyhole-line','ri-wifi-line','ri-git-branch-line','ri-terminal-box-line','ri-calculator-line','ri-globe-line','ri-server-line','ri-pencil-ruler-2-line'];
  let allSubjects = [];
  function renderSubjects(list) {
    const host = document.getElementById('subjectsGrid');
    if (!list.length) {
      host.innerHTML = `<div class="hm-row hm-empty"><span class="hm-ic" data-tone="info"><i class="ri-search-line"></i></span><div class="hm-row-body"><div class="hm-row-title">لا نتائج</div><div class="hm-row-meta">جرّب اسماً آخر للمقرر أو الأستاذ</div></div></div>`;
      return;
    }
    host.innerHTML = list.map(s => {
      const i = allSubjects.indexOf(s);
      const meta = [CBS.doctorName(s.doctor?.name), s.level ? `المستوى ${s.level}` : ''].filter(Boolean).join(' · ');
      return `<a class="hm-row" href="/subject.html?id=${encodeURIComponent(s._id)}">
        <span class="hm-ic"><i class="${subjectIcons[i % subjectIcons.length]}"></i></span>
        <div class="hm-row-body"><div class="hm-row-title">${CBS.escapeHTML(s.name)}</div><div class="hm-row-meta">${CBS.escapeHTML(meta)}</div></div>
        <span class="hm-row-end"><i class="ri-arrow-left-s-line" aria-hidden="true"></i></span>
      </a>`;
    }).join('');
  }
  async function loadSubjects() {
    CBS.showLoading('subjectsGrid','جاري تحميل المقررات...','skeleton-list');
    try {
      const res=await CBS.apiGet('/api/subjects');
      if(!res.ok) throw new Error();
      const _d=await res.json();
      const data=_d.data?.subjects||_d.subjects||_d.data||_d;
      if(!Array.isArray(data)||!data.length){CBS.showEmpty('subjectsGrid','لا توجد مقررات مسجلة حالياً','ri-book-open-line');return;}
      allSubjects = data;
      const count = document.getElementById('subjectCount');
      count.hidden = false;
      count.textContent = CBS.arCount(data.length, ['مقرر واحد', 'مقرران', 'مقررات', 'مقرراً']);
      document.getElementById('subjectSearchWrap').hidden = data.length <= 6;
      renderSubjects(data);
    } catch { CBS.showAlert('alertError','حدث خطأ أثناء الاتصال بالخادم، يرجى المحاولة لاحقاً'); }
  }
  document.getElementById('subjectSearch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    renderSubjects(q ? allSubjects.filter(s => `${s.name} ${s.doctor?.name || ''} ${s.code || ''}`.toLowerCase().includes(q)) : allSubjects);
  });  window.addEventListener('beforeunload',()=>sessionStorage.setItem('subjects_scroll',window.scrollY));
  loadSubjects().then(()=>{const s=sessionStorage.getItem('subjects_scroll');if(s){requestAnimationFrame(()=>window.scrollTo(0,parseInt(s)));sessionStorage.removeItem('subjects_scroll');}});
</script>
<script>document.addEventListener('cbs:refresh',e=>{e.preventDefault();loadSubjects().finally(()=>e.detail.done());});</script>
</body>
</html>
