  <style>
    .campus{max-width:1180px;margin:auto;padding:30px 20px 110px}.hero{color:white;padding:24px;border-radius:20px;background:#0d3b66}.hero small{opacity:.85}.hero h1{margin:10px 0;font-size:clamp(1.55rem,4vw,2.3rem)}.hero p{margin:0;color:#d8f3fb}.today{display:inline-block;margin-top:18px;padding:7px 12px;background:#ffffff18;border:1px solid #ffffff38;border-radius:99px;font-size:.8rem}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.metric,.panel{background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-sm);border-radius:20px}.metric{padding:17px}.metric i{font-size:1.45rem;color:var(--primary);display:block;margin-bottom:8px}.metric strong{font-size:1.45rem;color:var(--text-primary);display:block}.metric span{font-size:.77rem;color:var(--text-muted)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel{padding:19px}.panel+ .panel{margin-top:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.panel-head h2{font-size:1rem;margin:0}.panel-head a,.panel-head button{border:0;background:none;color:var(--primary);font:inherit;font-size:.8rem;cursor:pointer;text-decoration:none}.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--primary-light);color:var(--primary);font-size:1.15rem;flex-shrink:0}.icon.exam{background:#fff3e0;color:#d97706}.icon.meeting{background:#f1eafd;color:#7c3aed}.copy{min-width:0;flex:1}.copy strong{display:block;color:var(--text-primary);font-size:.9rem}.copy small{display:block;color:var(--text-muted);font-size:.76rem;margin-top:3px}.time{font-size:.75rem;font-weight:700;color:var(--primary);white-space:nowrap}.empty{color:var(--text-muted);font-size:.85rem;text-align:center;padding:22px 6px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick a{padding:13px;border:1px solid var(--border);border-radius:14px;text-decoration:none;color:var(--text-primary);font-size:.82rem;font-weight:700}.quick i{color:var(--primary);margin-left:5px}.overlay{position:fixed;inset:0;background:#07142290;display:none;z-index:9999;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.form{background:var(--bg-card);border-radius:20px;width:min(530px,100%);padding:22px}.form h2{margin:0 0 15px;font-size:1.1rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.form label{display:block;margin-bottom:5px;font-weight:700;font-size:.78rem}.form input,.form select,.form textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);color:var(--text-primary);font:inherit}.form textarea{min-height:70px}.actions{display:flex;gap:10px;margin-top:17px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.ghost{background:var(--bg-input);color:var(--text-secondary)}@media(max-width:850px){.campus{padding:16px 14px 95px}.hero{padding:22px 18px;border-radius:20px}.metrics{grid-template-columns:1fr 1fr}.layout,.fields{grid-template-columns:1fr}}
      /* إعادة التصميم: بلا بطاقة ترحيب ملوّنة (مكررة مع الرئيسية)، والأرقام شريط واحد */
    .campus .hero { background: none !important; color: var(--text-main) !important; padding: 0 2px !important; margin-bottom: 14px !important; box-shadow: none !important; border: 0 !important; min-height: 0 !important; }
    .campus .hero::before, .campus .hero::after { display: none !important; }
    .campus .hero small { color: var(--text-muted) !important; font-size: 0.78rem; }
    .campus .hero h1 { color: var(--text-main) !important; font-size: 1.35rem !important; margin: 2px 0 !important; }
    .campus .hero p { color: var(--text-muted) !important; font-size: 0.85rem; }
    .campus .hero .today { display: none !important; }
    .campus .metrics { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 0 !important; background: var(--hm-surface); border: 1px solid var(--border); border-radius: 18px; margin-bottom: 16px; }
    .campus .metric { background: none !important; border: 0 !important; box-shadow: none !important; padding: 12px 4px !important; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
    .campus .metric + .metric::before { content: ''; position: absolute; top: 16px; bottom: 16px; inset-inline-start: 0; width: 1px; background: var(--border); }
    .campus .metric i { display: none !important; }
    .campus .metric strong { font-size: 1.25rem !important; color: var(--text-main); }
    .campus .metric span { font-size: 0.72rem !important; color: var(--text-muted); }
    .campus .panel { background: var(--hm-surface) !important; border: 1px solid var(--border) !important; box-shadow: none !important; border-radius: 16px !important; }
</style>

<body>
<header class="main-header"><div class="header-brand"><img src="/assets/logo.png" class="header-logo" alt="شعار الكلية"><div class="header-title-group"><strong>كلية النصر التقنية</strong><small>جامعة النصر التقنية</small></div></div><div class="header-actions"><button class="btn-icon" onclick="CBS.toggleDark()" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button><button class="btn-icon" onclick="location.href='/dashboard.html'" title="الرئيسية" aria-label="الرئيسية"><i class="ri-home-5-line"></i></button></div></header>
<main class="campus"><section class="hero"><small id="batchName"><i class="ri-compass-3-line"></i> مركز اليوم الدراسي</small><h1 id="greeting">أهلاً بك</h1><p id="heroText">نرتب لك أهم ما تحتاجه اليوم في مكان واحد.</p><span class="today" id="today"></span></section><section class="metrics" id="metrics"><div class="metric"><i class="ri-loader-4-line"></i><strong>—</strong><span>جاري التحميل</span></div></section><section class="layout"><div><div class="panel"><div class="panel-head"><h2><i class="ri-calendar-schedule-line"></i> القادم في جدولك</h2><button id="newEvent" hidden><i class="ri-add-line"></i> إضافة فعالية</button></div><div id="events"><div class="empty">جاري تحميل الجدول…</div></div></div><div class="panel"><div class="panel-head"><h2><i class="ri-task-line"></i> الواجبات القادمة</h2><a href="/assignments.html">عرض الكل</a></div><div id="assignments"></div></div></div><aside><div class="panel"><div class="panel-head"><h2><i class="ri-notification-3-line"></i> يحتاج انتباهك</h2><a href="/notifications.html">كل التنبيهات</a></div><div id="notices"></div></div><div class="panel"><div class="panel-head"><h2><i class="ri-flashlight-line"></i> وصول سريع</h2></div><div class="quick"><a href="/subjects.html"><i class="ri-book-open-line"></i> المواد</a><a href="/attendance-history.html"><i class="ri-calendar-check-line"></i> الحضور</a><a href="/video-library.html"><i class="ri-play-circle-line"></i> المحاضرات</a><a href="/assignments.html"><i class="ri-file-list-3-line"></i> التكليفات</a></div></div></aside></section></main>
<div class="overlay" id="eventModal"><form class="form" id="eventForm"><h2>إضافة فعالية للدفعة</h2><div class="fields"><div class="full"><label for="campusEventTitle">العنوان</label><input id="campusEventTitle" name="title" required maxlength="140" placeholder="مثال: محاضرة قواعد البيانات"></div><div><label for="campusEventType">النوع</label><select id="campusEventType" name="type"><option value="lecture">محاضرة</option><option value="exam">اختبار</option><option value="meeting">اجتماع</option><option value="assignment">موعد تسليم</option><option value="holiday">إجازة</option></select></div><div class="full"><label for="campusEventSubject">المادة</label><select id="campusEventSubject" name="subject"><option value="">عامة للدفعة</option></select></div><div><label for="campusEventLocation">المكان أو الرابط</label><input id="campusEventLocation" name="location" maxlength="160"></div><div class="full"><label for="campusEventStartsAt">موعد البداية</label><input id="campusEventStartsAt" name="startsAt" type="datetime-local" required></div><div class="full"><label for="campusEventDescription">ملاحظة</label><textarea id="campusEventDescription" name="description" maxlength="1200"></textarea></div></div><div class="actions"><button class="btn primary" type="submit">حفظ في الجدول</button><button class="btn ghost" type="button" id="cancelEvent">إلغاء</button></div></form></div><div id="toast-container"></div>
<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script><script>
const icons={lecture:'ri-presentation-line',exam:'ri-pencil-ruler-2-line',meeting:'ri-team-line',assignment:'ri-task-line',holiday:'ri-sun-line'};const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const clock=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});document.querySelector('#today').textContent=day.format(new Date());const empty=t=>`<div class="empty">${t}</div>`;
function render(data){const o=data.overview,m=o.metrics,u=o.user;batchName.textContent=o.batch?`${o.batch.name} · ${o.batch.code}`:'مركز اليوم الدراسي';greeting.textContent=`أهلاً ${u.name.split(' ')[0]}`;heroText.textContent=u.roles.includes('student')?'هذه خطتك الأكاديمية ومهامك القادمة.':'هذه صورة سريعة لما يحدث في دفعتك اليوم.';let vals=[['ri-book-open-line',m.subjects,'مادة دراسية'],['ri-task-line',m.upcomingAssignments,'واجبات قادمة'],['ri-notification-3-line',m.unreadNotifications,'تنبيهات جديدة']];vals.push(m.attendance?['ri-user-follow-line',m.attendance.rate===null?'—':`${m.attendance.rate}%`,'نسبة الحضور']:['ri-group-line',m.studentCount,'طالب في الدفعة']);metrics.innerHTML=vals.map(x=>`<div class="metric"><i class="${x[0]}"></i><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('');events.innerHTML=o.upcoming.events.length?o.upcoming.events.map(e=>`<div class="row"><div class="icon ${esc(e.type)}"><i class="${icons[e.type]||icons.lecture}"></i></div><div class="copy"><strong>${esc(e.title)}</strong><small>${esc(e.subject?.name||e.location||'فعالية للدفعة')}</small></div><span class="time">${clock.format(new Date(e.startsAt))}</span></div>`).join(''):empty('لا توجد فعاليات قادمة.');assignments.innerHTML=o.upcoming.assignments.length?o.upcoming.assignments.map(a=>`<div class="row"><div class="icon"><i class="ri-file-list-3-line"></i></div><div class="copy"><strong>${esc(a.title)}</strong><small>${esc(a.subject?.name||'تكليف')} · التسليم ${clock.format(new Date(a.dueDate))}</small></div></div>`).join(''):empty('لا توجد واجبات قريبة.');notices.innerHTML=o.upcoming.notifications.length?o.upcoming.notifications.map(n=>`<div class="row"><div class="icon ${n.type==='emergency'?'exam':''}"><i class="${n.type==='emergency'?'ri-alarm-warning-line':'ri-information-line'}"></i></div><div class="copy"><strong>${esc(n.title)}</strong><small>${esc(n.message)}</small></div></div>`).join(''):empty('أنت مطّلع على كل شيء.');if(u.roles.some(r=>['dean','admin','doctor','leader'].includes(r))){newEvent.hidden=false;loadEventSubjects(u)}}
/* الدكتور يضيف فعاليات لمواده فقط: المادة إلزامية له واختيارية لليدر والعميد */
let _subjectsLoaded=false;async function loadEventSubjects(u){if(_subjectsLoaded)return;_subjectsLoaded=true;const sel=document.getElementById('campusEventSubject');const isDoctorOnly=u.roles.includes('doctor')&&!u.roles.some(r=>['dean','admin','leader'].includes(r));try{const r=await CBS.apiGet('/api/subjects?limit=50'),d=await r.json();const list=d.data?.subjects||[];sel.innerHTML=(isDoctorOnly?'<option value="">اختر المادة</option>':'<option value="">عامة للدفعة</option>')+list.map(s=>`<option value="${esc(s._id)}">${esc(s.name)}</option>`).join('');sel.required=isDoctorOnly}catch{}}
async function load(){
  const user = CBS.getUser();
  if(CBS.getPrimaryRole(user) === 'dean') {
    window.location.replace('/admin_dashboard.html');
    return;
  }
  try{let r=await CBS.apiGet('/api/campus/overview'),d=await r.json();if(!r.ok||!d.success)throw Error(d.message);render(d.data)}catch(e){events.innerHTML=empty('تعذر تحميل مركز اليوم الدراسي.')}}newEvent.onclick=()=>eventModal.classList.add('show');cancelEvent.onclick=()=>eventModal.classList.remove('show');eventForm.onsubmit=async e=>{e.preventDefault();let body=Object.fromEntries(new FormData(e.target));body.startsAt=new Date(body.startsAt).toISOString();try{let r=await CBS.apiPost('/api/academic-events',body),d=await r.json();if(!r.ok)throw Error(d.message);CBS.toast('تمت إضافة الفعالية','ظهرت الآن في جدول الدفعة','success');eventModal.classList.remove('show');e.target.reset();load()}catch(err){CBS.toast('تعذر الحفظ',err.message||'حاول مرة أخرى','error')}};if(CBS.init())load();
</script></body></html>
