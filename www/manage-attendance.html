<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة الحضور | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <style>
    .setup-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    .setup-card .form-group { flex: 1; min-width: 200px; }

    .attendance-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .student-row:last-child { border-bottom: none; }
    .student-row.present { background: var(--success-bg); }
    .student-row.absent  { background: var(--danger-bg); }

    .student-name  { font-weight: 600; color: var(--text-main); }
    .student-email { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .att-btns { display: flex; gap: 8px; }
    .att-btn {
      padding: 7px 18px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--bg-hover);
      color: var(--text-muted);
      transition: var(--transition-fast);
    }
    .att-btn.present.active { background: var(--success); border-color: var(--success); color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
    .att-btn.absent.active  { background: var(--danger);  border-color: var(--danger);  color: #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }
    .att-btn.present:hover  { border-color: var(--success); color: var(--success); background: var(--success-bg); }
    .att-btn.absent:hover   { border-color: var(--danger);  color: var(--danger); background: var(--danger-bg); }

    .save-bar {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    @media (max-width: 600px) {
      .student-row { flex-direction: column; gap: 12px; align-items: flex-start; }
      .att-btns { width: 100%; }
      .att-btn  { flex: 1; text-align: center; }
    }
      /* ===== إعادة التصميم ===== */
    .ma-fields { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
    .ma-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .ma-field span { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .ma-field select, .ma-field input { width: 100%; min-height: 46px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); font: inherit; font-size: 0.88rem; }
    .ma-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .ma-of { font-size: 0.82rem; color: var(--text-muted); font-weight: 700; }
    .ma-bulk { display: flex; gap: 8px; margin-bottom: 10px; }
    .ma-row { cursor: pointer; padding-block: 10px; }
    .ma-av { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--text-muted); background: var(--bg-hover); }
    .ma-row.present .ma-av { color: var(--success-text); background: var(--success-bg); }
    .ma-seg { display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--bg-hover); flex-shrink: 0; }
    .ma-seg .att-btn { min-height: 34px !important; min-width: 0 !important; padding: 0 10px !important; border: 0 !important; border-radius: 8px !important; font-size: 0.78rem !important; font-weight: 700; color: var(--text-muted); background: transparent !important; cursor: pointer; }
    .ma-seg .att-btn.present.active { color: #fff; background: var(--success) !important; }
    .ma-seg .att-btn.absent.active { color: #fff; background: var(--danger-solid) !important; }
    .ma-savebar { display: none; position: sticky; bottom: calc(var(--bnav-offset) + var(--bnav-height) + 8px); z-index: 5; gap: 8px; align-items: center; margin-top: 14px; padding: 10px; border-radius: 16px; background: var(--hm-surface); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); }
    @media (min-width: 901px) { .ma-savebar { bottom: 16px; } }
    /* أثناء رصد الكشف يغطي زر كيدي زر التصدير في شريط الحفظ */
    body:has(#saveBar[style*="flex"]) .kedy-global-fab, body:has(#saveBar[style*="flex"]) .kf-tip { visibility: hidden; }
</style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>النظام الجامعي المتكامل</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.goHome()" title="الرئيسية"><i class="ri-home-4-line"></i></button>
  </div>
</header>

<div class="page-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner" style="--page-accent:#047857">
      <div class="welcome-banner-icon-wrap">
        <i class="ri-calendar-check-line welcome-banner-icon"></i>
      </div>
      <div class="welcome-banner-body">
        <h2>تسجيل الحضور</h2>
        <p>إدارة حضور وغياب الطلاب في المحاضرات</p>
      </div>
    </div>
  <div class="ui-toolbar" style="justify-content:flex-end">
    <a href="/attendance-history.html" class="ui-act"><i class="ri-history-line"></i> سجل الحضور</a>
  </div>

  <!-- المقرر والتاريخ في بطاقة واحدة مضغوطة -->
  <div class="ui-card ma-setup">
    <div class="ma-fields">
      <label class="ma-field"><span>المقرر</span><select id="subjectSelect"><option value="">اختر المقرر</option></select></label>
      <label class="ma-field"><span>التاريخ</span><input type="date" id="attDate"></label>
    </div>
    <button type="button" class="ui-primary" style="width:100%;margin-top:12px" onclick="loadStudents()"><i class="ri-play-circle-line"></i> بدء التحضير</button>
  </div>

  <div id="alertMsg" class="alert"></div>

  <!-- بعد التحميل: ملخص حي + تحديد جماعي + بحث -->
  <div id="searchAttContainer" style="display:none;margin-top:18px">
    <div class="ma-summary" id="attSummary"></div>
    <div class="ma-bulk">
      <button type="button" class="ui-chip" onclick="markAll('present')"><i class="ri-checkbox-multiple-line"></i> الكل حاضر</button>
      <button type="button" class="ui-chip" onclick="markAll('absent')"><i class="ri-close-circle-line"></i> الكل غائب</button>
    </div>
    <div class="ui-search" style="margin-bottom:10px"><i class="ri-search-line"></i>
      <input type="search" id="searchAttInput" placeholder="ابحث عن طالب" aria-label="ابحث عن طالب" oninput="searchAttendance(this.value)"></div>
  </div>

  <div class="hm-list" id="attList" style="display:none;"></div>

  <div class="ma-savebar" id="saveBar">
    <button type="button" class="ui-primary" style="flex:1" onclick="saveAttendance()"><i class="ri-save-line"></i> حفظ الكشف</button>
    <button type="button" class="ui-act" style="min-height:44px" onclick="exportAttendanceExcel()" title="تصدير Excel" aria-label="تصدير Excel"><i class="ri-file-excel-2-line"></i> Excel</button>
  </div>
</div>

<div id="toast-container"></div>

<footer class="main-footer">
  جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل
</footer>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init({ requireRoles: ['dean', 'doctor', 'leader', 'admin'] });

  document.getElementById('attDate').valueAsDate = new Date();

  let students = [], attStatus = {};

  async function loadSubjectsList() {
    try {
      const res  = await CBS.apiGet('/api/subjects');
      const _resData = await CBS.readJson(res);
      const list = _resData.data?.subjects || _resData.subjects || _resData.data || _resData;
      const sel  = document.getElementById('subjectSelect');
      /* مقررات الدفعة النشطة فقط: كانت تظهر مواد الدكتور في كل دفعاته فيُرصد
         حضور مادة على طلاب دفعة لا تدرسها */
      const activeBatch = CBS.getBatchId?.() || CBS.getUser()?.batch || '';
      const inBatch = s => !activeBatch || (s.batches || []).some(b => String(b?._id || b) === String(activeBatch));
      const visible = (Array.isArray(list) ? list : []).filter(inBatch);
      sel.innerHTML = '<option value="">اختر المقرر</option>' +
        visible.map(s => `<option value="${CBS.escapeHTML(s._id)}">${CBS.escapeHTML(s.name)}</option>`).join('');
      if (!visible.length) sel.innerHTML = '<option value="">لا توجد مقررات في هذه الدفعة</option>';
    } catch { CBS.toast('خطأ في تحميل المقررات', '', 'error'); }
  }

  async function loadStudents() {
    const subjectId = document.getElementById('subjectSelect').value;
    if (!subjectId) { CBS.showAlert('alertMsg', 'يرجى اختيار المقرر أولاً', 'warning'); return; }
    CBS.hideAlert('alertMsg');

    CBS.showLoading('attList', 'جاري تحميل قائمة الطلاب...');
    document.getElementById('attList').style.display = 'block';
    document.getElementById('saveBar').style.display = 'none';

    try {
      const res = await CBS.apiGet(`/api/attendance/students?subject=${subjectId}`);
      if (!res.ok) throw new Error();
      students = await res.json();
      attStatus = {};
      renderStudents();
      document.getElementById('saveBar').style.display = 'flex';
      document.getElementById('searchAttContainer').style.display = 'block';
      document.getElementById('searchAttInput').value = ''; // reset search
    } catch {
      CBS.showAlert('alertMsg', 'حدث خطأ أثناء الاتصال بالخادم', 'danger');
    }
  }

  function renderStudents() {
    const list = document.getElementById('attList');
    if (!students.length) {
      CBS.showEmpty('attList', 'لا يوجد طلاب مسجلين في هذا المقرر', 'ri-group-line');
      return;
    }
    // صف لكل طالب: الضغط على الصف يبدّل الحالة، والمفتاح الثنائي يوضحها
    list.innerHTML = students.map(s => {
      const st = attStatus[s._id] || 'absent';
      return `<div class="hm-row ma-row ${st}" id="row-${s._id}" onclick="toggleStatus('${s._id}')">
          <span class="ma-av">${CBS.escapeHTML((s.name || '؟').trim().charAt(0))}</span>
          <div class="hm-row-body"><div class="hm-row-title">${CBS.escapeHTML(s.name)}${s.batch?.code ? ` <span class="hm-chip">${CBS.escapeHTML(s.batch.code)}</span>` : ''}</div>
            <div class="hm-row-meta">${CBS.escapeHTML(s.email || '')}</div></div>
          <span class="ma-seg" onclick="event.stopPropagation()">
            <button type="button" class="att-btn present ${st === 'present' ? 'active' : ''}" onclick="setStatus('${s._id}','present')">حاضر</button>
            <button type="button" class="att-btn absent ${st === 'absent' ? 'active' : ''}" onclick="setStatus('${s._id}','absent')">غائب</button>
          </span>
        </div>`;
    }).join('');
    updateSummary();
  }

  function updateSummary() {
    const present = students.filter(s => attStatus[s._id] === 'present').length;
    document.getElementById('attSummary').innerHTML =
      `<span class="hm-chip" data-tone="success">حاضر ${present}</span><span class="hm-chip" data-tone="danger">غائب ${students.length - present}</span><span class="ma-of">من ${students.length}</span>`;
  }

  function setStatus(id, status) {
    attStatus[id] = status;
    const row = document.getElementById(`row-${id}`);
    if (row) {
      row.classList.remove('present', 'absent');
      row.classList.add(status);
      row.querySelectorAll('.att-btn').forEach(b => b.classList.toggle('active', b.classList.contains(status)));
    }
    updateSummary();
  }
  function toggleStatus(id) { setStatus(id, attStatus[id] === 'present' ? 'absent' : 'present'); }
  function markAll(status) { students.forEach(s => setStatus(s._id, status)); CBS.vibrate?.(15); }

  function searchAttendance(query) {
    const q = query.toLowerCase().trim();
    document.querySelectorAll('#attList .ma-row').forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  async function saveAttendance() {
    const subject = document.getElementById('subjectSelect').value;
    const date    = document.getElementById('attDate').value;
    if (!subject || !date) { CBS.showAlert('alertMsg', 'تأكد من اختيار المقرر والتاريخ', 'warning'); return; }

    const records = students.map(s => ({ student: s._id, status: attStatus[s._id] || 'absent' }));
    try {
      const payload = { subject, date, students: records };

      // بلا إنترنت: نحفظ العملية محلياً لترفع تلقائياً عند عودة الاتصال
      if (!navigator.onLine) {
        CBS.enqueueOfflineTask('attendance', payload);
        CBS.vibrate(25);
        clearAttendanceForm();
        return;
      }

      const res = await CBS.apiPost('/api/attendance', payload);
      if (res.ok) {
        CBS.toast('تم حفظ سجل الحضور بنجاح', '', 'success');
        CBS.vibrate(25);
        clearAttendanceForm();
      } else {
        const err = await res.json().catch(() => ({}));
        CBS.showAlert('alertMsg', err.message || 'خطأ في عملية الحفظ', 'danger');
      }
    } catch (e) {
      // فشل الشبكة أثناء الإرسال: لا نُضيّع عمل المستخدم — نُدرجه في الطابور
      CBS.enqueueOfflineTask('attendance', { subject, date, students: records });
      clearAttendanceForm();
    }
  }

  function clearAttendanceForm() {
    attStatus = {};
    document.getElementById('attList').style.display = 'none';
    document.getElementById('saveBar').style.display = 'none';
    document.getElementById('searchAttContainer').style.display = 'none';
  }

  function exportAttendanceExcel() {
    if (!students || !students.length) { CBS.toast('لا توجد بيانات للتصدير', '', 'warning'); return; }
    const subjectEl = document.getElementById('subjectSelect');
    const dateEl = document.getElementById('attDate');
    const subjectName = subjectEl.options[subjectEl.selectedIndex]?.text || 'حضور';
    const dateVal = dateEl?.value || new Date().toISOString().slice(0,10);
    // Build temp table
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;pointer-events:none;';
    div.innerHTML = `<table id="__attExportTable">
      <thead><tr><th>#</th><th>اسم الطالب</th><th>البريد الإلكتروني</th><th>الحالة</th></tr></thead>
      <tbody>${students.map((s,i)=>`<tr><td>${i+1}</td><td>${CBS.escapeHTML(s.name||'')}</td><td>${CBS.escapeHTML(s.email||'')}</td><td>${attStatus[s._id]==='present'?'حاضر':'غائب'}</td></tr>`).join('')}</tbody>
    </table>`;
    document.body.appendChild(div);
    CBS.exportTableToExcel('__attExportTable', `Attendance_${subjectName}_${dateVal}.xlsx`);
    div.remove();
  }

  loadSubjectsList();
</script>
</body>
</html>
