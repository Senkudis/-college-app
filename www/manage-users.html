<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d3b66">
  <link rel="manifest" href="/manifest.json">
  <title>إدارة المستخدمين | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    /* ===== Compact User Cards for Mobile ===== */
    #usersList .card {
      margin-bottom: 10px;
      padding: 13px 14px;
    }
    .user-card-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .user-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: flex-end;
    }
    .btn-xs {
      padding: 5px 10px;
      font-size: 0.76rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    @media (max-width: 480px) {
      .user-card-actions { margin-top: 8px; }
      .btn-xs { padding: 5px 8px; font-size: 0.72rem; }
    }
    /* مربعات التحديد 16px صعبة اللمس على الهاتف */
  #selectAllUsers, .cb-user { width: 22px !important; height: 22px !important; accent-color: var(--primary); }
    .mu-tools { display: flex; gap: 8px; margin-bottom: 8px; }
    .mu-tools .ui-search { flex: 1; min-width: 0; }
    .mu-tools select { min-height: 44px; max-width: 40%; padding: 0 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--hm-surface); color: var(--text-main); font: inherit; font-size: 0.84rem; }
    .mu-selectall { display: inline-flex; align-items: center; gap: 6px; margin: 0 2px 10px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .mu-row .cb-user { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
    .mu-av { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--primary-text); background: var(--primary-light); }
    .hm-list .mu-row + .mu-row::before { inset-inline-start: 96px; }
</style>
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>إدارة المستخدمين</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.logout()" title="خروج" aria-label="تسجيل الخروج"><i class="ri-logout-box-r-line"></i></button>
  </div>
</header>

<div class="page-content">

  <!-- Welcome Banner -->
  <div class="welcome-banner" style="--page-accent:#2563eb">
    <div class="welcome-banner-icon-wrap">
      <i class="ri-team-line welcome-banner-icon"></i>
    </div>
    <div class="welcome-banner-body">
      <h2>إدارة المستخدمين</h2>
      <p>إضافة وتعديل وحذف حسابات المستخدمين</p>
    </div>
  </div>

  <div class="ui-toolbar">
    <button type="button" class="ui-primary" onclick="CBS.openModal('userModal')"><i class="ri-user-add-line"></i> مستخدم جديد</button>
    <button type="button" class="ui-act" onclick="copyAllEmails()" style="min-height:44px"><i class="ri-file-copy-line"></i> نسخ الإيميلات</button>
  </div>

  <!-- طلبات التسجيل: تظهر فقط حين توجد فعلاً (كان رقمها ثابتاً على 0) -->
  <a class="hm-alert" id="pendingAlert" href="/pending-registrations.html" hidden style="background:var(--warning-bg);color:var(--warning-text)">
    <i class="ri-user-received-line"></i><span id="pendingText"></span><i class="ri-arrow-left-s-line"></i>
  </a>

  <!-- الأدوار كشرائح تصفية بأعدادها (كانت أربع بطاقات أرقام لا تُضغط) -->
  <div class="ui-chips" id="roleChips" aria-label="تصفية حسب الدور">
    <button type="button" class="ui-chip" data-r="" aria-pressed="true">الكل <span class="n" id="statTotal"></span></button>
    <button type="button" class="ui-chip" data-r="student">طلاب <span class="n" id="statStudents"></span></button>
    <button type="button" class="ui-chip" data-r="leader">قادة دفعات <span class="n" id="statLeaders"></span></button>
    <button type="button" class="ui-chip" data-r="doctor">أساتذة <span class="n" id="statDoctors"></span></button>
    <button type="button" class="ui-chip" data-r="dean">إدارة <span class="n" id="statDeans"></span></button>
  </div>

  <div class="mu-tools">
    <div class="ui-search"><i class="ri-search-line"></i><input type="search" id="searchUserInput" placeholder="ابحث بالاسم أو البريد" aria-label="ابحث بالاسم أو البريد" oninput="searchUsers(this.value)"></div>
    <select id="filterBatch" onchange="loadUsers()" aria-label="الدفعة"><option value="">كل الدفعات</option></select>
  </div>
  <label class="mu-selectall"><input type="checkbox" id="selectAllUsers" onchange="toggleSelectAllUsers(this.checked)"> تحديد الكل (لنسخ الإيميلات)</label>

  <div id="usersList">
    <div class="loading-state">
      <div class="uib-loader dark"><div class="half"></div><div class="half"></div></div>
      <p>جاري تحميل المستخدمين...</p>
    </div>
  </div>

  <div class="pagination-controls" style="display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;">
    <button class="btn btn-secondary btn-sm" onclick="prevPage()" id="prevPageBtn" disabled aria-label="الصفحة السابقة">
      <i class="ri-arrow-right-s-line"></i> السابق
    </button>
    <span id="pageInfo" style="font-size:14px;color:var(--text-muted);">صفحة 1 من 1</span>
    <button class="btn btn-secondary btn-sm" onclick="nextPage()" id="nextPageBtn" aria-label="الصفحة التالية">
      التالي <i class="ri-arrow-left-s-line"></i>
    </button>
  </div>

</div>

<div id="toast-container"></div>

<!-- Add/Edit User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">إضافة مستخدم جديد</h3>
      <button class="modal-close" onclick="CBS.closeModal('userModal')" aria-label="إغلاق"><i class="ri-close-line"></i></button>
    </div>
    <div class="modal-body">
      <form id="userForm">
        <input type="hidden" id="editUserId">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="userName" required placeholder="أدخل الاسم الكامل">
        </div>
        <div class="form-group">
          <label for="userEmail">البريد الإلكتروني</label>
          <input type="email" id="userEmail" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label for="userPass">كلمة المرور</label>
          <input type="password" id="userPass" placeholder="أدخل كلمة المرور" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr">
        </div>
        <div class="form-group">
          <label for="userRole">الصلاحية</label>
          <select id="userRole" required>
            <option value="student">طالب</option>
            <option value="leader">قائد دفعة</option>
            <option value="doctor">أستاذ</option>
            <option value="dean">عميد</option>
            <option value="admin">مسؤول النظام</option>
          </select>
        </div>
        <div class="form-group" id="batchFormGroup">
          <label for="userBatch">الدفعة</label>
          <select id="userBatch">
            <option value="">غير محدد</option>
            <!-- Batches will be loaded here -->
          </select>
        </div>
        <div class="form-group" id="batchesFormGroup" style="display: none;">
          <label>الدفعات (لأستاذ المادة)</label>
          <div id="userBatchesList" style="display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card);">
            <!-- Checkboxes will be loaded here -->
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="CBS.closeModal('userModal')">إلغاء</button>
      <button class="btn btn-primary" id="saveUserBtn" onclick="saveUser()">حفظ</button>
    </div>
  </div>
</div>

<footer class="main-footer">
  حقوق النشر &copy; <span id="year"></span> جامعة النصر التقنية &nbsp;|&nbsp; تطوير: ضياء الدين إبراهيم
</footer>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init({ requireRoles: ['dean', 'admin'] });

  const roleLabels = { dean: 'عميد', admin: 'مسؤول النظام', doctor: 'أستاذ', leader: 'قائد دفعة', student: 'طالب' };
  const roleColors = { dean: 'badge-danger', admin: 'badge-danger', doctor: 'badge-warning', leader: 'badge-primary', student: 'badge-success' };

  let batchesLoaded = false;
  async function loadBatches() {
    if (batchesLoaded) return;
    try {
      const res = await CBS.apiGet('/api/batches');
      const data = await res.json();
      if (res.ok && data.batches) {
        const select = document.getElementById('userBatch');
        select.innerHTML = '<option value="">غير محدد</option>' + 
          data.batches.map(b => `<option value="${b._id}">${CBS.escapeHTML(b.name)}</option>`).join('');
        
        const filterSelect = document.getElementById('filterBatch');
        if (filterSelect) {
          filterSelect.innerHTML = '<option value="">كل الدفعات</option>' + 
            data.batches.map(b => `<option value="${b._id}">${CBS.escapeHTML(b.name)}</option>`).join('');
        }
        
        // Load checkboxes
        const batchesList = document.getElementById('userBatchesList');
        if (batchesList) {
          batchesList.innerHTML = data.batches.map(b => `
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" name="doctorBatches" value="${b._id}">
              <span>${CBS.escapeHTML(b.name)}</span>
            </label>
          `).join('');
        }
        
        batchesLoaded = true;
      }
    } catch (e) { console.error('Failed to load batches', e); }
  }

  // Toggle batch/batches visibility based on role
  document.getElementById('userRole').addEventListener('change', function(e) {
    const role = e.target.value;
    if (role === 'doctor') {
      document.getElementById('batchFormGroup').style.display = 'none';
      document.getElementById('batchesFormGroup').style.display = 'block';
    } else {
      document.getElementById('batchFormGroup').style.display = 'block';
      document.getElementById('batchesFormGroup').style.display = 'none';
    }
  });

  let allUsers = [];
  let filteredUsers = [];
  let currentPage = 1;
  const pageSize = 25;

  function renderPage() {
    const container = document.getElementById('usersList');
    if (!filteredUsers.length) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">لا يوجد مستخدمون مطابقون</p>';
      updatePaginationControls();
      return;
    }

    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;
    const pageUsers = filteredUsers.slice(start, end);

    container.innerHTML = '<div class="hm-list">' + pageUsers.map(u => {
      const role = u.roles?.[0] || 'student';
      let batchesDataAttr = '';
      let where = '';
      if (role === 'doctor') {
        where = CBS.arCount(u.batches?.length || 0, ['دفعة واحدة', 'دفعتان', 'دفعات', 'دفعة']);
        batchesDataAttr = u.batches ? JSON.stringify(u.batches.map(b => String(b._id || b))).replace(/"/g, '&quot;') : '[]';
      } else if (u.batch?.name) where = u.batch.name;
      const batchId = u.batch ? (u.batch._id || u.batch) : '';
      return `<div class="hm-row mu-row">
          <input type="checkbox" class="cb-user" value="${CBS.escapeHTML(u.email || '')}" aria-label="تحديد">
          <span class="mu-av">${CBS.escapeHTML((u.name || '?')[0])}</span>
          <div class="hm-row-body">
            <div class="hm-row-title">${CBS.escapeHTML(u.name || '-')}</div>
            <div class="hm-row-meta"><span dir="ltr">${CBS.escapeHTML(u.email || '-')}</span>${where ? ' · ' + CBS.escapeHTML(where) : ''}</div>
          </div>
          <span class="hm-row-end">
            <span class="hm-chip">${roleLabels[role] || CBS.escapeHTML(role)}</span>
            <button type="button" class="ui-icon-btn" data-id="${u._id}" data-name="${CBS.escapeHTML(u.name)}" data-email="${CBS.escapeHTML(u.email)}" data-role="${role}" data-batch="${batchId}" data-batches="${batchesDataAttr}" onclick="editUser(this.dataset.id,this.dataset.name,this.dataset.email,this.dataset.role,this.dataset.batch,this.dataset.batches)" title="تعديل" aria-label="تعديل"><i class="ri-edit-line"></i></button>
            <button type="button" class="ui-icon-btn danger" onclick="deleteUser('${u._id}')" title="حذف" aria-label="حذف"><i class="ri-delete-bin-line"></i></button>
          </span>
        </div>`;
    }).join('') + '</div>';

    updatePaginationControls();
  }

  function updatePaginationControls() {
    const totalPages = Math.ceil(filteredUsers.length / pageSize) || 1;
    document.getElementById('pageInfo').textContent = `صفحة ${currentPage} من ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = currentPage === 1;
    document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
  }

  function prevPage() {
    if (currentPage > 1) {
      currentPage--;
      renderPage();
      document.getElementById('selectAllUsers').checked = false;
    }
  }

  function nextPage() {
    const totalPages = Math.ceil(filteredUsers.length / pageSize) || 1;
    if (currentPage < totalPages) {
      currentPage++;
      renderPage();
      document.getElementById('selectAllUsers').checked = false;
    }
  }

  async function loadUsers() {
    const container = document.getElementById('usersList');
    container.innerHTML = '<div class="loading-state"><div class="uib-loader dark"><div class="half"></div><div class="half"></div></div><p>جاري التحميل...</p></div>';
    await loadBatches();
    
    const batchFilter = document.getElementById('filterBatch') ? document.getElementById('filterBatch').value : '';
    const url = batchFilter ? `/api/users?batch=${batchFilter}&limit=1000` : '/api/users?limit=1000';

    try {
      const res = await CBS.apiGet(url);
      if (!res.ok) throw new Error();
      const data = await res.json();
      allUsers = data.users || data;

      const roleCount = r => allUsers.filter(u => (u.roles?.[0] || 'student') === r).length;
      document.getElementById('statTotal').textContent = allUsers.length || '';
      document.getElementById('statStudents').textContent = roleCount('student') || '';
      document.getElementById('statLeaders').textContent = roleCount('leader') || '';
      document.getElementById('statDoctors').textContent = roleCount('doctor') || '';
      document.getElementById('statDeans').textContent = (roleCount('dean') + roleCount('admin')) || '';

      // يحترم تصفية الدور والبحث الحاليين بعد تغيير الدفعة
      applyUserFilters();
    } catch (err) {
      container.innerHTML = '<div class="alert alert-danger show" role="alert">تعذر تحميل المستخدمين</div>';
    }
  }

  function editUser(id, name, email, role, batch, batchesStr) {
    document.getElementById('modalTitle').textContent = 'تعديل المستخدم';
    document.getElementById('editUserId').value = id;
    document.getElementById('userName').value = name;
    document.getElementById('userEmail').value = email;
    document.getElementById('userRole').value = role;
    document.getElementById('userBatch').value = batch || '';
    
    // Trigger role change logic
    document.getElementById('userRole').dispatchEvent(new Event('change'));
    
    // Check doctor batches
    let docBatches = [];
    try {
      const parsed = JSON.parse(batchesStr || '[]');
      docBatches = Array.isArray(parsed) ? parsed.map(b => String(b._id || b)) : [];
    } catch(e){}
    document.querySelectorAll('input[name="doctorBatches"]').forEach(cb => {
      cb.checked = docBatches.includes(String(cb.value));
    });

    /* الحقل صار يغيّر كلمة المرور فعلاً عند التعديل: نفرّغه حتى لا تبقى قيمة
       من مستخدم سابق أو كلمة مرور العميد نفسه التي يملؤها المتصفح تلقائياً. */
    const passField = document.getElementById('userPass');
    passField.value = '';
    passField.placeholder = 'اتركه فارغاً للإبقاء على كلمة المرور الحالية';
    CBS.openModal('userModal');
    setTimeout(() => { if (document.activeElement !== passField) passField.value = ''; }, 300);
  }

  async function saveUser() {
    const id = document.getElementById('editUserId').value;
    const role = document.getElementById('userRole').value;
    const name = document.getElementById('userName').value.trim();
    const email = document.getElementById('userEmail').value.trim();
    const pass = document.getElementById('userPass').value;

    // Validation
    if (!name) { CBS.toast('يرجى إدخال الاسم', '', 'error'); return; }
    if (!email) { CBS.toast('يرجى إدخال البريد الإلكتروني', '', 'error'); return; }
    if (!id && !pass) { CBS.toast('يرجى إدخال كلمة المرور للمستخدم الجديد', '', 'error'); return; }
    if (pass && pass.trim().length < 6) { CBS.toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', '', 'error'); return; }

    const body = { name, email, roles: [role] };
    
    if (role === 'doctor') {
      const selectedBatches = Array.from(document.querySelectorAll('input[name="doctorBatches"]:checked')).map(cb => cb.value);
      body.batches = selectedBatches;
      body.batch = null;
    } else {
      const batchVal = document.getElementById('userBatch').value;
      if (batchVal) body.batch = batchVal;
      body.batches = [];
    }

    if (pass) body.password = pass;

    const saveBtn = document.getElementById('saveUserBtn');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...'; }

    try {
      const res = id
        ? await CBS.apiPost('/api/users/' + id, body, 'PUT')
        : await CBS.apiPost('/api/auth/register', { ...body, password: pass });
      
      if (res.ok) {
        CBS.toast(
          id ? (pass ? 'تم تحديث المستخدم وتغيير كلمة المرور' : 'تم تحديث المستخدم') : 'تم إضافة المستخدم',
          pass ? 'سيُطلب من المستخدم تعيين كلمة مرور جديدة عند أول دخول' : '',
          'success'
        );
        CBS.closeModal('userModal');
        document.getElementById('userForm').reset();
        document.getElementById('editUserId').value = '';
        loadUsers();
      } else {
        const err = await res.json().catch(() => ({}));
        CBS.toast(err.message || 'حدث خطأ، يرجى المحاولة مجدداً', '', 'error');
      }
    } catch {
      CBS.toast('خطأ في الاتصال بالخادم', '', 'error');
    } finally {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'حفظ'; }
    }
  }

  async function deleteUser(id) {
    if (!confirm('هل تريد حذف هذا المستخدم؟')) return;
    try {
      const res = await CBS.apiDelete('/api/users/' + id);
      if (res.ok) {
        CBS.toast('تم حذف المستخدم', '', 'success');
        loadUsers();
      } else {
        CBS.toast('فشل حذف المستخدم', '', 'error');
      }
    } catch {
      CBS.toast('خطأ في الاتصال', '', 'error');
    }
  }

  function copyAllEmails() {
    const cbs = Array.from(document.querySelectorAll('.cb-user:checked'));
    if (!cbs.length) {
      CBS.toast('الرجاء تحديد مستخدم واحد على الأقل لنسخ إيميله', '', 'warning');
      return;
    }
    const emails = cbs.map(cb => cb.value).filter(e => e && e !== '-').join(', ');
    navigator.clipboard.writeText(emails).then(() => {
      CBS.toast('تم نسخ الإيميلات بنجاح!', '', 'success');
    }).catch(() => {
      prompt('فشل النسخ التلقائي، انسخ الإيميلات من هنا:', emails);
    });
  }

  function toggleSelectAllUsers(checked) {
    document.querySelectorAll('.cb-user').forEach(cb => {
      // Only select visible checkboxes
      const card = cb.closest('.mu-row');
      if (card && card.style.display !== 'none') {
        cb.checked = checked;
      } else {
        cb.checked = false;
      }
    });
  }

  let searchTimeout;
  let roleFilter = '';
  function applyUserFilters() {
    const q = (document.getElementById('searchUserInput').value || '').toLowerCase().trim();
    filteredUsers = allUsers.filter(u => {
      const role = (u.roles?.[0] || 'student').toLowerCase();
      if (roleFilter && !(roleFilter === 'dean' ? ['dean', 'admin'].includes(role) : role === roleFilter)) return false;
      if (!q) return true;
      const roleLabel = (roleLabels[role] || '').toLowerCase();
      return (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || role.includes(q) || roleLabel.includes(q);
    });
    document.getElementById('selectAllUsers').checked = false;
    currentPage = 1;
    renderPage();
  }
  function searchUsers() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(applyUserFilters, 300);
  }
  document.getElementById('roleChips').addEventListener('click', e => {
    const b = e.target.closest('.ui-chip'); if (!b) return;
    roleFilter = b.dataset.r;
    document.querySelectorAll('#roleChips .ui-chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    applyUserFilters();
  });
  // عدد طلبات التسجيل الفعلي من ملخص العميد
  CBS.apiGet('/api/reports/home').then(r => r.ok ? r.json() : null).then(j => {
    const n = j?.data?.pendingRegistrations;
    if (!n) return;
    document.getElementById('pendingText').textContent = `${CBS.arCount(n, ['طلب تسجيل واحد', 'طلبا تسجيل', 'طلبات تسجيل', 'طلب تسجيل'])} بانتظار المراجعة`;
    document.getElementById('pendingAlert').hidden = false;
  }).catch(() => {});

  async function initAll() {
    await loadUsers();
  }

  initAll();
</script>
</body>
</html>
