  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5">

  <link rel="stylesheet" href="/css/style.css?v=2026073125"><link rel="stylesheet" href="/css/mobile.css?v=2026073125"><style>
.quiz-wrap{max-width:1100px;margin:auto;padding:28px 20px 105px}.quiz-hero{padding:18px 20px;border-radius:25px;color:#fff;background:linear-gradient(125deg,#4338ca,#4f46e5,#0891b2);box-shadow:0 18px 42px #4338ca35}.quiz-hero h1{margin:7px 0;font-size:clamp(1.5rem,3vw,2.1rem)}.quiz-hero p{margin:0;color:#e0e7ff}.new{margin-top:17px;border:1px solid #fff8;border-radius:10px;background:#fff2;color:white;font:inherit;font-weight:700;padding:10px 15px;cursor:pointer}.quiz-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px}.quiz-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}.quiz-card h2{font-size:0.9rem;margin:7px 0 5px}.quiz-card p{color:var(--text-muted);font-size:.8rem;min-height:30px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--text-muted);font-size:.74rem;margin:14px 0}.tag{background:var(--primary-light);color:var(--primary);border-radius:99px;padding:4px 8px}.action{width:100%;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}.action[disabled]{background:var(--bg-input);color:var(--text-muted);cursor:not-allowed}.empty{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:42px}.overlay{display:none;position:fixed;inset:0;z-index:9999;background:#071422a8;padding:18px;align-items:center;justify-content:center}.overlay.show{display:flex}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--bg-card);border-radius:20px;padding:22px}.box h2{margin:0 0 16px;font-size:1.15rem}.field{margin-bottom:11px}.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);color:var(--text-primary);font:inherit}.field textarea{min-height:65px}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.question{padding:14px;border:1px solid var(--border);border-radius:14px;margin-top:11px}.question-head{display:flex;justify-content:space-between}.question-head button{border:0;background:none;color:var(--danger);font:inherit;cursor:pointer}.opt{display:grid;grid-template-columns:28px 1fr;gap:7px;margin-top:7px;align-items:center}.opt input[type=text]{padding:8px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:white}.ghost{background:var(--bg-input);color:var(--text-secondary)}.take-question{padding:14px 0;border-bottom:1px solid var(--border)}.take-question:last-child{border:0}.take-question strong{display:block;margin-bottom:8px}.choice{display:block;padding:9px;margin:5px 0;border:1px solid var(--border);border-radius:9px;cursor:pointer}.choice:has(input:checked){border-color:var(--primary);background:var(--primary-light)}@media(max-width:600px){.quiz-wrap{padding:12px 12px 95px}.quiz-list{grid-template-columns:1fr}.two{grid-template-columns:1fr}.quiz-hero{padding:14px 16px}}
</style>

</head><body><header class="main-header"><div class="header-brand"><img src="/assets/logo.png" class="header-logo" alt="شعار"><div class="header-title-group"><strong>الاختبارات الإلكترونية</strong><small>تقييم عادل وسريع</small></div></div><div class="header-actions"><button class="btn-icon" onclick="CBS.toggleDark()"><i class="ri-moon-line" id="themeIcon"></i></button><button class="btn-icon" onclick="location.href='/campus.html'"><i class="ri-compass-3-line"></i></button></div></header><main class="quiz-wrap"><section class="quiz-hero"><small><i class="ri-award-line"></i> مركز التقييم</small><h1>اختباراتك في مكان واحد</h1><p id="subtitle">اطلع على الاختبارات المتاحة وسلّم محاولتك بثقة.</p><button class="new" id="newQuiz" hidden><i class="ri-add-line"></i> إنشاء اختبار</button></section><section class="quiz-list" id="list"><div class="empty">جاري تحميل الاختبارات…</div></section></main><div class="overlay" id="quizModal"><div class="box"><h2>إنشاء اختبار إلكتروني</h2><form id="quizForm"><div class="field"><label>العنوان</label><input name="title" required maxlength="160" placeholder="مثال: اختبار الوحدة الأولى"></div><div class="field"><label>المادة</label><select name="subject" id="subjects" required></select></div><div class="two"><div class="field"><label>يبدأ في</label><input type="datetime-local" name="startsAt" required></div><div class="field"><label>ينتهي في</label><input type="datetime-local" name="endsAt" required></div></div><div class="field"><label>المدة بالدقائق</label><input type="number" name="durationMinutes" min="1" max="300" value="30" required></div><div class="field"><label><input type="checkbox" name="published" checked> نشر الاختبار مباشرة</label></div><div id="questions"></div><div class="buttons"><button class="btn ghost" type="button" id="addQuestion"><i class="ri-add-line"></i> إضافة سؤال</button><button class="btn primary" type="submit">إنشاء الاختبار</button><button class="btn ghost" type="button" data-close>إلغاء</button></div></form></div></div><div class="overlay" id="takeModal"><div class="box"><h2 id="takeTitle">الاختبار</h2><div id="quizTimerBar" style="display:flex;align-items:center;justify-content:space-between;background:var(--primary-light);border-radius:10px;padding:10px 14px;margin-bottom:12px;"><span style="font-weight:700;color:var(--primary);font-size:0.9rem;"><i class="ri-time-line"></i> الوقت المتبقي</span><span id="quizTimerDisplay" style="font-size:1.3rem;font-weight:900;color:var(--primary);letter-spacing:1px;font-variant-numeric:tabular-nums;">--:--</span></div><p id="takeMeta" class="text-muted"></p><form id="takeForm"><div id="takeQuestions"></div><div class="buttons"><button class="btn primary" type="submit">تسليم الإجابات</button><button class="btn ghost" type="button" data-close>إلغاء</button></div></form></div></div>

<!-- Result Modal -->
<div class="overlay" id="resultModal">
  <div class="box" style="text-align:center; padding: 40px 20px;">
    <div style="font-size:4rem; color:var(--success); margin-bottom:10px;"><i class="ri-checkbox-circle-fill"></i></div>
    <h2 style="margin-bottom:10px;">تم تسليم الاختبار بنجاح</h2>
    <p style="color:var(--text-muted); margin-bottom:20px;">نتيجتك هي:</p>
    <div style="font-size:3rem; font-weight:900; color:var(--primary); font-variant-numeric:tabular-nums;" id="resultScore">0/0</div>
    <div class="buttons" style="justify-content:center; margin-top:30px;">
      <button class="btn primary" type="button" data-close>إغلاق</button>
    </div>
  </div>
</div>

<div id="toast-container"></div><script src="/js/app.js?v=2026073125"></script>
<script src="/js/socket-client.js?v=2026073125" defer></script><script>
let all=[],active=null,questions=[{text:'',options:['','','',''],correctOption:0,points:1}];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=new Intl.DateTimeFormat('ar-SD',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});const staff=()=>CBS.getUser().roles?.some(r=>['dean','doctor','admin'].includes(r));function state(q){const n=Date.now();if(q.attempt)return 'تم التسليم';if(!q.published)return 'مسودة';if(n<new Date(q.startsAt))return 'قريباً';if(n>new Date(q.endsAt))return 'انتهى';return 'متاح الآن'}function draw(){list.innerHTML=all.length?all.map(q=>{const s=state(q),enabled=s==='متاح الآن';let delBtn='';if(staff() && (CBS.hasRole('admin')||CBS.hasRole('dean')||CBS.isMe(q.createdBy))){delBtn=`<button class="action" style="background:var(--danger);margin-top:5px;" onclick="deleteQuiz('${q._id}')">حذف الاختبار</button>`;}return `<article class="quiz-card"><span class="tag">${esc(s)}</span><h2>${esc(q.title)}</h2><p>${esc(q.description||q.subject?.name||'اختبار إلكتروني')}</p><div class="meta"><span><i class="ri-book-open-line"></i> ${esc(q.subject?.name||'')}</span><span><i class="ri-time-line"></i> ${q.durationMinutes} دقيقة</span></div><small class="text-muted">${fmt.format(new Date(q.startsAt))} — ${fmt.format(new Date(q.endsAt))}</small>${q.attempt?`<p>درجتك: <strong>${q.attempt.score}/${q.attempt.maxScore}</strong></p>`:''}<button class="action" ${enabled?'':'disabled'} onclick="openTake('${q._id}')">${enabled?'ابدأ الاختبار':'غير متاح'}</button>${delBtn}</article>`}).join(''):'<div class="empty">لا توجد اختبارات في هذه الدفعة بعد.</div>'}window.deleteQuiz=async(id)=>{if(!confirm('هل أنت متأكد من حذف الاختبار وكافة نتائجه؟'))return;try{let r=await CBS.apiDelete(`/api/quizzes/${id}`);if(!r.ok)throw Error();CBS.toast('نجاح','تم حذف الاختبار','success');load()}catch{CBS.toast('خطأ','فشل الحذف','error')}};function drawQuestions(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<div class="question"><div class="question-head"><strong>السؤال ${i+1}</strong>${questions.length>1?`<button type="button" onclick="removeQ(${i})">حذف</button>`:''}</div><div class="field"><input required placeholder="نص السؤال" value="${esc(q.text)}" oninput="questions[${i}].text=this.value"></div>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="correct-${i}" ${q.correctOption===j?'checked':''} onchange="questions[${i}].correctOption=${j}"><input type="text" required placeholder="الخيار ${j+1}" value="${esc(o)}" oninput="questions[${i}].options[${j}]=this.value"></label>`).join('')}<div class="field"><label>الدرجة</label><input type="number" min="1" max="100" value="${q.points}" oninput="questions[${i}].points=Number(this.value)||1"></div></div>`).join('')}function removeQ(i){questions.splice(i,1);drawQuestions()}let _timerInterval=null,_isAutoSubmitting=false;function openTake(id){active=all.find(q=>q._id===id);_isAutoSubmitting=false;takeTitle.textContent=active.title;takeMeta.textContent=`المدة ${active.durationMinutes} دقيقة · لا يمكن تعديل الإجابات بعد التسليم`;takeQuestions.innerHTML=active.questions.map((q,i)=>`<div class="take-question"><strong>${i+1}. ${esc(q.text)}</strong>${q.options.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('');takeModal.classList.add('show');clearInterval(_timerInterval);let secondsLeft=active.durationMinutes*60;const timerEl=document.getElementById('quizTimerDisplay');const timerBar=document.getElementById('quizTimerBar');function updateTimer(){const m=Math.floor(secondsLeft/60);const s=secondsLeft%60;timerEl.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(secondsLeft<=300){timerBar.style.background='var(--warning-bg,#fef3c7)';timerEl.style.color='#d97706'}if(secondsLeft<=60){timerBar.style.background='var(--danger-bg,#fee2e2)';timerEl.style.color='var(--danger)'}if(secondsLeft<=0){clearInterval(_timerInterval);_isAutoSubmitting=true;takeForm.dispatchEvent(new Event('submit',{cancelable:true}));return}secondsLeft--}updateTimer();_timerInterval=setInterval(updateTimer,1000)}async function load(){try{let r=await CBS.apiGet('/api/quizzes'),d=await r.json();if(!r.ok)throw Error(d.message);all=d.data.quizzes;draw()}catch(e){list.innerHTML='<div class="empty">تعذر تحميل الاختبارات.</div>'}}async function prep(){if(!staff())return;newQuiz.hidden=false;subtitle.textContent='أنشئ اختبارات مؤقتة، صحّح تلقائياً، وتابع نتائج طلاب الدفعة.';try{let r=await CBS.apiGet('/api/subjects'),d=await r.json();subjects.innerHTML=(d.data?.subjects||d.subjects||d.data||(Array.isArray(d)?d:[])).map(s=>`<option value="${s._id}">${esc(s.name)}</option>`).join('')}catch{}}newQuiz.onclick=()=>{questions=[{text:'',options:['','','',''],correctOption:0,points:1}];drawQuestions();quizModal.classList.add('show')};addQuestion.onclick=()=>{questions.push({text:'',options:['','','',''],correctOption:0,points:1});drawQuestions()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ clearInterval(_timerInterval); b.closest('.overlay').classList.remove('show'); });quizForm.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.published=Boolean(e.target.published.checked);b.questions=questions;b.startsAt=new Date(b.startsAt).toISOString();b.endsAt=new Date(b.endsAt).toISOString();try{let r=await CBS.apiPost('/api/quizzes',b),d=await r.json();if(!r.ok)throw Error(d.message);CBS.toast('تم إنشاء الاختبار','أصبح جاهزاً للدفعة','success');quizModal.classList.remove('show');load()}catch(err){CBS.toast('تعذر الإنشاء',err.message||'تحقق من البيانات','error')}};takeForm.onsubmit=async e=>{e.preventDefault();let answers=active.questions.map((_,i)=>{const val=new FormData(e.target).get('q'+i);return{questionIndex:i,selectedOption:val!==null?Number(val):-1}});if(!_isAutoSubmitting && !confirm('هل تريد تسليم الاختبار؟ لا يمكن التراجع.'))return;try{let r=await CBS.apiPost(`/api/quizzes/${active._id}/attempt`,{answers}),d=await r.json();if(!r.ok)throw Error(d.message);CBS.toast('تم التسليم',`درجتك: ${d.data.attempt.score}/${d.data.attempt.maxScore}`,'success');clearInterval(_timerInterval);takeModal.classList.remove('show');document.getElementById('resultScore').textContent=`${d.data.attempt.score}/${d.data.attempt.maxScore}`;document.getElementById('resultModal').classList.add('show');load()}catch(err){CBS.toast('تعذر التسليم',err.message||'حاول مرة أخرى','error')}};if(CBS.init()){prep();load()}
</script><script>document.addEventListener('cbs:refresh',e=>{e.preventDefault();load().finally(()=>e.detail.done());});</script>
</body></html>
