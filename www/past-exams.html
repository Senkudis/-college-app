<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>بنك امتحانات الفاينل والمحاكاة الذكية | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <style>
    .exam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
      gap: 16px;
      margin-top: 14px;
    }
    .exam-card-pro {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }
    .exam-card-pro:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
      border-color: var(--primary);
    }
    .stepper-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .stepper-nav::-webkit-scrollbar { display: none; }
    .stepper-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-main);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .stepper-circle.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
      transform: scale(1.1);
    }
    .stepper-circle.answered {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
    }
    .sim-opt-pro {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-main);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .sim-opt-pro:hover {
      border-color: var(--primary);
      background: var(--bg-card);
    }
    .sim-opt-pro.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .filter-grid-responsive {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 768px) {
      .filter-grid-responsive { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>


<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="">
    <div class="header-title-group"><strong>بنك الامتحانات</strong><small>بنك الامتحانات</small></div>
  </div>
  <div class="header-actions"></div>
</header>

<main class="page-container" style="max-width:1040px; margin:0 auto; padding:16px 16px 80px;">
  <div class="ui-toolbar" id="staffControls" style="display:none;">
    <button type="button" class="ui-primary" onclick="openAddExamModal()"><i class="ri-add-line"></i> نموذج امتحان</button>
  </div>

  <!-- Search and Filter Bar -->
  <div class="card" style="padding:14px 18px; margin-bottom:16px;">
    <div class="filter-grid-responsive">
      <div>
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="searchExamInput">بحث في النماذج:</label>
        <div style="position:relative;">
          <input type="text" id="searchExamInput" class="form-control" placeholder="اسم المادة أو السنة الأكاديمية..." oninput="filterExamsLocally()">
          <i class="ri-search-line" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>
      <div>
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="filterSubject">المقرر الدراسي:</label>
        <select id="filterSubject" class="form-control" onchange="loadPastExams()">
          <option value="">جميع المقررات</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.78rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="filterType">نوع الامتحان:</label>
        <select id="filterType" class="form-control" onchange="loadPastExams()">
          <option value="">الكل (فاينل وميدتيرم)</option>
          <option value="final">امتحان نهائي (فاينل)</option>
          <option value="midterm">امتحان نصفي (ميدتيرم)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Exam Cards Grid -->
  <div id="examsListContainer">
    <div style="text-align:center; padding:40px;"><i class="ri-loader-4-line ri-spin" style="font-size:2rem; color:var(--primary);"></i></div>
  </div>
</main>

<!-- Simulation Wizard Screen Modal -->
<div id="simModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9999; align-items:center; justify-content:center; padding:16px;">
  <div class="card" style="max-width:760px; width:100%; padding:24px; max-height:92vh; overflow-y:auto; border-radius:var(--radius-xl);">
    <!-- Simulation Top Bar -->
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:16px;">
      <div>
        <h2 id="simExamTitle" style="font-size:1.15rem; font-weight:800; margin:0 0 2px;">...</h2>
        <span id="simExamSub" style="font-size:0.8rem; color:var(--text-muted);">محاكاة الفاينل</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="simTimerBadge" class="badge" style="background:rgba(239,68,68,0.12); color:#ef4444; font-size:0.95rem; font-family:monospace; padding:6px 14px; font-weight:900;">
          <i class="ri-timer-line"></i> <span id="simTimerText">20:00</span>
        </div>
        <button class="btn btn-outline" style="padding:4px 8px;" onclick="confirmExitSimulation()" aria-label="إغلاق"><i class="ri-close-line"></i></button>
      </div>
    </div>

    <!-- Stepper Navigation -->
    <div id="simStepperArea" class="stepper-nav"></div>

    <!-- Single Question Container -->
    <div id="simQuestionContainer" style="min-height:220px;"></div>

    <!-- Simulation Result View -->
    <div id="simResultArea" style="display:none;"></div>

    <!-- Simulation Bottom Actions -->
    <div id="simFooterActions" style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
      <div style="display:flex; gap:8px;">
        <button id="btnPrevQ" class="btn btn-outline" onclick="navigateQuestion(-1)" aria-label="رجوع"><i class="ri-arrow-right-line"></i> السابق</button>
        <button id="btnNextQ" class="btn btn-outline" onclick="navigateQuestion(1)" aria-label="رجوع">التالي <i class="ri-arrow-left-line"></i></button>
      </div>
      <button id="simSubmitBtn" class="btn btn-success" onclick="submitSimulation()" style="font-weight:800; padding:8px 20px;">
        <i class="ri-check-double-line"></i> تسليم الامتحان وتصحيحه
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script>
  CBS.init({ requireAuth: true });
  const user = CBS.getUser();
  let allLoadedExams = [];
  let currentActiveExam = null;
  let currentQIndex = 0;
  let userAnswers = {};
  let simTimerInterval = null;
  let simSecondsRemaining = 1200;

  async function init() {
    if (CBS.hasRole(['dean', 'doctor', 'leader', 'admin'])) {
      document.getElementById('staffControls').style.display = 'block';
    }
    await loadSubjects();
    await loadPastExams();
  }

  async function loadSubjects() {
    try {
      const res = await CBS.apiGet('/api/subjects');
      const data = await CBS.readJson(res);
      // الخادم يغلّف الحمولة داخل data (utils/response.js)
      const subjects = data.data?.subjects || data.subjects || [];
      if (data.success && subjects.length) {
        const sel1 = document.getElementById('filterSubject');
        const sel2 = document.getElementById('addExamSubject');
        subjects.forEach(s => {
          const opt1 = document.createElement('option');
          opt1.value = s._id;
          opt1.textContent = s.name;
          sel1.appendChild(opt1);

          if (sel2) {
            const opt2 = document.createElement('option');
            opt2.value = s._id;
            opt2.textContent = s.name;
            sel2.appendChild(opt2);
          }
        });
      }
    } catch (e) {
      console.error('loadSubjects:', e);
    }
  }

  async function loadPastExams() {
    const sub = document.getElementById('filterSubject').value;
    const type = document.getElementById('filterType').value;
    const container = document.getElementById('examsListContainer');
    container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="ri-loader-4-line ri-spin" style="font-size:2rem; color:var(--primary);"></i></div>';

    try {
      let q = '/api/past-exams?';
      if (sub) q += `subject=${sub}&`;
      if (type) q += `examType=${type}&`;

      const res = await CBS.apiGet(q);
      const data = await CBS.readJson(res);

      if (!data.success || !data.data?.exams?.length) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding:60px 20px;">
            <i class="ri-folder-open-line" style="font-size:3.2rem; color:var(--text-muted); display:block; margin-bottom:10px;"></i>
            <h3 style="font-size:1.15rem; font-weight:800; margin-bottom:4px;">لا توجد نماذج امتحانات متاحة</h3>
            <p style="font-size:0.85rem; color:var(--text-muted);">سيتم رفع نماذج السنوات السابقة والمحاكاة التفاعلية تباعاً.</p>
          </div>`;
        allLoadedExams = [];
        return;
      }

      allLoadedExams = data.data.exams;
      renderExamsGrid(allLoadedExams);
    } catch(e) {
      container.innerHTML = '<div class="alert alert-danger show">تعذر جلب نماذج الامتحانات</div>';
    }
  }

  function filterExamsLocally() {
    const text = document.getElementById('searchExamInput').value.trim().toLowerCase();
    if (!text) {
      renderExamsGrid(allLoadedExams);
      return;
    }
    const filtered = allLoadedExams.filter(ex => {
      const t = (ex.title || '').toLowerCase();
      const s = (ex.subject?.name || '').toLowerCase();
      const y = (ex.year || '').toLowerCase();
      return t.includes(text) || s.includes(text) || y.includes(text);
    });
    renderExamsGrid(filtered);
  }

  function renderExamsGrid(exams) {
    const container = document.getElementById('examsListContainer');
    if (!exams.length) {
      container.innerHTML = '<div class="card" style="text-align:center; padding:40px;">لا توجد نتائج مطابقة للبحث</div>';
      return;
    }

    container.innerHTML = `<div class="exam-grid">${exams.map(ex => {
      const qCount = ex.questions?.length || 0;
      const subName = ex.subject?.name || 'مقرر دراسي';
      const isFinal = ex.examType === 'final';
      // نطابق منطق canManageExam على الخادم: العميد والأدمن يديران الكل،
      // والدكتور والليدر ما رفعاه بأنفسهم فقط. الخادم يفرضه أيضاً.
      const me = CBS.getUser() || {};
      const myId = String(me.id || me._id || '');
      const ownerId = String(ex.uploadedBy?._id || ex.uploadedBy || '');
      const canManage = CBS.hasRole(['dean', 'admin'])
        || (CBS.hasRole(['doctor', 'leader']) && ownerId && ownerId === myId);
      return `
      <div class="exam-card-pro">
        <div>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
              <span class="badge" style="background:${isFinal ? 'rgba(59,130,246,0.15)' : 'rgba(245,158,11,0.15)'}; color:${isFinal ? '#3b82f6' : '#f59e0b'}; font-weight:800; font-size:0.75rem;">
                <i class="ri-${isFinal ? 'award-line' : 'time-line'}"></i> ${isFinal ? 'امتحان فاينل' : 'امتحان ميدتيرم'}
              </span>
              ${(() => {
                try {
                  const best = JSON.parse(localStorage.getItem('cbs_sim_best_' + ex._id) || 'null');
                  return best ? `<span class="badge" style="background:rgba(16,185,129,0.15); color:var(--success); font-weight:800; font-size:0.72rem;"><i class="ri-checkbox-circle-line"></i> أفضل نتيجة: ${best.percentage}%</span>` : '';
                } catch(e) { return ''; }
              })()}
            </div>
            <span style="font-size:0.78rem; font-family:monospace; color:var(--text-muted);">${CBS.escapeHTML(ex.year)}</span>
          </div>
          <h3 style="font-weight:800; font-size:1.05rem; margin:0 0 6px; color:var(--text-main); line-height:1.4;">${CBS.escapeHTML(ex.title)}</h3>
          <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:14px;">
            <i class="ri-book-open-line"></i> ${CBS.escapeHTML(subName)}
          </div>
        </div>

        <div style="border-top:1px solid var(--border); padding-top:12px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.78rem; color:var(--text-muted); font-weight:700;">
            ${qCount > 0 ? `<i class="ri-question-line"></i> ${qCount} أسئلة تفاعلية` : '<i class="ri-file-pdf-line"></i> وثيقة PDF'}
          </span>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${ex.pdfFile ? `<a href="/uploads/past-exams/${encodeURIComponent(ex.pdfFile)}" data-title="${CBS.escapeHTML(ex.title)}" target="_blank" rel="noopener" class="btn btn-outline" style="padding:6px 10px; font-size:0.8rem;" title="فتح الملف"><i class="ri-download-line"></i></a>` : ''}
            ${canManage ? `<button class="btn btn-outline" style="padding:6px 10px; font-size:0.8rem;" title="تعديل" onclick="editPastExam('${ex._id}')" aria-label="تعديل"><i class="ri-edit-line"></i></button>` : ''}
            ${canManage ? `<button class="btn btn-outline" style="padding:6px 10px; font-size:0.8rem; color:#ef4444; border-color:rgba(239,68,68,0.5);" title="حذف" onclick="deletePastExam('${ex._id}')" aria-label="حذف"><i class="ri-delete-bin-line"></i></button>` : ''}
            ${qCount > 0 ? `<button class="btn btn-primary" style="padding:6px 14px; font-size:0.82rem; font-weight:800;" onclick="startSimulation('${ex._id}')"><i class="ri-play-circle-line"></i> محاكاة</button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  async function startSimulation(examId) {
    try {
      const res = await CBS.apiGet(`/api/past-exams/${examId}`);
      const data = await CBS.readJson(res);
      if (!data.success || !data.data?.exam) {
        CBS.toast('تعذر فتح الامتحان', '', 'error');
        return;
      }

      currentActiveExam = data.data.exam;
      if (!currentActiveExam.questions || !currentActiveExam.questions.length) {
          CBS.toast('لا توجد أسئلة تفاعلية متاحة لهذا الامتحان', '', 'warning');
          return;
      }
      userAnswers = {};
      currentQIndex = 0;

      document.getElementById('simExamTitle').textContent = currentActiveExam.title;
      document.getElementById('simExamSub').textContent = `${currentActiveExam.subject?.name || ''} · ${currentActiveExam.year}`;
      document.getElementById('simResultArea').style.display = 'none';
      document.getElementById('simStepperArea').style.display = 'flex';
      document.getElementById('simQuestionContainer').style.display = 'block';
      document.getElementById('simFooterActions').style.display = 'flex';

      renderStepper();
      renderCurrentQuestion();

      // Start timer
      simSecondsRemaining = (currentActiveExam.questions?.length || 10) * 120; // 2 min per question
      const initM = Math.floor(simSecondsRemaining / 60);
      const initS = simSecondsRemaining % 60;
      document.getElementById('simTimerText').textContent = `${String(initM).padStart(2,'0')}:${String(initS).padStart(2,'0')}`;
      clearInterval(simTimerInterval);
      simTimerInterval = setInterval(() => {
        simSecondsRemaining--;
        const m = Math.floor(simSecondsRemaining / 60);
        const s = simSecondsRemaining % 60;
        document.getElementById('simTimerText').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (simSecondsRemaining <= 0) {
          clearInterval(simTimerInterval);
          submitSimulation();
        }
      }, 1000);

      document.getElementById('simModal').style.display = 'flex';
      CBS.haptic('selection');
    } catch(e) {
      CBS.toast('حدث خطأ أثناء تحميل أسئلة الامتحان', '', 'error');
    }
  }

  function renderStepper() {
    const area = document.getElementById('simStepperArea');
    const questions = currentActiveExam.questions || [];
    area.innerHTML = questions.map((q, idx) => {
      const isAns = userAnswers[idx] !== undefined;
      const isCur = idx === currentQIndex;
      return `<button class="stepper-circle ${isCur ? 'active' : ''} ${isAns ? 'answered' : ''}" onclick="goToQuestion(${idx})">${idx + 1}</button>`;
    }).join('');
  }

  function renderCurrentQuestion() {
    const q = currentActiveExam.questions[currentQIndex];
    const total = currentActiveExam.questions.length;
    const selected = userAnswers[currentQIndex];

    document.getElementById('simQuestionContainer').innerHTML = `
      <div style="margin-bottom:14px;">
        <span style="font-size:0.8rem; font-weight:800; color:var(--primary); display:block; margin-bottom:4px;">السؤال ${currentQIndex + 1} من ${total}:</span>
        <h3 style="font-size:1.05rem; font-weight:800; margin:0; line-height:1.5; color:var(--text-main);">${CBS.escapeHTML(q.text)}</h3>
      </div>
      <div>
        ${q.options.map((opt, oIdx) => `
          <div class="sim-opt-pro ${selected === oIdx ? 'selected' : ''}" onclick="selectSimulationOption(${oIdx})">
            <span style="width:24px; height:24px; border-radius:50%; border:2px solid ${selected === oIdx ? 'var(--primary)' : 'var(--border)'}; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:800;">
              ${selected === oIdx ? '<i class="ri-check-line"></i>' : String.fromCharCode(65 + oIdx)}
            </span>
            <span>${CBS.escapeHTML(opt)}</span>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('btnPrevQ').disabled = currentQIndex === 0;
    document.getElementById('btnNextQ').disabled = currentQIndex === total - 1;
    renderStepper();
  }

  function selectSimulationOption(optIdx) {
    userAnswers[currentQIndex] = optIdx;
    CBS.haptic('light');
    renderCurrentQuestion();
  }

  function goToQuestion(idx) {
    currentQIndex = idx;
    CBS.haptic('selection');
    renderCurrentQuestion();
  }

  function navigateQuestion(delta) {
    const next = currentQIndex + delta;
    if (next >= 0 && next < currentActiveExam.questions.length) {
      goToQuestion(next);
    }
  }

  function confirmExitSimulation() {
    if (confirm('هل تريد إنهاء جلسة المحاكاة الحالية؟ لن يتم حفظ إجاباتك.')) {
      clearInterval(simTimerInterval);
      document.getElementById('simModal').style.display = 'none';
    }
  }

  async function submitSimulation() {
    if (!currentActiveExam) return;
    clearInterval(simTimerInterval);

    try {
      const res = await CBS.apiPost(`/api/past-exams/${currentActiveExam._id}/simulate`, { answers: userAnswers });
      const data = await CBS.readJson(res);

      if (data.success && data.data) {
        const d = data.data;
        document.getElementById('simStepperArea').style.display = 'none';
        document.getElementById('simQuestionContainer').style.display = 'none';
        document.getElementById('simFooterActions').style.display = 'none';

        const resArea = document.getElementById('simResultArea');
        // حفظ النتيجة في سجل المحاكاة
        try {
          const key = `cbs_sim_best_${currentActiveExam._id}`;
          const prev = JSON.parse(localStorage.getItem(key) || 'null');
          if (!prev || d.percentage > prev.percentage) {
            localStorage.setItem(key, JSON.stringify({
              percentage: d.percentage,
              score: d.score,
              total: d.total,
              date: new Date().toISOString()
            }));
          }
          const histKey = 'cbs_sim_history_all';
          const history = JSON.parse(localStorage.getItem(histKey) || '[]');
          history.unshift({
            examId: currentActiveExam._id,
            examTitle: currentActiveExam.title,
            subjectName: currentActiveExam.subject?.name,
            percentage: d.percentage,
            passed: d.passed,
            date: new Date().toISOString()
          });
          if (history.length > 50) history.pop();
          localStorage.setItem(histKey, JSON.stringify(history));
          renderExamsGrid(allLoadedExams);
        } catch(e) { console.warn('[past-exams] Error saving sim history:', e); }

        resArea.innerHTML = `
          <div style="text-align:center; padding:24px 16px; background:var(--bg-main); border-radius:var(--radius-xl); margin-bottom:20px; border:1px solid var(--border);">
            <div style="font-size:2.8rem; font-weight:900; color:${d.passed ? 'var(--success)' : '#ef4444'}; margin-bottom:2px; font-family:monospace;">
              ${d.percentage}%
            </div>
            <div style="font-size:0.9rem; color:var(--text-muted); margin-bottom:8px;">
              الدرجة المحققة: ${d.score} من إجمالي ${d.total} نقاط (${d.correctCount} من ${d.totalQuestions} إجابات صحيحة)
            </div>
            <div style="font-weight:800; font-size:1.1rem; color:var(--text-main); margin-bottom:12px;">
              ${d.passed ? 'اجتياز المحاكاة بنجاح ممتاز' : 'تحتاج إلى مراجعة إضافية للمقرر'}
            </div>
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; font-size:0.9rem; line-height:1.7; text-align:right;">
              <strong style="color:var(--primary); display:block; margin-bottom:4px;"><i class="ri-brain-line"></i> ${d.diagnosisSource === 'ai' ? 'تشخيص كيدي لأخطائك:' : 'ملاحظة على أدائك:'}</strong>
              <div style="white-space:pre-line">${CBS.escapeHTML(d.aiDiagnosis)}</div>
            </div>
          </div>

          <h3 style="font-size:1rem; font-weight:800; margin-bottom:12px;">مراجعة تفصيلية للإجابات النموذجية:</h3>
          ${d.review.map((r, i) => `
            <div class="card" style="padding:14px; margin-bottom:10px; border-right:5px solid ${r.isCorrect ? 'var(--success)' : '#ef4444'};">
              <div style="font-weight:800; font-size:0.92rem; margin-bottom:6px;">${i + 1}. ${CBS.escapeHTML(r.questionText)}</div>
              <div style="font-size:0.85rem; color:${r.isCorrect ? 'var(--success)' : '#ef4444'}; font-weight:700;">
                <i class="ri-${r.isCorrect ? 'check-line' : 'close-line'}"></i> ${r.isCorrect ? 'إجابتك صحيحة' : 'إجابة غير دقيقة'}
              </div>
              ${r.explanation ? `<div style="font-size:0.82rem; color:var(--text-muted); margin-top:6px; background:var(--bg-main); padding:8px 12px; border-radius:6px;">${CBS.escapeHTML(r.explanation)}</div>` : ''}
            </div>
          `).join('')}

          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:20px;">
            <button class="btn btn-outline" onclick="startSimulation('${currentActiveExam._id}')"><i class="ri-restart-line"></i> إعادة المحاولة</button>
            <button class="btn btn-outline" onclick="window.print()"><i class="ri-printer-line"></i> طباعة النتيجة</button>
            <button class="btn btn-primary" onclick="closeSimModal()">إغلاق ومتابعة النماذج</button>
          </div>
        `;
        CBS.haptic(d.passed ? 'success' : 'warning');
      } else {
        CBS.toast(data.message || 'فشل تصحيح الامتحان', '', 'error');
      }
    } catch(e) {
      CBS.toast('فشل تصحيح الامتحان', '', 'error');
    }
  }

  function closeSimModal() {
    clearInterval(simTimerInterval);
    document.getElementById('simModal').style.display = 'none';
  }

  /* ===== إضافة / تعديل نموذج امتحان =====
     الرفع يحتاج multipart، وCBS.apiPost يفرض application/json دائماً،
     فنستخدم fetch مباشرة كما تفعل بقية صفحات الرفع في التطبيق. */
  let _editingExamId = null;

  function openAddExamModal(exam) {
    _editingExamId = exam?._id || null;
    document.getElementById('examModalTitle').textContent =
      _editingExamId ? 'تعديل نموذج الامتحان' : 'إضافة نموذج امتحان سابق';
    document.getElementById('saveExamBtn').textContent =
      _editingExamId ? 'حفظ التعديلات' : 'حفظ النموذج';

    document.getElementById('addExamTitle').value = exam?.title || '';
    document.getElementById('addExamYear').value = exam?.year || '2024/2025';
    document.getElementById('addExamType').value = exam?.examType || 'final';
    if (exam?.subject) {
      document.getElementById('addExamSubject').value = exam.subject._id || exam.subject;
    }
    document.getElementById('addExamFile').value = '';

    const note = document.getElementById('examCurrentFile');
    if (exam?.pdfFile) {
      note.style.display = 'block';
      note.textContent = 'يوجد ملف مرفوع حالياً — اختيار ملف جديد سيستبدله.';
    } else {
      note.style.display = 'none';
    }

    document.getElementById('addExamModal').style.display = 'flex';
  }

  function closeAddExamModal() {
    _editingExamId = null;
    document.getElementById('addExamModal').style.display = 'none';
  }

  async function savePastExam() {
    const title = document.getElementById('addExamTitle').value.trim();
    const subject = document.getElementById('addExamSubject').value;
    const year = document.getElementById('addExamYear').value.trim();
    const examType = document.getElementById('addExamType').value;
    const file = document.getElementById('addExamFile').files[0];
    const btn = document.getElementById('saveExamBtn');

    if (!title || !subject || !year) {
      CBS.toast('العنوان والمادة والسنة مطلوبة', '', 'error');
      return;
    }

    const form = new FormData();
    form.append('title', title);
    form.append('subject', subject);
    form.append('year', year);
    form.append('examType', examType);
    if (file) form.append('pdfFile', file);

    const headers = { Authorization: 'Bearer ' + CBS.getToken() };
    const batchId = CBS.getBatchId && CBS.getBatchId();
    if (batchId) headers['x-batch-id'] = batchId;

    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';
    try {
      const url = _editingExamId ? `/api/past-exams/${_editingExamId}` : '/api/past-exams';
      const res = await fetch(url, {
        method: _editingExamId ? 'PUT' : 'POST',
        headers,
        body: form
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success) {
        const wasEdit = !!_editingExamId;
        closeAddExamModal();
        CBS.toast(wasEdit ? 'تم تحديث النموذج' : 'تمت إضافة نموذج الامتحان بنجاح', '', 'success');
        loadPastExams();
      } else {
        CBS.toast(data.message || 'فشل حفظ النموذج', '', 'error');
        console.error('[past-exams/savePastExam] رد الخادم:', data);
      }
    } catch (e) {
      CBS.toast('تعذّر الاتصال بالخادم أثناء الحفظ', '', 'error');
      console.error('[past-exams/savePastExam]', e);
    } finally {
      btn.disabled = false;
      btn.textContent = _editingExamId ? 'حفظ التعديلات' : 'حفظ النموذج';
    }
  }

  function editPastExam(id) {
    const exam = (allLoadedExams || []).find(e => e._id === id);
    if (!exam) return CBS.toast('تعذّر العثور على النموذج', '', 'error');
    openAddExamModal(exam);
  }

  async function deletePastExam(id) {
    const exam = (allLoadedExams || []).find(e => e._id === id);
    if (!confirm(`حذف نموذج «${exam?.title || ''}» نهائياً؟ لا يمكن التراجع.`)) return;
    try {
      const res = await CBS.apiDelete(`/api/past-exams/${id}`);
      const data = await CBS.readJson(res);
      if (data.success) {
        CBS.toast('تم حذف النموذج', '', 'success');
        loadPastExams();
      } else {
        CBS.toast(data.message || 'فشل الحذف', '', 'error');
      }
    } catch (e) {
      CBS.toast('تعذّر الاتصال بالخادم أثناء الحذف', '', 'error');
      console.error('[past-exams/deletePastExam]', e);
    }
  }

  init();
</script>

<!-- Add Exam Modal -->
<div id="addExamModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; padding:16px;">
  <div class="card" style="max-width:460px; width:100%; padding:20px; border-radius:var(--radius-xl);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 id="examModalTitle" style="font-size:1.05rem; font-weight:800; margin:0;">إضافة نموذج امتحان سابق</h3>
      <button class="btn btn-outline" style="padding:4px 8px;" onclick="closeAddExamModal()" aria-label="إغلاق"><i class="ri-close-line"></i></button>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="addExamTitle">عنوان الامتحان:</label>
      <input type="text" id="addExamTitle" class="form-control" placeholder="مثال: امتحان الفاينل 2024/2025">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="addExamSubject">المقرر الدراسي:</label>
      <select id="addExamSubject" class="form-control"></select>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
      <div>
        <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="addExamYear">السنة الأكاديمية:</label>
        <input type="text" id="addExamYear" class="form-control" value="2024/2025">
      </div>
      <div>
        <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="addExamType">نوع الامتحان:</label>
        <select id="addExamType" class="form-control">
          <option value="final">فاينل (نهائي)</option>
          <option value="midterm">نصفي (ميدتيرم)</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;" for="addExamFile">
        ملف الامتحان (PDF أو صورة):
      </label>
      <input type="file" id="addExamFile" class="form-control"
             accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,application/pdf,image/*"
             style="padding:8px;">
      <small id="examCurrentFile" style="display:none; font-size:0.75rem; color:var(--text-muted); margin-top:4px;"></small>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-outline" onclick="closeAddExamModal()">إلغاء</button>
      <button id="saveExamBtn" class="btn btn-primary" onclick="savePastExam()">حفظ النموذج</button>
    </div>
  </div>
</div>
</body>
</html>
