<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل طالب جديد | كلية النصر التقنية</title>
  <meta name="description" content="صفحة تقديم طلب تسجيل طالب جديد - النظام الجامعي المتكامل">
  <link href="/vendor/fonts/cairo.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/remixicon/remixicon.css">
  <script charset="UTF-8" src="/js/shared.js?v=2026102613"></script>
<script charset="UTF-8" src="/js/app.js?v=2026102613"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      color: white;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
    }

    .reg-container {
      width: 100%;
      max-width: 440px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .logo-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-top: 10px;
      color: #fff;
    }
    .logo-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .reg-card { position: relative; z-index: 1; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset, 0 1px 0 rgba(255, 255, 255, 0.1) inset;
}

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
      text-align: center;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap i {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 1.1rem;
      pointer-events: none;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .form-select option {
      background: #0f172a;
      color: #fff;
    }
    .form-input.has-toggle { padding-left: 44px; }
    .pass-toggle {
      position: absolute;
      left: 6px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: none;
      border: none;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .pass-toggle:hover, .pass-toggle:focus-visible { color: #fff; background: rgba(255, 255, 255, 0.08); outline: none; }
    .input-wrap .pass-toggle i { position: static; color: inherit; }
    .field-warn {
      display: none;
      align-items: flex-start;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #fcd34d;
    }
    .field-warn.show { display: flex; }

    .form-input:focus, .form-select:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
  
    body { background: #051527; }
    /* الدوائر الزخرفية كانت absolute فتمدّ عرض الصفحة (441px على هاتف 375)
       وينزلق النموذج جانبياً عند التركيز على حقل وتُقصّ العناوين. fixed يجعلها
       خلفية للشاشة لا جزءاً من عرض المستند. */
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.25; animation: orbFloat 8s ease-in-out infinite; z-index: 0; pointer-events: none; }
    .bg-orb-1 { width: 400px; height: 400px; background: #2563eb; top: -100px; right: -80px; animation-delay: 0s; }
    .bg-orb-2 { width: 300px; height: 300px; background: #06b6d4; bottom: -80px; left: -60px; animation-delay: -4s; }
    .bg-orb-3 { width: 200px; height: 200px; background: #7c3aed; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -2s; }
    @keyframes orbFloat { 0%, 100% { transform: scale(1) translate(0, 0); } 33% { transform: scale(1.1) translate(20px, -20px); } 66% { transform: scale(0.95) translate(-15px, 15px); } }
</style>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/auth.css?v=2026102613">
</head>

<body>
  <!-- Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="reg-container">
    <div class="logo-section">
      <img src="/assets/logo.png" class="logo-img" alt="شعار كلية النصر التقنية - جامعة النصر التقنية" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2280%22%3EðŸŽ“%3C/text%3E%3C/svg%3E'">
      <div class="logo-title">كلية النصر التقنية</div>
      <div class="logo-sub">طلب تسجيل طالب جديد</div>
    </div>

    <div class="reg-card">
      <div class="card-title"><i class="ri-user-add-line"></i> إنشــاء حســاب</div>
      <div class="card-desc">أدخل بياناتك وكود الدعوة للانضمام إلى النظام الجامعي</div>

      <div class="alert alert-error" id="alertError" role="alert"></div>
      <div class="alert alert-success" id="alertSuccess" role="alert"></div>

      <form id="regForm" onsubmit="event.preventDefault(); submitRegistration();">
        <div class="form-group">
          <label class="form-label" for="name">الاسم الرباعي كاملًا</label>
          <div class="input-wrap">
            <i class="ri-user-line"></i>
            <input type="text" id="name" class="form-input" placeholder="مثال: أحمد محمد علي حسن" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <i class="ri-mail-line"></i>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">رقم الواتساب (للتواصل واستلام التأكيد)</label>
          <div class="input-wrap">
            <i class="ri-whatsapp-line"></i>
            <input type="tel" id="phone" class="form-input" placeholder="مثال: 249912345678" required dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">كلمة المرور (6 أحرف على الأقل)</label>
          <div class="input-wrap">
            <i class="ri-lock-password-line"></i>
            <input type="password" id="regPassword" class="form-input has-toggle" minlength="6" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" required dir="ltr" aria-describedby="passWarn">
            <button type="button" class="pass-toggle" id="passToggle" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="ri-eye-off-line"></i></button>
          </div>
          <div class="field-warn" id="passWarn" role="status">
            <i class="ri-keyboard-line"></i>
            <span>كلمة المرور فيها حروف عربية. تأكد أن لوحة المفاتيح على اللغة التي ستستخدمها عند تسجيل الدخول.</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword2">تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <i class="ri-lock-password-line"></i>
            <input type="password" id="regPassword2" class="form-input" minlength="6" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" required dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inviteCode">كود الدعوة السري الخاص بدفعتك (Invite Code)</label>
          <div class="input-wrap">
            <i class="ri-key-2-line"></i>
            <input type="text" id="inviteCode" class="form-input" placeholder="أدخل كود الدعوة المخصص لدفعتك" required dir="ltr">
          </div>
          <div style="font-size: 0.78rem; color: #94a3b8; margin-top: 5px;">
            <i class="ri-information-line"></i> كود الدعوة هو الذي سيحدد دفعتك الدراسية تلقائياً ويمنع أي خطأ.
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <i class="ri-send-plane-fill"></i>
          <span>إرسال طلب التسجيل</span>
        </button>
      </form>

      <a href="/login.html" class="back-link">
        <i class="ri-arrow-right-line"></i> العودة لصفحة تسجيل الدخول
      </a>
    </div>
  </div>

  <script>
    const apiBaseUrl = (typeof API_BASE !== 'undefined' && API_BASE) ? API_BASE : window.location.origin;

    /* حقل كلمة المرور نقاط فقط: الطالب لا يرى أن لوحة المفاتيح كانت عربية
       فيسجّل بحروف عربية ثم يدخل بالإنجليزية ويُرفض. الإظهار والتنبيه يكشفان ذلك.
       (الأرقام العربية ١٢٣ يوحّدها الخادم مع 123 تلقائياً، لذا التنبيه للحروف فقط) */
    const ARABIC_LETTERS = /[ء-يٱ-ۓ]/;
    const passInput = document.getElementById('regPassword');
    const passInput2 = document.getElementById('regPassword2');
    const passToggle = document.getElementById('passToggle');
    const passWarn = document.getElementById('passWarn');

    passToggle.addEventListener('click', () => {
      const show = passInput.type === 'password';
      passInput.type = passInput2.type = show ? 'text' : 'password';
      passToggle.setAttribute('aria-pressed', String(show));
      passToggle.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
      passToggle.innerHTML = `<i class="${show ? 'ri-eye-line' : 'ri-eye-off-line'}"></i>`;
    });
    passInput.addEventListener('input', () => {
      passWarn.classList.toggle('show', ARABIC_LETTERS.test(passInput.value));
    });

    async function submitRegistration() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const inviteCode = document.getElementById('inviteCode').value.trim();
      /* كانت كلمة المرور ثابتة "123456" لكل الطلاب: بعد قبول الطلب يستطيع أي
         شخص يعرف البريد الدخول قبل صاحبه وتعيين كلمته هو. الطالب يختارها الآن. */
      const password = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;

      const errEl = document.getElementById('alertError');
      const succEl = document.getElementById('alertSuccess');
      const btn = document.getElementById('submitBtn');

      errEl.style.display = 'none';
      succEl.style.display = 'none';

      if (!inviteCode) {
        errEl.textContent = 'يرجى إدخال كود الدعوة الخاص بدفعتك';
        errEl.style.display = 'flex';
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        errEl.style.display = 'flex';
        return;
      }
      if (password !== password2) {
        errEl.textContent = 'كلمتا المرور غير متطابقتين';
        errEl.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="btn-loading"></span> جاري إرسال الطلب...';

      try {
        const res = await fetch(apiBaseUrl + '/api/auth/register-public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, inviteCode, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          document.getElementById('regForm').reset();
          succEl.innerHTML = '<i class="ri-checkbox-circle-fill"></i> ';
          succEl.append(data.message || 'تم إرسال طلبك بنجاح! سيتم مراجعته وقبوله من قبل إدارة الكلية.');
          succEl.style.display = 'flex';
        } else {
          errEl.innerHTML = '<i class="ri-error-warning-fill"></i> ';
          errEl.append(data.message || 'فشل إرسال طلب التسجيل');
          errEl.style.display = 'flex';
        }
      } catch (err) {
        errEl.innerHTML = '<i class="ri-wifi-off-line"></i> تعذر الاتصال بالخادم، يرجى التحقق من الشبكة';
        errEl.style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ri-send-plane-fill"></i> <span>إرسال طلب التسجيل</span>';
      }
    }
  </script>
</body>
</html>
