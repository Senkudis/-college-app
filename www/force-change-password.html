<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تغيير كلمة المرور | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026083019">
  <style>
    body { }
    \.auth-card { position: relative; z-index: 1;  border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); width:90%; max-width:480px; padding:40px; 
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset, 0 1px 0 rgba(255, 255, 255, 0.1) inset;
}
    .auth-top { text-align:center; margin-bottom:24px; }
    .auth-logo { width:70px; height:70px; border-radius:50%; background:var(--primary-light); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
    .auth-logo img { width:50px; height:50px; object-fit:contain; }
    .auth-title { font-size:1.3rem; font-weight:800; color:var(--text-main); margin-bottom:4px; }
    .auth-sub   { font-size:0.85rem; color:var(--text-muted); }

    .warn-box {
      background: var(--warning-bg);
      border: 1px solid rgba(245,158,11,0.3);
      border-right: 4px solid var(--warning);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }
    .warn-box-title { font-weight: 700; color: var(--warning); margin-bottom: 8px; display:flex; align-items:center; gap:6px; font-size:0.9rem; }
    .warn-box ul { margin: 0; padding-right: 18px; color: var(--text-muted); font-size: 0.82rem; line-height: 1.8; }

    .strength-bar { height:4px; border-radius:2px; margin-top:6px; background:var(--border); overflow:hidden; }
    .strength-fill { height:100%; border-radius:2px; transition: all 0.4s; width: 0; }
    .strength-text { font-size:0.78rem; margin-top:4px; }

    .footer-note { margin-top:24px; font-size:0.78rem; color:rgba(255,255,255,0.55); }
  
    body { background: #051527; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.25; animation: orbFloat 8s ease-in-out infinite; z-index: 0; pointer-events: none; }
    .bg-orb-1 { width: 400px; height: 400px; background: #2563eb; top: -100px; right: -80px; animation-delay: 0s; }
    .bg-orb-2 { width: 300px; height: 300px; background: #06b6d4; bottom: -80px; left: -60px; animation-delay: -4s; }
    .bg-orb-3 { width: 200px; height: 200px; background: #7c3aed; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -2s; }
    @keyframes orbFloat { 0%, 100% { transform: scale(1) translate(0, 0); } 33% { transform: scale(1.1) translate(20px, -20px); } 66% { transform: scale(0.95) translate(-15px, 15px); } }
</style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <!-- Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>


<div class="auth-card">
  <div class="auth-top">
    <div class="auth-logo"><img src="/assets/logo.png" alt="شعار كلية النصر التقنية - جامعة النصر التقنية"></div>
    <div class="auth-title">تغيير كلمة المرور</div>
    <div class="auth-sub">هذا أول تسجيل دخول — يجب عليك تغيير كلمة المرور الافتراضية</div>
  </div>

  <div class="warn-box">
    <div class="warn-box-title"><i class="ri-shield-keyhole-line"></i> متطلبات الأمان</div>
    <ul>
      <li>كلمة المرور يجب أن تختلف عن كلمة المرور الحالية</li>
      <li>6 أحرف على الأقل</li>
      <li>لا تستخدم كلمة مرور سهلة التخمين</li>
    </ul>
  </div>

  <div id="alertMsg" class="alert" role="alert"></div>

  <form onsubmit="event.preventDefault(); changePassword();">
    <div class="form-group">
      <label class="form-label" for="currentPass">كلمة المرور الحالية</label>
      <div class="input-wrapper">
        <i class="input-icon ri-lock-line"></i>
        <input class="form-control" type="password" id="currentPass" placeholder="••••••••" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="newPass">كلمة المرور الجديدة</label>
      <div class="input-wrapper">
        <i class="input-icon ri-lock-password-line"></i>
        <input class="form-control" type="password" id="newPass" placeholder="••••••••" required>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPass">تأكيد كلمة المرور الجديدة</label>
      <div class="input-wrapper">
        <i class="input-icon ri-lock-check-line"></i>
        <input class="form-control" type="password" id="confirmPass" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;margin-top:8px;">
      <span class="spinner" id="spinner" style="display:none;"></span>
      <span id="btnText">تغيير كلمة المرور</span>
    </button>
  </form>
</div>

<div class="footer-note">جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل</div>

<script src="/js/shared.js?v=2026083019"></script>
<script src="/js/app.js?v=2026083019"></script>
<script>
  CBS.setYear(); CBS.initDarkMode();
  const token = CBS.getToken();
  if (!token) location.href = '/login.html';

  document.getElementById('newPass').addEventListener('input', function() {
    const p = this.value; const len = p.length;
    let w = 0, cls = '', label = '';
    if      (!len)  { document.getElementById('strengthFill').style.width='0'; document.getElementById('strengthText').textContent=''; return; }
    if      (len < 6)  { w=15;  cls='#ef4444'; label='ضعيفة جداً'; }
    else if (len < 8)  { w=40;  cls='#f59e0b'; label='مقبولة'; }
    else if (len < 10) { w=65;  cls='#f59e0b'; label='متوسطة'; }
    else if (/[A-Z]/.test(p) && /\d/.test(p) && /[^A-Za-z0-9]/.test(p)) { w=100; cls='#10b981'; label='قوية جداً'; }
    else               { w=82;  cls='#10b981'; label='جيدة'; }
    document.getElementById('strengthFill').style.cssText = `width:${w}%; background:${cls}`;
    document.getElementById('strengthText').textContent   = label;
    document.getElementById('strengthText').style.color   = cls;
  });

  async function changePassword() {
    const cp = document.getElementById('currentPass').value;
    const np = document.getElementById('newPass').value;
    const cf = document.getElementById('confirmPass').value;
    CBS.hideAlert('alertMsg');

    if (!cp || !np || !cf) { CBS.showAlert('alertMsg','الرجاء ملء جميع الحقول','danger'); return; }
    if (np.length < 6)     { CBS.showAlert('alertMsg','كلمة المرور يجب أن تكون 6 أحرف على الأقل','warning'); return; }
    if (np !== cf)         { CBS.showAlert('alertMsg','كلمتا المرور غير متطابقتين','danger'); return; }
    if (np === cp)         { CBS.showAlert('alertMsg','كلمة المرور الجديدة يجب أن تختلف عن الحالية','warning'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('btnText').textContent   = 'جاري التغيير...';

    try {
      const res  = await fetch(API_BASE + '/api/auth/force-change-password', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
        body: JSON.stringify({ currentPassword:cp, newPassword:np, confirmPassword:cf })
      });
      const data = await res.json();

      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnText').textContent   = 'تغيير كلمة المرور';

      if (!res.ok) { CBS.showAlert('alertMsg', data.message || 'حدث خطأ', 'danger'); return; }

      if (data.token) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user',  JSON.stringify(data.user));
      }

      CBS.showAlert('alertMsg', 'تم تغيير كلمة المرور بنجاح! جاري التحويل...', 'success');
      setTimeout(() => {
        const user = data.user || JSON.parse(localStorage.getItem('user') || '{}');
        location.href = user.roles?.some(r => ['admin', 'dean'].includes(r)) ? '/admin_dashboard.html' : '/dashboard.html';
      }, 1800);
    } catch(e) {
      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnText').textContent   = 'تغيير كلمة المرور';
      CBS.showAlert('alertMsg', 'خطأ في الاتصال بالخادم', 'danger');
    }
  }
</script>
</body>
</html>
