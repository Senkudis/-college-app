<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مكتبة الفيديو | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102613">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102613">
  <link rel="stylesheet" href="/css/ui.css?v=2026102613">
  <style>
    /* صف لكل فيديو بصورة مصغّرة صغيرة: بطاقات 16:9 كانت تعرض ثلاثة فيديوهات في الشاشة */
    .vl-thumb { position: relative; flex-shrink: 0; width: 112px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #1e293b; }
    .vl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vl-thumb .vl-play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 1.5rem; background: rgba(15, 23, 42, 0.25); }
    .vl-thumb .vl-dur { position: absolute; bottom: 4px; left: 4px; padding: 1px 5px; border-radius: 4px; font-size: 0.66rem; font-weight: 700; color: #fff; background: rgba(0, 0, 0, 0.75); direction: ltr; }
    .vl-row { align-items: center; }
    .vl-row .hm-row-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .hm-list .vl-row + .vl-row::before { inset-inline-start: 138px; }
    .vl-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .vl-tools .ui-search { flex: 1; min-width: 0; }
    .vl-tools select { min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--hm-surface); color: var(--text-main); font: inherit; font-size: 0.84rem; }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>مكتبة الفيديو</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="location.href='/dashboard.html'" title="الرئيسية"><i class="ri-home-line"></i></button>
  </div>
</header>

<div class="page-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner" style="--page-accent:#dc2626">
      <div class="welcome-banner-icon-wrap">
        <i class="ri-play-circle-line welcome-banner-icon"></i>
      </div>
      <div class="welcome-banner-body">
        <h2>مكتبة الفيديو</h2>
        <p>محتوى المحاضرات المرئية للطلاب</p>
      </div>
    </div>
  <div class="ui-toolbar" id="uploadBar" hidden>
    <a href="/creator-studio.html" class="ui-primary" id="uploadLink"><i class="ri-upload-cloud-2-line"></i> رفع فيديو</a>
  </div>

  <div class="vl-tools">
    <div class="ui-search"><i class="ri-search-line"></i><input type="search" id="searchBox" placeholder="ابحث عن فيديو" aria-label="ابحث عن فيديو"></div>
    <select id="sortSelect" aria-label="الترتيب">
      <option value="new">الأحدث</option>
      <option value="old">الأقدم</option>
    </select>
  </div>
  <!-- المقررات كشرائح بدل قائمة منسدلة ثانية -->
  <div class="ui-chips" id="subjectChips" aria-label="تصفية حسب المقرر"></div>
  <input type="hidden" id="subjectFilter" value="">

  <div class="hm-list" id="videosGrid"></div>
</div>

<div id="toast-container"></div>
<footer class="main-footer">جميع الحقوق محفوظة &copy; <span id="year"></span> النظام الجامعي المتكامل</footer>

<script src="/js/shared.js?v=2026102613"></script>
<script src="/js/app.js?v=2026102613"></script>
<script src="/js/socket-client.js?v=2026102613" defer></script>
<script>
  CBS.init();
  const user = CBS.getUser();
  const isDoctorOrLeader = user.roles && (user.roles.includes('doctor') || user.roles.includes('dean') || user.roles.includes('leader'));
  if (isDoctorOrLeader) document.getElementById('uploadBar').hidden = false;

  let allVideos = [];

  function formatDuration(secs) {
    if (!secs) return '';
    const m = Math.floor(secs / 60), s = secs % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  async function loadSubjects() {
    try {
      const res = await CBS.apiGet('/api/subjects');
      const _resData = await CBS.readJson(res);
      const list = _resData.data?.subjects || _resData.subjects || _resData.data || _resData;
      const chips = document.getElementById('subjectChips');
      chips.innerHTML = `<button type="button" class="ui-chip active" data-s="">الكل</button>` +
        list.map(s => `<button type="button" class="ui-chip" data-s="${CBS.escapeHTML(s._id)}">${CBS.escapeHTML(s.name)}</button>`).join('');
      chips.addEventListener('click', e => {
        const b = e.target.closest('.ui-chip'); if (!b) return;
        chips.querySelectorAll('.ui-chip').forEach(c => c.classList.toggle('active', c === b));
        document.getElementById('subjectFilter').value = b.dataset.s;
        renderVideos();
      });
    } catch(e) { console.error('[video-library/loadSubjects]', e); }
  }

  async function loadVideos() {
    CBS.showLoading('videosGrid', 'جاري التحميل...', 'skeleton-list');
    try {
      const res = await CBS.apiGet('/api/videos');
      const data = await CBS.readJson(res);
      allVideos = data.success ? data.videos : [];
      renderVideos();
    } catch(e) {
      CBS.showEmpty('videosGrid', 'حدث خطأ في التحميل', 'ri-wifi-off-line');
    }
  }

  function renderVideos() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const subj = document.getElementById('subjectFilter').value;
    const sort = document.getElementById('sortSelect').value;

    let list = allVideos.filter(v => {
      if (q && !v.title.toLowerCase().includes(q)) return false;
      if (subj && (typeof v.subject === 'object' ? v.subject?._id : v.subject) !== subj) return false;
      return true;
    });

    list.sort((a, b) => sort === 'new'
      ? new Date(b.createdAt) - new Date(a.createdAt)
      : new Date(a.createdAt) - new Date(b.createdAt)
    );

    if (!list.length) {
      CBS.showEmpty('videosGrid', 'لا توجد فيديوهات مطابقة', 'ri-video-line');
      return;
    }

    document.getElementById('videosGrid').innerHTML = list.map(v => {
      const subName = typeof v.subject === 'object' ? (v.subject?.name || '') : '';
      const meta = [subName, new Date(v.createdAt).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }), `${v.views || 0} مشاهدة`].filter(Boolean).join(' · ');
      // API_BASE: داخل التطبيق كان المسار النسبي يذهب للحزمة المحلية فتظهر كل الصور سوداء
      return `<a class="hm-row vl-row" href="/watch-video.html?id=${encodeURIComponent(v._id)}">
        <span class="vl-thumb">
          <img src="${API_BASE}/api/videos/${encodeURIComponent(v._id)}/thumbnail" alt="" loading="lazy">
          <span class="vl-play"><i class="ri-play-fill"></i></span>
          ${v.duration ? `<span class="vl-dur">${formatDuration(v.duration)}</span>` : ''}
        </span>
        <div class="hm-row-body">
          <div class="hm-row-title">${CBS.escapeHTML(v.title)}</div>
          <div class="hm-row-meta">${CBS.escapeHTML(meta)}</div>
          ${v.status === 'processing' ? '<span class="hm-chip" data-tone="warning" style="display:inline-block;margin-top:4px">قيد المعالجة</span>' : ''}
        </div>
        <span class="hm-row-end"><i class="ri-arrow-left-s-line" aria-hidden="true"></i></span>
      </a>`;
    }).join('');
  }

  document.getElementById('searchBox').addEventListener('input', renderVideos);
  document.getElementById('sortSelect').addEventListener('change', renderVideos);

  loadSubjects();
  loadVideos();
</script>
<script>document.addEventListener('cbs:refresh',e=>{e.preventDefault();loadVideos().finally(()=>e.detail.done());});</script>
</body>
</html>
