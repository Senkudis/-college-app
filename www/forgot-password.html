﻿﻿<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>نسيت كلمة المرور | كلية تقنية المعلومات</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026073128">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(135deg,#0d3b66,#1e6091); }
    .auth-card { background:var(--bg-card); border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); width:90%; max-width:440px; padding:40px; text-align:center; }
    .auth-logo { width:72px; height:72px; border-radius:50%; background:var(--primary-light); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
    .auth-logo img { width:52px; height:52px; object-fit:contain; }
    .auth-title { font-size:1.4rem; font-weight:800; color:var(--text-main); margin-bottom:6px; }
    .auth-sub { font-size:0.88rem; color:var(--text-muted); margin-bottom:28px; line-height:1.5; }
    .auth-footer { margin-top:20px; font-size:0.85rem; }
    .countdown { font-size:0.82rem; color:var(--text-muted); margin-top:10px; display:none; }
    .footer-note { margin-top:24px; font-size:0.78rem; color:rgba(255,255,255,0.6); }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<div class="auth-card">
  <div class="auth-logo"><img src="/assets/logo.png" alt="Logo"></div>
  <div class="auth-title">نسيت كلمة المرور؟</div>
  <div class="auth-sub">أدخل بريدك الإلكتروني وسنرسل لك كود من 6 أرقام لاستعادتها.</div>

  <div id="alertMsg" class="alert"></div>

  <form onsubmit="event.preventDefault(); requestCode();">
    <div class="form-group">
      <div class="input-wrapper">
        <i class="input-icon ri-mail-line"></i>
        <input class="form-control" type="email" id="email" placeholder="البريد الإلكتروني" required>
      </div>
    </div>
    <div class="countdown" id="countdown"></div>
    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:8px;">
      <span class="spinner" id="spinner" style="display:none;"></span>
      <span id="btnText">إرسال كود التحقق</span>
    </button>
  </form>

  <div class="auth-footer">
    <a href="/login.html" class="btn btn-ghost" style="width:100%;">
      <i class="ri-home-4-line"></i> العودة لتسجيل الدخول
    </a>
  </div>
</div>

<div class="footer-note">جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل</div>

<script src="/js/shared.js?v=2026073128"></script>
<script src="/js/app.js?v=2026073128"></script>
<script>
  CBS.setYear();
  CBS.initDarkMode();

  let countdownTimer;

  async function requestCode() {
    const email = document.getElementById('email').value.trim();
    CBS.hideAlert('alertMsg');
    if (!email) { CBS.showAlert('alertMsg', 'الرجاء إدخال البريد الإلكتروني', 'danger'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('btnText').textContent = 'جاري الإرسال...';

    try {
      const res  = await fetch(API_BASE + '/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnText').textContent = 'إرسال كود التحقق';

      if (!res.ok) {
        if (res.status === 429) { CBS.showAlert('alertMsg', data.message, 'warning'); startCountdown(); return; }
        CBS.showAlert('alertMsg', data.message || 'حدث خطأ', 'danger');
        return;
      }
      CBS.showAlert('alertMsg', data.message || 'تم إرسال الكود بنجاح!', 'success');
      setTimeout(() => { window.location.href = `/reset-code.html?email=${encodeURIComponent(email)}`; }, 2000);
    } catch {
      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnText').textContent = 'إرسال كود التحقق';
      CBS.showAlert('alertMsg', 'خطأ في الاتصال بالخادم', 'danger');
    }
  }

  function startCountdown() {
    let s = 30;
    const el = document.getElementById('countdown');
    el.style.display = 'block';
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      el.textContent = `يمكنك الإرسال بعد ${s} ثانية`;
      if (--s < 0) { clearInterval(countdownTimer); el.textContent = 'يمكنك الإرسال الآن'; }
    }, 1000);
  }
</script>
</body>
</html>
