<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة التسليمات | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102722">
  <link rel="stylesheet" href="/css/mobile.css?v=2026102722">
  <link rel="stylesheet" href="/css/ui.css?v=2026102722">
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-box .num  { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .stat-box .lbl  { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
    .stat-box.warn  .num { color: var(--warning); }
    .stat-box.success .num { color: var(--success); }
    .stat-box.danger  .num { color: var(--danger); }

    .filters-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filters-bar .form-group { flex: 1; min-width: 180px; margin: 0; }
    .filters-bar .form-group label { font-size: 0.82rem; }

    .not-sub-card {
      background: var(--danger-bg);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-top: 20px;
    }
    .not-sub-title { font-weight: 700; color: var(--danger); margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
    .not-sub-list  { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
    .not-sub-item  { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-card); border-radius: var(--radius-md); font-size: 0.88rem; }

    /* ===== بطاقات التسليمات (عرض الموبايل) =====
       كانت هذه الأصناف مستخدمة في الـHTML وغير معرَّفة في أي ملف CSS،
       فكانت البطاقات تظهر كنص متراكم بلا إطار ولا ترتيب. */
    .sub-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
      gap: 14px;
    }
    .sub-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .sub-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sub-card-student { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sub-avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }
    .sub-name  { font-weight: 700; font-size: 0.95rem; }
    .sub-email { font-size: 0.78rem; color: var(--text-muted); word-break: break-all; }
    .sub-card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .sub-card-meta span { display: flex; align-items: center; gap: 6px; }
    .sub-card-actions { display: flex; gap: 8px; align-items: stretch; }
    @media (max-width: 480px) {
      .sub-cards-grid { grid-template-columns: 1fr; }
    }
      .ms-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .ms-tools select { min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--hm-surface); color: var(--text-main); font: inherit; font-size: 0.86rem; min-width: 0; }
    .ms-tools > select:first-child { flex: 1; }
    .ms-av { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--primary-text); background: var(--primary-light); }
</style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <img src="/assets/logo.png" class="header-logo" alt="شعار كلية النصر التقنية - جامعة النصر التقنية">
    <div class="header-title-group">
      <strong>كلية النصر التقنية</strong>
      <small>إدارة التسليمات</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="CBS.toggleDark()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي"><i class="ri-moon-line" id="themeIcon"></i></button>
    <button class="btn-icon" onclick="CBS.goHome()" title="الرئيسية"><i class="ri-home-4-line"></i></button>
  </div>
</header>

<div class="page-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner" style="--page-accent:#7c3aed">
      <div class="welcome-banner-icon-wrap">
        <i class="ri-stack-line welcome-banner-icon"></i>
      </div>
      <div class="welcome-banner-body">
        <h2>إدارة التسليمات</h2>
        <p>مراجعة وتقييم تكليفات الطلاب</p>
      </div>
    </div>
  <div class="ms-tools">
    <select id="filterAssign" onchange="loadSubmissions()" aria-label="التكليف"><option value="">جميع التكليفات</option></select>
    <button type="button" class="ui-act" onclick="exportCSV()" id="exportBtn" style="min-height:44px" title="تصدير CSV"><i class="ri-file-excel-2-line"></i> CSV</button>
  </div>

  <!-- الحالة كشرائح (القائمة المنسدلة باقية مخفية لأن الروابط المباشرة تضبطها) -->
  <select id="filterStatus" onchange="loadSubmissions()" hidden>
    <option value="">الكل</option><option value="pending">قيد المراجعة</option><option value="reviewed">تمت المراجعة</option><option value="graded">مقيّم</option>
  </select>
  <div class="ui-chips" id="statusChips" aria-label="حالة التسليم">
    <button type="button" class="ui-chip" data-s="pending">بانتظار التصحيح <span class="n" data-c="pending"></span></button>
    <button type="button" class="ui-chip" data-s="graded">مقيّمة <span class="n" data-c="graded"></span></button>
    <button type="button" class="ui-chip" data-s="reviewed">تمت المراجعة <span class="n" data-c="reviewed"></span></button>
    <button type="button" class="ui-chip" data-s="">الكل <span class="n" data-c="all"></span></button>
  </div>

  <div class="ms-tools">
    <div class="ui-search" style="flex:1;min-width:0"><i class="ri-search-line"></i><input type="search" id="searchSubInput" placeholder="ابحث باسم الطالب" aria-label="ابحث باسم الطالب" oninput="searchSubmissions(this.value)"></div>
    <select id="filterType" onchange="loadSubmissions()" aria-label="النوع">
      <option value="">كل الأنواع</option><option value="exercise">تمرين</option><option value="research">بحث</option><option value="project">مشروع</option>
    </select>
  </div>
  <div id="statsRow" class="ui-count"></div>

  <div id="alertMsg" class="alert"></div>
  <div id="subsContainer"></div>

  <section id="notSubCard" style="display:none;margin-top:22px">
    <div class="hm-sec-head"><h2 class="hm-sec-title">لم يسلّموا <span class="n" id="notSubCount"></span></h2></div>
    <div class="hm-list" id="notSubList"></div>
  </section>
</div>

<!-- Grade Modal -->
<div class="modal-overlay" id="gradeModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="gradeModalTitle">تقييم الطالب</span>
      <button class="modal-close" onclick="CBS.closeModal('gradeModal')" aria-label="إغلاق"><i class="ri-close-line"></i></button>
    </div>
    <div class="modal-body">
      <div id="gradeModalAlert" class="alert"></div>
      <div id="subInfo" style="background:var(--bg-hover); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; font-size:0.88rem;"></div>
      <div class="form-group">
        <label class="form-label" for="gradeInput">الدرجة (0 - 100)</label>
        <div class="input-wrapper"><i class="input-icon ri-star-line"></i>
          <input class="form-control" type="number" id="gradeInput" min="0" max="100">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="feedbackInput">ملاحظات (اختياري)</label>
        <textarea class="form-control" id="feedbackInput" rows="3" placeholder="اكتب ملاحظاتك..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="CBS.closeModal('gradeModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveGrade()"><i class="ri-save-line"></i> حفظ التقييم</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<footer class="main-footer">
  جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل
</footer>

<script src="/js/shared.js?v=2026102722"></script>
<script src="/js/app.js?v=2026102722"></script>
<script src="/js/socket-client.js?v=2026102722" defer></script>
<script>
  CBS.init({ requireRoles: ['dean', 'doctor', 'admin'] }); // تقييم التسليمات ليس من صلاحيات الليدر

  let allSubs = [], allAssigns = [], currentSubId = null;
  const typeLabel   = { exercise:'تمرين', research:'بحث', project:'مشروع' };
  const statusLabel = { pending:'قيد المراجعة', reviewed:'تمت المراجعة', graded:'مقيّم' };
  const statusBadge = { pending:'badge-warning', reviewed:'badge-accent', graded:'badge-success' };

  function searchSubmissions(query) {
    const q = query.toLowerCase().trim();
    const cards = document.querySelectorAll('#subsContainer .ms-sub');
    cards.forEach(card => {
      const text = card.querySelector('.hm-row-title')?.innerText.toLowerCase() || '';
      card.style.display = text.includes(q) ? '' : 'none';
    });
  }

  async function init() {
    try {
      const types = ['exercise','research','project'];
      allAssigns = [];
      await Promise.all(types.map(async t => {
        const res = await CBS.apiGet(`/api/assignments/type/${t}`);
        const d   = await CBS.readJson(res);
        const items = d.success && d.data ? (d.data.assignments || []) : (Array.isArray(d) ? d : []);
        allAssigns.push(...items);
      }));
      const sel = document.getElementById('filterAssign');
      sel.innerHTML = '<option value="">جميع التكليفات</option>' +
        allAssigns.map(a => `<option value="${a._id}">${CBS.escapeHTML(a.title)}</option>`).join('');
      // رابط مباشر من الصفحة الرئيسية: ?assignment=<id>&status=pending
      const q = new URLSearchParams(location.search);
      if (allAssigns.some(a => a._id === q.get('assignment'))) sel.value = q.get('assignment');
      const st = document.getElementById('filterStatus');
      if (st && q.get('status') && [...st.options].some(o => o.value === q.get('status'))) st.value = q.get('status');
      loadSubmissions();
    } catch(e) { CBS.showAlert('alertMsg', 'خطأ في التحميل', 'danger'); }
  }

  async function loadSubmissions() {
    const assignId = document.getElementById('filterAssign').value;
    const type     = document.getElementById('filterType').value;
    const status   = document.getElementById('filterStatus').value;
    const container = document.getElementById('subsContainer');
    container.innerHTML = '<div class="loading-state"><div class="spinner spinner-dark"></div><p>جاري التحميل...</p></div>';
    document.getElementById('notSubCard').style.display = 'none';

    try {
      allSubs = [];
      const targets = assignId ? [assignId] : allAssigns.map(a => a._id);
      await Promise.all(targets.map(async id => {
        const res = await CBS.apiGet(`/api/submissions/assignment/${id}/submissions`);
        const d   = await CBS.readJson(res);
        const items = d.success && d.data ? (d.data.submissions || []) : (Array.isArray(d) ? d : []);
        allSubs.push(...items);
      }));

      let filtered = allSubs;
      if (type)   filtered = filtered.filter(s => s.submissionType === type);
      if (status) filtered = filtered.filter(s => s.status === status);

      updateStats(filtered);

      if (!filtered.length) {
        container.innerHTML = `<div class="hm-list"><div class="hm-row hm-empty"><span class="hm-ic" data-tone="success"><i class="ri-checkbox-circle-line"></i></span><div class="hm-row-body"><div class="hm-row-title">لا تسليمات هنا</div><div class="hm-row-meta">جرّب حالة أو تكليفاً آخر</div></div></div></div>`;
      } else {
        // صف لكل تسليم: الضغط يفتح التقييم، والملف أيقونة في الطرف
        const tone = { pending: 'warning', reviewed: 'primary', graded: 'success' };
        container.innerHTML = '<div class="hm-list">' + filtered.map(s => `
          <div class="hm-row ui-row ms-sub">
            <button type="button" class="ui-row-main" onclick="openGrade('${s._id}')">
              <span class="ms-av">${CBS.escapeHTML((s.student?.name || '?').trim()[0])}</span>
              <div class="hm-row-body"><div class="hm-row-title">${CBS.escapeHTML(s.student?.name || '-')}</div>
                <div class="hm-row-meta">${CBS.escapeHTML(s.assignment?.title || '-')} · ${CBS.formatDateTime(s.submissionDate)}${s.isLate ? ' · <span style="color:var(--danger-text)">متأخر</span>' : ''}</div></div>
            </button>
            <span class="hm-row-end">
              <span class="hm-chip" data-tone="${tone[s.status] || ''}">${s.grade != null ? s.grade + '/100' : (statusLabel[s.status] || s.status)}</span>
              <a class="ui-icon-btn" href="${API_BASE}${CBS.privateFileUrl('submissions', s.file)}" target="_blank" rel="noopener noreferrer" title="ملف التسليم" aria-label="ملف التسليم"><i class="ri-file-download-line"></i></a>
            </span>
          </div>`).join('') + '</div>';
      }

      if (assignId) loadNotSubmitted(assignId);
    } catch(e) { CBS.showAlert('alertMsg', 'حدث خطأ في التحميل', 'danger'); }
  }

  async function exportCSV() {
    const assignId = document.getElementById('filterAssign').value;
    const url = assignId
      ? `/api/submissions/export/csv?assignmentId=${assignId}`
      : `/api/submissions/export/csv`;
    
    try {
      const btn = document.getElementById('exportBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="ri-loader-4-line spinner" style="display:inline-block"></i> جاري التصدير...';
      btn.disabled = true;

      const res = await CBS.apiGet(url);
      if (!res.ok) throw new Error('فشل التصدير');

      const blob = await res.blob();
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      
      let filename = `submissions_${Date.now()}.csv`;
      const disposition = res.headers.get('Content-Disposition');
      if (disposition && disposition.includes('filename=')) {
        const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
        if (matches != null && matches[1]) {
          filename = matches[1].replace(/['"]/g, '');
        }
      }
      
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(downloadUrl);

      btn.innerHTML = originalText;
      btn.disabled = false;
    } catch (e) {
      CBS.showAlert('alertMsg', 'فشل في تصدير البيانات', 'danger');
      const btn = document.getElementById('exportBtn');
      btn.innerHTML = '<i class="ri-file-excel-2-line"></i> تصدير CSV';
      btn.disabled = false;
    }
  }

  function updateStats(list) {
    const late = list.filter(s => s.isLate).length;
    document.getElementById('statsRow').textContent = list.length
      ? `${CBS.arCount(list.length, ['تسليم واحد', 'تسليمان', 'تسليمات', 'تسليماً'])}${late ? ` · ${late} متأخر` : ''}` : '';
    // أعداد الشرائح من كل التسليمات (لا من المصفّاة) ليعرف المستخدم ما في كل حالة
    const count = st => allSubs.filter(s => !st || s.status === st).length;
    document.querySelectorAll('#statusChips [data-c]').forEach(el => { const c = el.dataset.c; el.textContent = count(c === 'all' ? '' : c) || ''; });
    const cur = document.getElementById('filterStatus').value;
    document.querySelectorAll('#statusChips .ui-chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === cur)));
  }
  document.getElementById('statusChips').addEventListener('click', e => {
    const b = e.target.closest('.ui-chip'); if (!b) return;
    document.getElementById('filterStatus').value = b.dataset.s;
    loadSubmissions();
  });

  async function loadNotSubmitted(assignId) {
    try {
      const res  = await CBS.apiGet(`/api/submissions/assignment/${assignId}/not-submitted`);
      const data = await CBS.readJson(res);
      const card = document.getElementById('notSubCard');
      // الخادم يغلّف الحمولة داخل data (utils/response.js)
      const notSubmitted = data.data?.notSubmitted || data.notSubmitted || [];
      if (!notSubmitted.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      const totalStudents = data.data?.totalStudents ?? data.totalStudents;
      document.getElementById('notSubCount').textContent = totalStudents ? `${notSubmitted.length} من ${totalStudents}` : notSubmitted.length;
      document.getElementById('notSubList').innerHTML = notSubmitted.map(st => `
        <div class="hm-row"><span class="ms-av">${CBS.escapeHTML((st.name || '?').trim()[0])}</span>
          <div class="hm-row-body"><div class="hm-row-title">${CBS.escapeHTML(st.name)}</div><div class="hm-row-meta">${CBS.escapeHTML(st.email || '')}</div></div>
          <span class="hm-row-end"><span class="hm-chip" data-tone="danger">لم يسلّم</span></span></div>`).join('');
    } catch(e) {
      // لوحة ثانوية — لا نُزعج المستخدم برسالة، لكن لا نبتلع الخطأ بصمت تام
      console.warn('loadNotSubmitted:', e.message);
      const card = document.getElementById('notSubCard');
      if (card) card.style.display = 'none';
    }
  }

  function openGrade(id) {
    currentSubId = id;
    const s = allSubs.find(x => x._id === id);
    // textContent يتولى الهروب، والاسم لم يعد يُمرَّر عبر onclick (اسم فيه ' كان يكسر الزر)
    document.getElementById('gradeModalTitle').textContent = `تقييم الطالب: ${s?.student?.name || ''}`;
    if (s) {
      document.getElementById('subInfo').innerHTML = `
        <strong>الطالب:</strong> ${CBS.escapeHTML(s.student?.name || '')}<br>
        <strong>التكليف:</strong> ${CBS.escapeHTML(s.assignment?.title || '')}<br>
        <strong>تاريخ التسليم:</strong> ${CBS.formatDateTime(s.submissionDate)}`;
      document.getElementById('gradeInput').value    = s.grade ?? '';
      document.getElementById('feedbackInput').value = s.feedback || '';
    }
    CBS.hideAlert('gradeModalAlert');
    CBS.openModal('gradeModal');
  }

  async function saveGrade() {
    const grade    = parseInt(document.getElementById('gradeInput').value);
    const feedback = document.getElementById('feedbackInput').value;
    if (isNaN(grade) || grade < 0 || grade > 100) {
      CBS.showAlert('gradeModalAlert', 'الرجاء إدخال درجة من 0 إلى 100', 'danger'); return;
    }
    try {
      const res = await CBS.apiPost(`/api/submissions/${currentSubId}/grade`, { grade, feedback }, 'PUT');
      if (res.ok) {
        CBS.toast('تم حفظ التقييم بنجاح', '', 'success');
        CBS.closeModal('gradeModal');
        loadSubmissions();
      } else {
        CBS.showAlert('gradeModalAlert', 'فشل حفظ التقييم', 'danger');
      }
    } catch(e) { CBS.showAlert('gradeModalAlert', 'خطأ في الاتصال', 'danger'); }
  }

  init();
</script>
</body>
</html>
