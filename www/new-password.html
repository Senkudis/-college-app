<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>if(localStorage.getItem('darkMode')==='true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تعيين كلمة مرور جديدة | كلية النصر التقنية</title>
  <link href="/vendor/remixicon/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=2026102722">
  <link rel="stylesheet" href="/css/ui.css?v=2026102722">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#0d3b66,#1e6091); }
    .auth-card { background:var(--bg-card); border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); width:90%; max-width:440px; padding:40px; }
    .auth-logo { width:64px; height:64px; border-radius:50%; background:var(--primary-light); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
    .auth-logo img { width:46px; height:46px; object-fit:contain; }
    .auth-title { font-size:1.3rem; font-weight:800; color:var(--text-main); margin-bottom:6px; text-align:center; }
    .auth-sub { font-size:0.85rem; color:var(--text-muted); margin-bottom:24px; text-align:center; }
    .strength-bar { height:4px; border-radius:2px; margin-top:6px; background:var(--border); overflow:hidden; }
    .strength-fill { height:100%; border-radius:2px; transition:all 0.4s; width:0; }
    .strength-text { font-size:0.78rem; margin-top:4px; }
    .footer-note { margin-top:24px; font-size:0.78rem; color:rgba(255,255,255,0.6); }
  </style>

  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/auth.css?v=2026102722">
</head>
<body>

<div class="auth-card">
  <div class="auth-logo"><img src="/assets/logo.png" alt="شعار كلية النصر التقنية - جامعة النصر التقنية"></div>
  <div class="auth-title">تعيين كلمة مرور جديدة</div>
  <div class="auth-sub">يجب أن تكون كلمة المرور 6 أحرف على الأقل</div>

  <div id="alertMsg" class="alert" role="alert"></div>

  <form onsubmit="event.preventDefault(); resetPassword();">
    <div class="form-group">
      <label class="form-label" for="newPass">كلمة المرور الجديدة</label>
      <div class="input-wrapper">
        <i class="input-icon ri-lock-line"></i>
        <input class="form-control" type="password" id="newPass" placeholder="••••••••" required>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPass">تأكيد كلمة المرور</label>
      <div class="input-wrapper">
        <i class="input-icon ri-lock-check-line"></i>
        <input class="form-control" type="password" id="confirmPass" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">
      <span class="spinner" id="spinner" style="display:none;"></span>
      <span id="btnText">تغيير كلمة المرور</span>
    </button>
  </form>
</div>

<div class="footer-note">جميع الحقوق محفوظة © <span id="year"></span> النظام الجامعي المتكامل</div>

<script src="/js/shared.js?v=2026102722"></script>
<script src="/js/app.js?v=2026102722"></script>
<script>
  CBS.setYear(); CBS.initDarkMode();

  const tempToken = new URLSearchParams(location.search).get('tempToken');
  if (!tempToken) location.href = '/forgot-password.html';

  document.getElementById('newPass').addEventListener('input', function() {
    const p = this.value; const len = p.length;
    let w = 0, cls = '', label = '';
    if      (len < 6)  { w=15; cls='#ef4444'; label='ضعيفة جداً'; }
    else if (len < 8)  { w=35; cls='#f59e0b'; label='مقبولة'; }
    else if (len < 10) { w=60; cls='#f59e0b'; label='متوسطة'; }
    else if (/[A-Z]/.test(p) && /\d/.test(p) && /[^A-Za-z0-9]/.test(p)) { w=100; cls='#10b981'; label='قوية جداً'; }
    else               { w=80;  cls='#10b981'; label='جيدة'; }
    document.getElementById('strengthFill').style.cssText = `width:${w}%; background:${cls}`;
    document.getElementById('strengthText').textContent  = label;
    document.getElementById('strengthText').style.color  = cls;
  });

  async function resetPassword() {
    const np = document.getElementById('newPass').value;
    const cp = document.getElementById('confirmPass').value;
    CBS.hideAlert('alertMsg');

    if (!np || !cp) { CBS.showAlert('alertMsg', 'الرجاء ملء جميع الحقول', 'danger'); return; }
    if (np.length < 6) { CBS.showAlert('alertMsg', 'كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning'); return; }
    if (np !== cp) { CBS.showAlert('alertMsg', 'كلمتا المرور غير متطابقتين', 'danger'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('btnText').textContent = 'جاري التغيير...';

    try {
      const res  = await fetch(API_BASE + '/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({tempToken, newPassword:np, confirmPassword:cp}) });
      const data = await res.json();
      btn.disabled = false; document.getElementById('spinner').style.display = 'none'; document.getElementById('btnText').textContent = 'تغيير كلمة المرور';

      if (!res.ok) { CBS.showAlert('alertMsg', data.message || 'حدث خطأ', 'danger'); return; }
      CBS.showAlert('alertMsg', 'تم تغيير كلمة المرور بنجاح! جاري التحويل...', 'success');
      setTimeout(() => location.href = '/login.html', 2500);
    } catch {
      btn.disabled = false; document.getElementById('spinner').style.display = 'none'; document.getElementById('btnText').textContent = 'تغيير كلمة المرور';
      CBS.showAlert('alertMsg', 'خطأ في الاتصال بالخادم', 'danger');
    }
  }
</script>
</body>
</html>
